name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Check Pages build']
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Never execute PR code. Only main's scripts, dependencies and layouts run.
    # Branch pushes signal a trusted main build; PR checks never publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: '2.5.23'

      - name: Install trusted main dependencies
        run: bundle install

      - name: Test preview builder
        run: python3 -m unittest discover -s scripts -p 'test_pages*.py'

      - name: Build production and branch previews
        run: python3 scripts/build-pages.py --output _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
