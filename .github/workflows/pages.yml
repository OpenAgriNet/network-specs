name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Check Pages build']
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  # Ignored PR completions must not replace a queued push deployment.
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event != 'push' && format('pages-ignored-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      trusted-sha: ${{ steps.plan.outputs.trusted-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        run: |
          echo "matrix=$(python3 scripts/assemble-pages.py plan)" >> "$GITHUB_OUTPUT"
          echo "trusted-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: '2.5.23'

      - name: Install branch dependencies without deployment credentials
        run: bundle install
      - name: Build this revision with its own layouts
        env:
          SITE_BASE: ${{ matrix.base }}
        run: |
          ruby scripts/generate-schema-pages.rb
          bundle exec jekyll build --safe --baseurl "$SITE_BASE" --destination _site
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _site/
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.trusted-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: downloaded-sites
      - name: Assemble static outputs using only trusted code
        env:
          SITE_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python3 -I scripts/assemble-pages.py assemble --matrix "$SITE_MATRIX" --artifacts downloaded-sites --output _site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
