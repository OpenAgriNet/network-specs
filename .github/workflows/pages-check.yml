name: Check Pages build
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: '2.5.23'
      - run: bundle install
      - run: python3 -m unittest discover -s scripts -p 'test_pages*.py'
      - run: ruby scripts/generate-schema-pages.rb
      - run: bundle exec jekyll build --safe --destination _site
