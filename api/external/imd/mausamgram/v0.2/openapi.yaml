openapi: 3.1.1
info:
  title: Mausamgram daily coordinate forecast
  version: 0.2.0
  description: >
    Native coordinate-based forecast, distinct from station forecasts and advisory bulletins. This is not a Beckn operation or an official provider guarantee.
servers: [{url: 'https://mausamgram.imd.gov.in/nwpapi'}]
paths:
  /get-daily:
    get:
      operationId: getMausamgramDaily
      parameters:
        - {in: query, name: lat, required: true, schema: {$ref: '#/components/schemas/Latitude'}, example: 18.5}
        - {in: query, name: lon, required: true, schema: {$ref: '#/components/schemas/Longitude'}, example: 73.8}
      responses:
        '200':
          description: Caller consumes up to five forecast days; without day 1 or 2 it emits no provider results. Units below are the adapter's interpretation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MausamgramForecastResponse'}
              example: {fcstday1: {date: '2026-09-18', rain: 2, tmin: 21, tmax: 29, rhmin: 50, rhmax: 80, wspd: 3, wind: [0, N], cloud_message: Example conditions}}
        default: {description: HTTP failure; response shape not established.}
components:
  schemas:
    Latitude: {type: number, minimum: -90, maximum: 90}
    Longitude: {type: number, minimum: -180, maximum: 180}
    MausamgramForecastResponse:
      type: object
      anyOf: [{required: [fcstday1]}, {required: [fcstday2]}]
      properties:
        fcstday1: {$ref: '#/components/schemas/ForecastDay'}
        fcstday2: {$ref: '#/components/schemas/ForecastDay'}
        fcstday3: {$ref: '#/components/schemas/ForecastDay'}
        fcstday4: {$ref: '#/components/schemas/ForecastDay'}
        fcstday5: {$ref: '#/components/schemas/ForecastDay'}
        location: {type: object, properties: {lat: {type: [number, string]}, lon: {type: [number, string]}}}
    ForecastDay:
      type: object
      properties:
        date: {type: string}
        rain: {type: [string, number, 'null'], description: Rainfall in mm.}
        tmin: {type: [string, number, 'null'], description: Minimum temperature in Celsius.}
        tmax: {type: [string, number, 'null'], description: Maximum temperature in Celsius.}
        rhmin: {type: [string, number, 'null'], description: Minimum relative humidity in percent.}
        rhmax: {type: [string, number, 'null'], description: Maximum relative humidity in percent.}
        wspd: {type: [string, number, 'null'], description: Wind speed in m/s.}
        wind: {type: [array, 'null'], description: The caller reads the second element for direction.}
        weather_warning: {type: [string, 'null']}
        cloud_message: {type: [string, 'null']}
