openapi: 3.1.1
info:
  title: gfr/advice native requests
  version: 0.2.0
  x-contract-role: provider-native
servers:
- url: https://provider.example.invalid
  description: Non-routable placeholder; configure the provider service base URL.
paths:
  /:
    post:
      operationId: getRecommendations
      description: GraphQL operations share this endpoint. Only the soil-test lookup uses the
        generated bearer token.
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/app.service.ts#L4423
      x-oan-binding:
        descriptorCode: gfr-advice
        resourceType: openagrinet:AgricultureAdvisory
        action: select
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GfrAdviceResponse'
              examples:
                GfrAdvice:
                  value:
                    data:
                      getRecommendations: []
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful callback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GfrAdviceRequest'
            examples:
              GfrAdvice:
                value:
                  query: 'query GetRecommendations($state: ID!, $results: JSON!, $district:
                    ID, $crops: [ID!], $naturalFarming: Boolean) { getRecommendations(state:
                    $state results: $results district: $district crops: $crops naturalFarming:
                    $naturalFarming) }'
                  variables:
                    state: example
                    results:
                      n: 1
                      p: 1
                      k: 1
                      OC: 1
                    crops:
                    - example
                    naturalFarming: false
components:
  schemas:
    GfrAdviceRequest:
      type: object
      properties:
        query:
          type: string
          const: 'query GetRecommendations($state: ID!, $results: JSON!, $district: ID, $crops:
            [ID!], $naturalFarming: Boolean) { getRecommendations(state: $state results: $results
            district: $district crops: $crops naturalFarming: $naturalFarming) }'
        variables:
          type: object
          properties:
            state:
              type: string
            results:
              type: object
              properties:
                n:
                  type:
                  - number
                  - string
                  - 'null'
                p:
                  type:
                  - number
                  - string
                  - 'null'
                k:
                  type:
                  - number
                  - string
                  - 'null'
                OC:
                  type:
                  - number
                  - string
                  - 'null'
            crops:
              type: array
              items:
                type: string
            naturalFarming:
              type: boolean
          required:
          - state
          - results
          - crops
          - naturalFarming
      required:
      - query
      - variables
    GfrAdviceResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getRecommendations:
              type: array
              items: {}
