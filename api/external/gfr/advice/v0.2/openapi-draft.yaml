openapi: 3.1.1
info:
  title: gfr/advice native requests (implementation draft)
  version: 0.2.0-draft
  x-contract-role: provider-native
servers:
- url: https://provider.example.invalid
  description: Non-routable placeholder; configure the provider service base URL.
x-draft:
  catalogCandidate:
    descriptorCode: gfr-advice
    resourceType: openagrinet:AgricultureAdvisory
    informationMode: OnDemand
    publicationStatus: inactive-proposal
    actions:
    - action: select
      operationRef: '#/paths/~1/post'
      variant: GfrAdvice
      mapping: mappings/select.yaml
  proposedActions:
  - select
  needsConfirmation:
  - Pin deployed revision; validate sanitized success and failure responses and session
    handling before activation.
paths:
  "/":
    post:
      operationId: GfrGraphql
      description: GraphQL operations share this endpoint. Only the soil-test lookup
        uses the generated bearer token.
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/app.service.ts#L4420
      x-mappings:
      - mappings/internal/generateAccessToken.yaml
      - mappings/internal/getTestForAuthUser.yaml
      - mappings/select.yaml
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GfrTokenResponseVariants"
              examples:
                GfrToken:
                  value:
                    data:
                      generateAccessToken:
                        token: "<redacted>"
                GfrSoil:
                  value:
                    data:
                      getTestForAuthUser: []
                GfrAdvice:
                  value:
                    data:
                      getRecommendations: []
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful
            callback.
      security:
      - {}
      - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GfrTokenRequestVariants"
            examples:
              GfrToken:
                value:
                  query: 'query Query($refreshToken: String!) { generateAccessToken(refreshToken:
                    $refreshToken) }'
                  variables:
                    refreshToken: "<secret>"
              GfrSoil:
                value:
                  query: 'query GetTestForAuthUser($computedId: String, $phone: PhoneNumber,
                    $state: String, $district: String, $name: String, $farmer: String,
                    $from: Datetime, $to: Datetime, $cycle: String, $locale: String,
                    $scheme: String, $limit: Int, $skip: Int) { getTestForAuthUser(computedID:
                    $computedId, phone: $phone, state: $state, district: $district,
                    name: $name, farmer: $farmer, from: $from, to: $to, cycle: $cycle,
                    scheme: $scheme, limit: $limit, skip: $skip) { id computedID cycle
                    scheme plot { address area surveyNo } farmer { address name phone
                    } crop location testparameters rdfValues status testCompletedAt
                    sampleDate reportData district block village results fertilizer
                    html(locale: $locale) uniqueID } }'
                  variables:
                    cycle: 2025-26
                    phone: "<phone>"
                    limit: 1
                    skip: 0
                    locale: en
              GfrAdvice:
                value:
                  query: 'query GetRecommendations($state: ID!, $results: JSON!, $district:
                    ID, $crops: [ID!], $naturalFarming: Boolean) { getRecommendations(state:
                    $state results: $results district: $district crops: $crops naturalFarming:
                    $naturalFarming) }'
                  variables:
                    state: example
                    results:
                      n: 1
                      p: 1
                      k: 1
                      OC: 1
                    crops:
                    - example
                    naturalFarming: false
components:
  schemas:
    GfrTokenRequest:
      type: object
      properties:
        query:
          type: string
          const: 'query Query($refreshToken: String!) { generateAccessToken(refreshToken:
            $refreshToken) }'
        variables:
          type: object
          properties:
            refreshToken:
              type: string
          required:
          - refreshToken
      required:
      - query
      - variables
    GfrTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            generateAccessToken:
              type: object
              properties:
                token:
                  type: string
    GfrSoilRequest:
      type: object
      properties:
        query:
          type: string
          const: 'query GetTestForAuthUser($computedId: String, $phone: PhoneNumber,
            $state: String, $district: String, $name: String, $farmer: String, $from:
            Datetime, $to: Datetime, $cycle: String, $locale: String, $scheme: String,
            $limit: Int, $skip: Int) { getTestForAuthUser(computedID: $computedId,
            phone: $phone, state: $state, district: $district, name: $name, farmer:
            $farmer, from: $from, to: $to, cycle: $cycle, scheme: $scheme, limit:
            $limit, skip: $skip) { id computedID cycle scheme plot { address area
            surveyNo } farmer { address name phone } crop location testparameters
            rdfValues status testCompletedAt sampleDate reportData district block
            village results fertilizer html(locale: $locale) uniqueID } }'
        variables:
          type: object
          properties:
            cycle:
              type: string
            phone:
              type: string
            limit:
              type: integer
            skip:
              type: integer
            locale:
              type: string
          required:
          - cycle
          - phone
          - limit
          - skip
          - locale
      required:
      - query
      - variables
    GfrTokenRequestVariants:
      anyOf:
      - "$ref": "#/components/schemas/GfrTokenRequest"
      - "$ref": "#/components/schemas/GfrSoilRequest"
      - "$ref": "#/components/schemas/GfrAdviceRequest"
    GfrSoilResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getTestForAuthUser:
              type: array
              items: {}
    GfrTokenResponseVariants:
      anyOf:
      - "$ref": "#/components/schemas/GfrTokenResponse"
      - "$ref": "#/components/schemas/GfrSoilResponse"
      - "$ref": "#/components/schemas/GfrAdviceResponse"
    GfrAdviceRequest:
      type: object
      properties:
        query:
          type: string
          const: 'query GetRecommendations($state: ID!, $results: JSON!, $district:
            ID, $crops: [ID!], $naturalFarming: Boolean) { getRecommendations(state:
            $state results: $results district: $district crops: $crops naturalFarming:
            $naturalFarming) }'
        variables:
          type: object
          properties:
            state:
              type: string
            results:
              type: object
              properties:
                n:
                  type:
                  - number
                  - string
                  - 'null'
                p:
                  type:
                  - number
                  - string
                  - 'null'
                k:
                  type:
                  - number
                  - string
                  - 'null'
                OC:
                  type:
                  - number
                  - string
                  - 'null'
            crops:
              type: array
              items:
                type: string
            naturalFarming:
              type: boolean
          required:
          - state
          - results
          - crops
          - naturalFarming
      required:
      - query
      - variables
    GfrAdviceResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getRecommendations:
              type: array
              items: {}
  securitySchemes:
    session:
      type: http
      scheme: bearer
