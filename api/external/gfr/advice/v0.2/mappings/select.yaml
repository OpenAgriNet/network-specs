status: source-traced
deployable: false
action: select
native:
  method: POST
  path: "/"
  placement: graphql
  requestExample:
    query: 'query GetRecommendations($state: ID!, $results: JSON!, $district: ID,
      $crops: [ID!], $naturalFarming: Boolean) { getRecommendations(state: $state
      results: $results district: $district crops: $crops naturalFarming: $naturalFarming)
      }'
    variables:
      state: example
      results:
        n: 1
        p: 1
        k: 1
        OC: 1
      crops:
      - example
      naturalFarming: false
  operation: getRecommendations
source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/app.service.ts#L4423
caller: https://github.com/OpenAgriNet/bharat-oan-api/blob/bh-main/agents/tools/gfr.py#L737
behavior: stateId → state; use latest soil test results. The caller accepts districtId
  but this request omits district. Phone is not forwarded.
responseExample:
  data:
    getRecommendations: []
binding: Design only. The adapter must implement the described transport and guards
  before enabling this action.
