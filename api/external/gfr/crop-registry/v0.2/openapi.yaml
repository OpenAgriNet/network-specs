openapi: 3.1.1
info:
  x-contract-role: provider-native
  title: GFR crop-registry
  version: 0.2.0
  description: >
    Looks up crop registry records by state through the Soil Health GraphQL endpoint.
servers:
  - url: https://gfr.example.invalid
    description: Placeholder only. Use the complete GraphQL endpoint supplied by the provider, without appending a path.
paths:
  /:
    post:
      operationId: getCropRegistries
      x-oan-mapping: {href: ./mappings/select.yaml, status: draft-native}
      x-oan-binding: {descriptorCode: gfr-registry, resourceType: "openagrinet:AgricultureResource", action: select}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GfrCropRegistryRequest'
            example:
              query: 'query GetCropRegistries($state: String) { getCropRegistries(state: $state) { name variety
                irrigationType season splitdose state GFRavailable id combinedName __typename } }'
              variables:
                state: EXAMPLE-STATE
      responses:
        '200':
          description: GraphQL envelope before adapter conversion. An error or missing data is not a successful
            record lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GfrCropRegistryResponse'
              examples:
                found:
                  value:
                    data:
                      getCropRegistries:
                      - id: EXAMPLE-CROP
                        name: Example crop
                        season: Kharif
                        splitdose: true
                none:
                  value:
                    data:
                      getCropRegistries: []
                graphqlError:
                  value:
                    errors:
                    - message: Example upstream error
        default:
          description: Unspecified upstream HTTP failure. No authoritative error body or retry guarantee is documented.
components:
  schemas:
    GfrCropRegistryRequest:
      type: object
      required:
      - query
      - variables
      properties:
        query:
          const: 'query GetCropRegistries($state: String) { getCropRegistries(state: $state) { name variety irrigationType
            season splitdose state GFRavailable id combinedName __typename } }'
        variables:
          type: object
          properties:
            state:
              type: string
          required:
          - state
    GfrCropRegistryResponse:
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
          properties:
            getCropRegistries:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/CropRegistryRecord'
          required:
          - getCropRegistries
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
      anyOf:
      - required:
        - data
      - required:
        - errors
    CropRegistryRecord:
      type: object
      properties:
        id: {}
        name:
          type:
          - string
          - 'null'
        variety:
          type:
          - string
          - 'null'
        irrigationType:
          type:
          - string
          - 'null'
        season:
          type:
          - string
          - 'null'
        splitdose: {}
        state:
          type:
          - object
          - 'null'
          properties:
            _id:
              type: string
            name:
              type: string
            code:
              type:
              - string
              - integer
        GFRavailable: {}
        combinedName:
          type:
          - string
          - 'null'
        __typename:
          type:
          - string
          - 'null'
      description: Fields selected by the adapter. Unconstrained fields are provider data for which the selected
        GraphQL query does not establish a reliable scalar type; this does not describe the full provider schema.
