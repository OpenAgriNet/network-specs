openapi: 3.1.1
info:
  title: PMFBY grievance integration contract
  version: 0.3.0
  description: Draft for review. Proposed OAN adapter payloads for this external service. Not an
    official provider API specification. Paths are illustrative; authentication, errors and Beckn
    wire bindings are not defined. Examples are synthetic.
servers:
- url: https://adapter.example.invalid
  description: Non-operational review placeholder

# One operation per Beckn action.
paths:
  /support:
    post:
      operationId: PMFBYSupport
      x-beckn-action: support
      summary: File a new grievance
      description: Proposed adapter-facing synchronous operation for consumer review. Not a deployed
        provider URL or a complete Beckn wire envelope. Authentication and the final Beckn binding
        require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMFBYSupportRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMFBYSupportResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream errors or
            personal data.
  /status:
    post:
      operationId: PMFBYStatus
      x-beckn-action: status
      summary: Read where a filed grievance stands
      description: Proposed adapter-facing synchronous operation for consumer review. Not a deployed
        provider URL or a complete Beckn wire envelope. Authentication and the final Beckn binding
        require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMFBYStatusRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMFBYStatusResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream errors or
            personal data.

components:
  schemas:

    # ------------------------------------------------------------------
    # 1. Messages. Each is the pack's GrievanceRequest or GrievanceResponse
    #    with apiProperties narrowed to this Provider's fields.
    # ------------------------------------------------------------------
    PMFBYSupportRequest:
      allOf:
      - $ref: '../../../../../schema/Grievance/v0.3/attributes.yaml#/components/schemas/GrievanceRequest'
      properties:
        apiProperties:
          $ref: '#/components/schemas/PMFBYSupportInput'
    PMFBYSupportResponse:
      allOf:
      - $ref: '../../../../../schema/Grievance/v0.3/attributes.yaml#/components/schemas/GrievanceResponse'
      required:
      - apiProperties
      properties:
        apiProperties:
          $ref: '#/components/schemas/PMFBYSupportOutput'
    PMFBYStatusRequest:
      allOf:
      - $ref: '../../../../../schema/Grievance/v0.3/attributes.yaml#/components/schemas/GrievanceRequest'
      properties:
        apiProperties:
          $ref: '#/components/schemas/PMFBYStatusInput'
    PMFBYStatusResponse:
      allOf:
      - $ref: '../../../../../schema/Grievance/v0.3/attributes.yaml#/components/schemas/GrievanceResponse'
      required:
      - apiProperties
      properties:
        apiProperties:
          $ref: '#/components/schemas/PMFBYStatusOutput'

    # ------------------------------------------------------------------
    # 2. Catalog entry. The pack's GrievanceCatalog, pinned to PMFBY.
    # ------------------------------------------------------------------
    PMFBYCatalog:
      allOf:
      - $ref: '../../../../../schema/Grievance/v0.3/attributes.yaml#/components/schemas/GrievanceCatalog'
      required:
      - apiProperties
      properties:
        about:
          properties:
            kind:
              const: Scheme
            code:
              const: PMFBY
        actions:
          items:
            properties:
              action:
                enum:
                - status
                - support
              operation:
                pattern: ^https://openagrinet\.github\.io/network-specs/api/external/pmfby/grievance/v0\.3/openapi\.yaml#/paths/
        apiProperties:
          $ref: '#/components/schemas/PMFBYCatalogProperties'
    PMFBYCatalogProperties:
      type: object
      additionalProperties: false
      description: What PMFBY publishes beyond the pack's fixed fields.
      required:
      - grievanceOptions
      properties:
        grievanceOptions:
          type: object
          additionalProperties: false
          description: The categories a grievance can be filed under.
          required:
          - categories
          - subCategories
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Top-level grievance categories.
              items:
                $ref: '#/components/schemas/PublishedOption'
            subCategories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Sub-categories under those.
              items:
                $ref: '#/components/schemas/PublishedOption'

    # ------------------------------------------------------------------
    # 3. PMFBY's own fields, one schema per direction per operation.
    # ------------------------------------------------------------------
    PMFBYSupportInput:
      type: object
      additionalProperties: false
      description: What PMFBY needs to file a grievance.
      required:
      - applicantMobile
      - cropYear
      - enrolmentId
      - grievance
      - provider
      - season
      properties:
        applicantMobile:
          $ref: '#/components/schemas/ApplicantMobile'
        complaintDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: The caller's own filing date, where case.filedOn is the portal's.
          x-jsonld-id: openagrinet:complaintDate
        cropYear:
          $ref: '#/components/schemas/CropYear'
        enrolmentId:
          $ref: '#/components/schemas/EnrolmentId'
        grievance:
          type: object
          additionalProperties: false
          description: The grievance itself.
          x-jsonld-id: openagrinet:grievance
          required:
          - description
          properties:
            category:
              $ref: '#/components/schemas/GrievanceOption'
              required:
              - code
            subCategory:
              $ref: '#/components/schemas/GrievanceOption'
              required:
              - code
            description:
              $ref: '#/components/schemas/GrievanceDescription'
        provider:
          type: object
          additionalProperties: false
          description: The desk the grievance is filed with.
          x-jsonld-id: openagrinet:provider
          required:
          - descriptor
          - id
          properties:
            descriptor:
              type: object
              additionalProperties: false
              description: How the desk is named.
              required:
              - name
              properties:
                name:
                  $ref: '#/components/schemas/DeskName'
            id:
              $ref: '#/components/schemas/DeskId'
        receiptSourceId:
          type: string
          pattern: ^[0-9]+$
          maxLength: 16
          description: The channel the complaint arrived through. Names the channel, not the farmer.
          x-jsonld-id: openagrinet:receiptSourceId
        season:
          $ref: '#/components/schemas/Season'

    PMFBYSupportOutput:
      type: object
      additionalProperties: false
      description: What PMFBY returns once the grievance is filed.
      required:
      - case
      properties:
        case:
          type: object
          additionalProperties: false
          description: The case opened for this grievance.
          x-jsonld-id: openagrinet:case
          required:
          - ticketNo
          properties:
            filedOn:
              $ref: '#/components/schemas/FiledOn'
            status:
              $ref: '#/components/schemas/CaseStatus'
            ticketNo:
              $ref: '#/components/schemas/TicketNo'
        enrolmentId:
          $ref: '#/components/schemas/EnrolmentId'
        grievance:
          type: object
          additionalProperties: false
          description: The grievance itself.
          x-jsonld-id: openagrinet:grievance
          properties:
            category:
              $ref: '#/components/schemas/GrievanceOption'
            subCategory:
              $ref: '#/components/schemas/GrievanceOption'
            description:
              $ref: '#/components/schemas/GrievanceDescription'
        provider:
          type: object
          additionalProperties: false
          description: The desk the grievance is filed with.
          x-jsonld-id: openagrinet:provider
          properties:
            descriptor:
              type: object
              additionalProperties: false
              description: How the desk is named.
              properties:
                name:
                  $ref: '#/components/schemas/DeskName'
            id:
              $ref: '#/components/schemas/DeskId'

    PMFBYStatusInput:
      type: object
      additionalProperties: false
      description: What PMFBY needs to find a filed grievance.
      required:
      - applicantMobile
      - case
      properties:
        applicantMobile:
          $ref: '#/components/schemas/ApplicantMobile'
        case:
          type: object
          additionalProperties: false
          description: The case to read.
          x-jsonld-id: openagrinet:case
          required:
          - ticketNo
          properties:
            ticketNo:
              $ref: '#/components/schemas/TicketNo'
        cropYear:
          $ref: '#/components/schemas/CropYear'
        enrolmentId:
          $ref: '#/components/schemas/EnrolmentId'
        season:
          $ref: '#/components/schemas/Season'

    PMFBYStatusOutput:
      type: object
      additionalProperties: false
      description: Where the filed grievance stands.
      required:
      - case
      properties:
        case:
          type: object
          additionalProperties: false
          description: The case opened for this grievance.
          x-jsonld-id: openagrinet:case
          required:
          - status
          properties:
            cropName:
              type: string
              minLength: 1
              maxLength: 120
              description: The crop the case concerns.
              x-jsonld-id: openagrinet:cropName
            filedOn:
              $ref: '#/components/schemas/FiledOn'
            reply:
              type: string
              minLength: 1
              maxLength: 2000
              description: The desk's reply to the grievance.
              x-oan-pii:
                class: freetext
                handling:
                - no-log
                - no-trace
              x-jsonld-id: openagrinet:caseReply
            status:
              $ref: '#/components/schemas/CaseStatus'
              required:
              - code
            ticketNo:
              $ref: '#/components/schemas/TicketNo'
        cropYear:
          $ref: '#/components/schemas/CropYear'
        enrolmentId:
          $ref: '#/components/schemas/EnrolmentId'
        grievance:
          type: object
          additionalProperties: false
          description: The grievance itself.
          x-jsonld-id: openagrinet:grievance
          properties:
            category:
              $ref: '#/components/schemas/GrievanceOption'
            subCategory:
              $ref: '#/components/schemas/GrievanceOption'
            description:
              $ref: '#/components/schemas/GrievanceDescription'
        season:
          $ref: '#/components/schemas/Season'

    # ------------------------------------------------------------------
    # 4. Fields used more than once. Defined here, referenced above.
    # ------------------------------------------------------------------
    ApplicantMobile:
      type: string
      pattern: ^[6-9][0-9]{9}$
      description: The farmer's mobile, which the portal files the ticket against.
      x-oan-pii:
        class: contact
        handling:
        - no-log
        - no-trace
        - no-echo
      x-jsonld-id: openagrinet:applicantMobile
    EnrolmentId:
      type: string
      minLength: 10
      maxLength: 30
      not:
        pattern: ^[0-9]{12}$
      description: The enrolment the grievance is about, as the scheme numbers it. Never an Aadhaar
        number.
      x-oan-pii:
        class: identifier
        handling:
        - no-log
        - no-trace
      x-jsonld-id: openagrinet:enrolmentId
    CropYear:
      type: string
      pattern: ^[0-9]{4}$
      description: The crop year of the enrolment.
      x-jsonld-id: openagrinet:cropYear
    Season:
      type: string
      enum:
      - Kharif
      - Rabi
      - Zaid
      description: The season of the enrolment.
      x-jsonld-id: openagrinet:season
    TicketNo:
      type: string
      pattern: ^[0-9]+$
      maxLength: 32
      description: The handle the portal issued for the case.
      x-jsonld-id: openagrinet:ticketNo
    FiledOn:
      type: string
      format: date
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      description: When the grievance was filed.
      x-jsonld-id: openagrinet:filedOn
    CaseStatus:
      type: object
      additionalProperties: false
      description: Where the case stands.
      x-jsonld-id: openagrinet:caseStatus
      properties:
        code:
          type: string
          enum:
          - Registered
          - UnderReview
          - AwaitingApplicant
          - Replied
          - Resolved
          - Rejected
          - Closed
          description: The status the desk reports.
    GrievanceDescription:
      type: string
      minLength: 10
      maxLength: 2000
      description: What went wrong, in the farmer's own words.
      x-oan-pii:
        class: freetext
        handling:
        - no-log
        - no-trace
      x-jsonld-id: openagrinet:grievanceDescription
    GrievanceOption:
      type: object
      additionalProperties: false
      description: The published category or sub-category a grievance falls under.
      properties:
        code:
          type: string
          pattern: ^[0-9]+$
          description: Code of the published option.
        name:
          type: string
          minLength: 1
          description: The option's label.
    PublishedOption:
      type: object
      additionalProperties: false
      description: A grievance category or sub-category PMFBY publishes.
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]+$
          description: Code identifying the option.
          x-jsonld-id: openagrinet:optionCode
        name:
          type: string
          minLength: 1
          description: The option's label.
          x-jsonld-id: openagrinet:optionName
        help:
          type: string
          minLength: 1
          description: When to pick this option.
          x-jsonld-id: openagrinet:optionHelp
    DeskName:
      type: string
      minLength: 1
      maxLength: 200
      description: The desk's display name.
    DeskId:
      type: string
      pattern: ^[a-z0-9][a-z0-9.-]*$
      maxLength: 100
      description: Stable identifier for the desk.
