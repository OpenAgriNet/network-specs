          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
