          required:
          - descriptor
          - id
        receiptSourceId:
          type: string
          pattern: ^[0-9]+$
          maxLength: 16
          description: The channel the complaint arrived through. Names the channel,
            not the farmer.
          x-jsonld-id: openagrinet:receiptSourceId
        scheme:
          type: object
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
          properties:
            code:
              const: PMFBY
              type: string
              enum:
              - PMFBY
              description: Short code naming the scheme.
