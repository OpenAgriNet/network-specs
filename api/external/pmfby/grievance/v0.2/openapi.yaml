    PMFBYCatalog:
      externalDocs:
        description: PMFBY grievance API specification
        url: https://openagrinet.github.io/network-specs/api/external/pmfby/grievance/v0.2/openapi.yaml
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - grievanceOptions
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              const: PMFBY
              type: string
              enum:
              - PMFBY
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context
            array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        grievanceOptions:
          type: object
          additionalProperties: false
          required:
          - categories
          - subCategories
          description: The categories a grievance can be filed under.
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Top-level grievance categories.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category or sub-category PMFBY publishes.
                properties:
                  code:
                    type: string
                    pattern: ^[0-9]+$
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceCategoryOption
            subCategories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Sub-categories under those.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category or sub-category PMFBY publishes.
                properties:
                  code:
                    type: string
                    pattern: ^[0-9]+$
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceSubCategoryOption
          x-jsonld-id: openagrinet:grievanceOptions
        actions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Every call this desk serves.
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - description
            - schema
            - attributesAt
            properties:
              action:
                type: string
                enum:
                - init
                - status
                - support
                description: The Beckn action this entry describes.
                x-jsonld-id: openagrinet:actionName
              description:
                type: string
                minLength: 1
                maxLength: 400
                description: What the call does, in the desk's own words.
                x-jsonld-id: openagrinet:actionDescription
              schema:
                type: string
                format: uri
                description: Request attributes schema in the external API contract.
                  Earlier mixed-schema URLs remain accepted for compatibility. Response
                  schemas are defined in the API document.
                x-jsonld-id: openagrinet:actionSchema
              attributesAt:
                type: string
                pattern: ^\$\.message\.[A-Za-z0-9.\[\]]+$
                description: Where the call's attributes sit in the Beckn payload.
                x-jsonld-id: openagrinet:actionAttributesAt
            oneOf:
            - properties:
                action:
                  const: support
                description:
                  default: File a new grievance. Needs the enrolment number, the applicant's
                    mobile, the crop year, the season and a description of the problem.
                    Returns case.ticketNo, which status requires. Needs no OTP, so
                    it can be called without init.
