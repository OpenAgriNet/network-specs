          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        case:
          type: object
          additionalProperties: false
          description: The case opened for this grievance.
          x-jsonld-id: openagrinet:case
          properties:
            cropName:
              type: string
              minLength: 1
              maxLength: 120
              description: The crop the case concerns.
              x-jsonld-id: openagrinet:cropName
            filedOn:
              type: string
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              description: When the grievance was filed.
              x-jsonld-id: openagrinet:filedOn
            reply:
              type: string
              minLength: 1
              maxLength: 2000
              description: The desk's reply to the grievance.
              x-oan-pii:
                class: freetext
                handling:
                - no-log
                - no-trace
              x-jsonld-id: openagrinet:caseReply
            status:
              type: object
              additionalProperties: false
              description: Where the case stands.
              x-jsonld-id: openagrinet:caseStatus
              properties:
                code:
                  type: string
                  enum:
                  - Registered
                  - UnderReview
                  - AwaitingApplicant
                  - Replied
                  - Resolved
                  - Rejected
                  - Closed
                  description: The status the desk reports.
              required:
              - code
            ticketNo:
              type: string
              pattern: ^[0-9]+$
              maxLength: 32
              description: The handle the portal issued for the case.
              x-jsonld-id: openagrinet:ticketNo
          required:
          - status
        cropYear:
          type: string
          pattern: ^[0-9]{4}$
          description: The crop year of the enrolment.
          x-jsonld-id: openagrinet:cropYear
        enrolmentId:
          type: string
          minLength: 10
          maxLength: 30
          not:
            pattern: ^[0-9]{12}$
          description: The enrolment the grievance is about, as the scheme numbers
            it. Never an Aadhaar number.
          x-oan-pii:
            class: identifier
            handling:
            - no-log
            - no-trace
          x-jsonld-id: openagrinet:enrolmentId
        grievance:
          type: object
          additionalProperties: false
          description: The grievance itself.
          x-jsonld-id: openagrinet:grievance
          properties:
            category:
              type: object
              additionalProperties: false
              description: The published category this grievance falls under.
              properties:
                code:
                  type: string
                  pattern: ^[0-9]+$
                  description: Code of the published option.
                name:
                  type: string
                  minLength: 1
                  description: The option's label.
            description:
              type: string
              minLength: 10
              maxLength: 2000
              description: What went wrong, in the farmer's own words.
              x-oan-pii:
                class: freetext
                handling:
                - no-log
                - no-trace
              x-jsonld-id: openagrinet:grievanceDescription
            subCategory:
              type: object
              additionalProperties: false
              description: The published sub-category this grievance falls under.
              properties:
                code:
                  type: string
                  pattern: ^[0-9]+$
                  description: Code of the published option.
                name:
                  type: string
                  minLength: 1
                  description: The option's label.
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        scheme:
          type: object
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
          properties:
            code:
              const: PMFBY
              type: string
              enum:
              - PMFBY
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          required:
          - code
        season:
          type: string
          enum:
          - Kharif
          - Rabi
          - Zaid
          description: The season of the enrolment.
          x-jsonld-id: openagrinet:season
      required:
      - '@context'
      - '@type'
      - case
      - informationMode
      - scheme
