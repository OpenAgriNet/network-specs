openapi: 3.1.1
info:
  title: PMFBY grievance provider API
  version: 0.2.0
  x-contract-role: provider-native
  description: >
    Files grievance tickets and reads their status through FGMS.
servers:
- url: https://pmfby.example.invalid
  description: Placeholder for the PMFBY FGMS service base URL.
paths:
  /krphapi/FGMS/AddKRPHNCIPGrievenceSupportTicket:
    post:
      operationId: filePmfbyGrievance
      summary: File a PMFBY grievance
      x-oan-binding:
        action: support
        resourceType: openagrinet:Grievance
        descriptorCode: pmfby-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilePmfbyGrievanceRequest'
            example:
              requestorMobileNo: '9000000000'
              applicationNo: DEMO-APP-01
              requestYear: '2026'
              requestSeason: '1'
              ticketCategoryID: '3'
              ticketSubCategoryID: '10'
              grievenceDescription: The policy record has the wrong crop.
              complaintDate: '2026-10-12'
              receiptSourceID: EXAMPLE-SOURCE
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePmfbyGrievanceResponse2XX'
              example:
                responseCode: '1'
                responseDynamic:
                  GrievenceSupportTicketNo: '10000001'
        default:
          description: Other HTTP response. No stable error body is established by the source.
      description: No applicant OTP is sent or checked. The adapter sends the season and category and source codes as strings.
        The legacy client sends them as numbers. A responseCode of 1 with a ticket can mean a new or existing ticket.
      security:
      - PMFBYAuthorization: []
      x-oan-mapping:
        href: ./mappings/support.yaml
        status: existing
        scope: adapter-action
  /krphapi/FGMS/GetGrievenceTicketsStatus:
    post:
      operationId: readPmfbyGrievance
      summary: Read a PMFBY grievance
      x-oan-binding:
        action: status
        resourceType: openagrinet:Grievance
        descriptorCode: pmfby-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadPmfbyGrievanceRequest'
            example:
              requestorMobileNo: '9000000000'
              GrievenceSupportTicketNo: '10000001'
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadPmfbyGrievanceResponse2XX'
              example:
                responseCode: '1'
                responseDynamic:
                - GrievenceSupportTicketNo: '10000001'
                  ApplicationNo: DEMO-APP-01
                  TicketStatus: Open
                  InsertDateTime: '2026-10-12T11:00:00Z'
        default:
          description: Other HTTP response. No stable error body is established by the source.
      description: The provider can return several records for the mobile number. The adapter selects the record with the
        exact requested ticket number.
      security:
      - PMFBYAuthorization: []
      x-oan-mapping:
        href: ./mappings/status.yaml
        status: existing
        scope: adapter-action
components:
  securitySchemes:
    PMFBYAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Provider-issued FGMS service token. This is not an applicant OTP.
  schemas:
    FilePmfbyGrievanceRequest:
      type: object
      properties:
        requestorMobileNo:
          type: string
          example: '9000000000'
        applicationNo:
          type: string
          example: DEMO-APP-01
        requestYear:
          type: string
          example: '2026'
        requestSeason:
          oneOf:
          - type: number
          - type: string
          example: '1'
        ticketCategoryID:
          oneOf:
          - type: number
          - type: string
          example: '3'
        ticketSubCategoryID:
          oneOf:
          - type: number
          - type: string
          example: '10'
        grievenceDescription:
          type: string
          example: The policy record has the wrong crop.
        complaintDate:
          type: string
          format: date
          example: '2026-10-12'
        receiptSourceID:
          oneOf:
          - type: number
          - type: string
          description: Provider-assigned source code.
      required:
      - requestorMobileNo
      - applicationNo
      - requestYear
      - requestSeason
      - ticketCategoryID
      - ticketSubCategoryID
      - grievenceDescription
      - complaintDate
      - receiptSourceID
    FilePmfbyGrievanceResponse2XX:
      type: object
      properties:
        responseCode:
          oneOf:
          - type: number
          - type: string
        responseMessage:
          type:
          - string
          - 'null'
        responseDynamic:
          oneOf:
          - type: object
            properties:
              GrievenceSupportTicketNo:
                oneOf:
                - type: number
                - type: string
              GrievenceSupportTicketID:
                oneOf:
                - type: number
                - type: string
          - type: 'null'
    ReadPmfbyGrievanceRequest:
      type: object
      properties:
        requestorMobileNo:
          type: string
          example: '9000000000'
        GrievenceSupportTicketNo:
          type: string
          example: '10000001'
      required:
      - requestorMobileNo
      - GrievenceSupportTicketNo
    ReadPmfbyGrievanceResponse2XX:
      type: object
      properties:
        responseCode:
          oneOf:
          - type: number
          - type: string
        responseMessage:
          type:
          - string
          - 'null'
        responseDynamic:
          oneOf:
          - type: object
            properties:
              GrievenceSupportTicketNo:
                type:
                - number
                - string
                - 'null'
              ApplicationNo:
                type:
                - string
                - 'null'
              TicketStatus:
                type:
                - string
                - 'null'
              RequestYear:
                type:
                - number
                - string
                - 'null'
              RequestSeason:
                type:
                - number
                - string
                - 'null'
              InsertDateTime:
                type:
                - string
                - 'null'
              latestRemark:
                type:
                - string
                - 'null'
              GrievenceDescription:
                type:
                - string
                - 'null'
              TicketCategoryID:
                type:
                - number
                - string
                - 'null'
              TicketCategoryName:
                type:
                - string
                - 'null'
              TicketSubCategoryID:
                type:
                - number
                - string
                - 'null'
              TicketSubCategoryName:
                type:
                - string
                - 'null'
              CropName:
                type:
                - string
                - 'null'
          - type: array
            items:
              type: object
              properties:
                GrievenceSupportTicketNo:
                  type:
                  - number
                  - string
                  - 'null'
                ApplicationNo:
                  type:
                  - string
                  - 'null'
                TicketStatus:
                  type:
                  - string
                  - 'null'
                RequestYear:
                  type:
                  - number
                  - string
                  - 'null'
                RequestSeason:
                  type:
                  - number
                  - string
                  - 'null'
                InsertDateTime:
                  type:
                  - string
                  - 'null'
                latestRemark:
                  type:
                  - string
                  - 'null'
                GrievenceDescription:
                  type:
                  - string
                  - 'null'
                TicketCategoryID:
                  type:
                  - number
                  - string
                  - 'null'
                TicketCategoryName:
                  type:
                  - string
                  - 'null'
                TicketSubCategoryID:
                  type:
                  - number
                  - string
                  - 'null'
                TicketSubCategoryName:
                  type:
                  - string
                  - 'null'
                CropName:
                  type:
                  - string
                  - 'null'
          - type: 'null'
