openapi: 3.1.1
info:
  title: PMFBY grievance integration contract
  version: 0.2.0
  description: Proposed OAN adapter payloads for this external service. Not an official
    provider API specification. Paths are illustrative; authentication, errors and
    Beckn wire bindings are not defined. Examples are synthetic.
servers:
- url: https://adapter.example.invalid
  description: Non-operational review placeholder
paths:
  /pmfby/status:
    post:
      operationId: PMFBYStatus
      summary: PMFBYStatus attributes exchange
      description: Proposed adapter-facing synchronous operation for consumer review.
        Not a deployed provider URL or a complete Beckn wire envelope. Authentication
        and the final Beckn binding require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMFBYStatusRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMFBYStatusResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream
            errors or personal data.
  /pmfby/support:
    post:
      operationId: PMFBYSupport
      summary: PMFBYSupport attributes exchange
      description: Proposed adapter-facing synchronous operation for consumer review.
        Not a deployed provider URL or a complete Beckn wire envelope. Authentication
        and the final Beckn binding require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMFBYSupportRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMFBYSupportResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream
            errors or personal data.
components:
  schemas:
    PMFBYStatusRequest:
      type: object
      additionalProperties: false
      properties:
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context
            array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        applicantMobile:
          type: string
          pattern: ^[6-9][0-9]{9}$
          description: The farmer's mobile, which the portal files the ticket against.
          x-oan-pii:
            class: contact
            handling:
            - no-log
            - no-trace
            - no-echo
          x-jsonld-id: openagrinet:applicantMobile
        case:
          type: object
          additionalProperties: false
          description: The case opened for this grievance.
          x-jsonld-id: openagrinet:case
          properties:
            ticketNo:
              type: string
              pattern: ^[0-9]+$
              maxLength: 32
              description: The handle the portal issued for the case.
              x-jsonld-id: openagrinet:ticketNo
          required:
          - ticketNo
        cropYear:
          type: string
          pattern: ^[0-9]{4}$
          description: The crop year of the enrolment.
          x-jsonld-id: openagrinet:cropYear
        enrolmentId:
          type: string
          minLength: 10
          maxLength: 30
          not:
            pattern: ^[0-9]{12}$
          description: The enrolment the grievance is about, as the scheme numbers
            it. Never an Aadhaar number.
          x-oan-pii:
            class: identifier
            handling:
            - no-log
            - no-trace
          x-jsonld-id: openagrinet:enrolmentId
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        scheme:
          type: object
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
          properties:
            code:
              const: PMFBY
              type: string
              enum:
              - PMFBY
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          required:
          - code
        season:
          type: string
          enum:
          - Kharif
          - Rabi
          - Zaid
          description: The season of the enrolment.
          x-jsonld-id: openagrinet:season
      required:
      - '@context'
      - '@type'
      - applicantMobile
      - case
      - informationMode
      - scheme
