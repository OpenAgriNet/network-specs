                name:
                  type: string
                  minLength: 1
                  description: The option's label.
            description:
              type: string
              minLength: 10
              maxLength: 2000
              description: What went wrong, in the farmer's own words.
              x-oan-pii:
                class: freetext
                handling:
                - no-log
                - no-trace
              x-jsonld-id: openagrinet:grievanceDescription
            subCategory:
              type: object
              additionalProperties: false
              required:
              - code
              description: The published sub-category this grievance falls under.
              properties:
                code:
                  type: string
                  pattern: ^[0-9]+$
                  description: Code of the published option.
                name:
                  type: string
                  minLength: 1
                  description: The option's label.
          required:
          - description
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        provider:
          type: object
          additionalProperties: false
          description: The desk the grievance is filed with.
          x-jsonld-id: openagrinet:provider
          properties:
            descriptor:
              type: object
              additionalProperties: false
              description: How the desk is named.
              properties:
                name:
                  type: string
                  minLength: 1
