openapi: 3.1.1
info:
  title: PMFBY grievance provider API
  version: 0.2.0
  x-contract-role: provider-native
  description: >
    Files grievance tickets and reads their status through FGMS.
servers:
- url: https://pmfby.example.invalid
  description: Placeholder for the PMFBY FGMS service base URL.
paths:
  /api/v1/services/nic/getOtp:
    post:
      operationId: sendPmfbyGrievanceOtp
      summary: Send a farmer OTP
      description: The same NIC endpoint the insurance capability calls, reached here under Grievance. One host and one
        verification, so a farmer who proved the mobile number is theirs proved it for both.
      security: [{PMFBYAuthorization: [], otpPassword: []}]
      x-oan-mapping: {href: ./mappings/init.yaml, status: existing, scope: adapter-action}
      x-oan-binding: {descriptorCode: pmfby-grievances, resourceType: 'openagrinet:Grievance', action: init}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendOtpRequest'}
            example: {"mobile": "9000000000", "otpType": "SMS"}
      responses:
        '200':
          description: Provider reply; a false status is a business failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OtpReply'}
              examples:
                accepted: {value: {status: true, data: 'OTP sent'}}
                rejected: {value: {status: false, error: 'Request rejected'}}
  /api/v1/services/nic/verifyMobile:
    post:
      operationId: verifyPmfbyGrievanceOtp
      summary: Verify a farmer OTP
      description: Answers the OTP getOtp sent. A correct answer opens the session the filing spends; the farmerID it
        returns is captured into that session and never comes back to the caller.
      security: [{PMFBYAuthorization: [], otpPassword: []}]
      x-oan-mapping: {href: ./mappings/confirm.yaml, status: existing, scope: adapter-action}
      x-oan-binding: {descriptorCode: pmfby-grievances, resourceType: 'openagrinet:Grievance', action: confirm}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyOtpRequest'}
            example: {"mobile": "9000000000", "otp": 123456}
      responses:
        '200':
          description: Provider reply; a false status is a business failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OtpReply'}
              examples:
                accepted: {value: {status: true, data: {verified: true, farmerID: 1001}}}
                rejected: {value: {status: false, error: 'Request rejected'}}
  /krphapi/FGMS/AddKRPHNCIPGrievenceSupportTicket:
    post:
      operationId: filePmfbyGrievance
      summary: File a PMFBY grievance
      x-oan-binding:
        action: support
        resourceType: openagrinet:Grievance
        descriptorCode: pmfby-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilePmfbyGrievanceRequest'
            example:
              requestorMobileNo: '9000000000'
              applicationNo: DEMO-APP-01
              requestYear: '2026'
              requestSeason: '1'
              ticketCategoryID: '3'
              ticketSubCategoryID: '10'
              grievenceDescription: The policy record has the wrong crop.
              complaintDate: '2026-10-12'
              receiptSourceID: EXAMPLE-SOURCE
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePmfbyGrievanceResponse2XX'
              example:
                responseCode: '1'
                responseDynamic:
                  GrievenceSupportTicketNo: '10000001'
        default:
          description: Other HTTP response. No stable error body is established by the source.
      description: No applicant OTP is sent or checked. The adapter sends the season and category and source codes as strings.
        The legacy client sends them as numbers. A responseCode of 1 with a ticket can mean a new or existing ticket.
      security:
      - PMFBYAuthorization: []
      x-oan-mapping:
        href: ./mappings/support.yaml
        status: existing
        scope: adapter-action
  /krphapi/FGMS/GetGrievenceTicketsStatus:
    post:
      operationId: readPmfbyGrievance
      summary: Read a PMFBY grievance
      x-oan-binding:
        action: status
        resourceType: openagrinet:Grievance
        descriptorCode: pmfby-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadPmfbyGrievanceRequest'
            example:
              requestorMobileNo: '9000000000'
              GrievenceSupportTicketNo: '10000001'
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadPmfbyGrievanceResponse2XX'
              example:
                responseCode: '1'
                responseDynamic:
                - GrievenceSupportTicketNo: '10000001'
                  ApplicationNo: DEMO-APP-01
                  TicketStatus: Open
                  InsertDateTime: '2026-10-12T11:00:00Z'
        default:
          description: Other HTTP response. No stable error body is established by the source.
      description: The provider can return several records for the mobile number. The adapter selects the record with the
        exact requested ticket number.
      security:
      - PMFBYAuthorization: []
      x-oan-mapping:
        href: ./mappings/status.yaml
        status: existing
        scope: adapter-action
components:
  securitySchemes:
    PMFBYAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Provider-issued FGMS service token. This is not an applicant OTP.
    otpPassword:
      type: apiKey
      in: header
      name: password
      description: Provider-issued password the NIC OTP endpoints require beside the service token.
  schemas:
    FilePmfbyGrievanceRequest:
      type: object
      properties:
        requestorMobileNo:
          type: string
          x-oan-from: subject.mobile
          example: '9000000000'
        applicationNo:
          type: string
          x-oan-from: application.id
          example: DEMO-APP-01
        requestYear:
          type: string
          x-oan-from: year
          example: '2026'
        requestSeason:
          x-oan-from: season
          oneOf:
          - type: number
          - type: string
          example: '1'
        ticketCategoryID:
          x-oan-from: grievance.category
          description: The portal's own category list. The default is the enrolment and portal category a farmer who
            names no category is almost always describing.
          default: '3'
          oneOf:
          - type: number
          - type: string
          example: '3'
        ticketSubCategoryID:
          x-oan-from: grievance.subCategory
          description: A sub-category of the category above; the default is the one the default category takes.
          default: '10'
          oneOf:
          - type: number
          - type: string
          example: '10'
        grievenceDescription:
          type: string
          x-oan-from: grievance.text
          example: The policy record has the wrong crop.
        complaintDate:
          type: string
          format: date
          x-oan-from: grievance.filedOn
          example: '2026-10-12'
        receiptSourceID:
          x-oan-from: grievance.source
          description: Provider-assigned source code. The default is the one PMFBY issued for this network, so a caller
            that names no source is still recorded as having come through it.
          default: '134306'
          oneOf:
          - type: number
          - type: string
      required:
      - requestorMobileNo
      - applicationNo
      - requestYear
      - requestSeason
      - ticketCategoryID
      - ticketSubCategoryID
      - grievenceDescription
      - complaintDate
      - receiptSourceID
    SendOtpRequest:
      type: object
      required:
      - mobile
      - otpType
      properties:
        mobile:
          type: string
          x-oan-from: subject.mobile
        otpType:
          const: SMS
    VerifyOtpRequest:
      type: object
      required:
      - mobile
      - otp
      properties:
        mobile:
          type: string
          x-oan-from: subject.mobile
        otp:
          type: integer
          x-oan-from: challenge.otp
    OtpReply:
      type: object
      properties:
        status:
          type: boolean
        error:
          type: string
        data:
          description: Send reads a message string; verification reads an object with verified true and the farmerID the
            session holds.
    FilePmfbyGrievanceResponse2XX:
      type: object
      properties:
        responseCode:
          oneOf:
          - type: number
          - type: string
        responseMessage:
          type:
          - string
          - 'null'
        responseDynamic:
          oneOf:
          - type: object
            properties:
              GrievenceSupportTicketNo:
                oneOf:
                - type: number
                - type: string
              GrievenceSupportTicketID:
                oneOf:
                - type: number
                - type: string
          - type: 'null'
    ReadPmfbyGrievanceRequest:
      type: object
      properties:
        requestorMobileNo:
          type: string
          x-oan-from: subject.mobile
          example: '9000000000'
        GrievenceSupportTicketNo:
          type: string
          x-oan-from: grievance.id
          example: '10000001'
      required:
      - requestorMobileNo
      - GrievenceSupportTicketNo
    ReadPmfbyGrievanceResponse2XX:
      type: object
      properties:
        responseCode:
          oneOf:
          - type: number
          - type: string
        responseMessage:
          type:
          - string
          - 'null'
        responseDynamic:
          oneOf:
          - type: object
            properties:
              GrievenceSupportTicketNo:
                type:
                - number
                - string
                - 'null'
              ApplicationNo:
                type:
                - string
                - 'null'
              TicketStatus:
                type:
                - string
                - 'null'
              RequestYear:
                type:
                - number
                - string
                - 'null'
              RequestSeason:
                type:
                - number
                - string
                - 'null'
              InsertDateTime:
                type:
                - string
                - 'null'
              latestRemark:
                type:
                - string
                - 'null'
              GrievenceDescription:
                type:
                - string
                - 'null'
              TicketCategoryID:
                type:
                - number
                - string
                - 'null'
              TicketCategoryName:
                type:
                - string
                - 'null'
              TicketSubCategoryID:
                type:
                - number
                - string
                - 'null'
              TicketSubCategoryName:
                type:
                - string
                - 'null'
              CropName:
                type:
                - string
                - 'null'
          - type: array
            items:
              type: object
              properties:
                GrievenceSupportTicketNo:
                  type:
                  - number
                  - string
                  - 'null'
                ApplicationNo:
                  type:
                  - string
                  - 'null'
                TicketStatus:
                  type:
                  - string
                  - 'null'
                RequestYear:
                  type:
                  - number
                  - string
                  - 'null'
                RequestSeason:
                  type:
                  - number
                  - string
                  - 'null'
                InsertDateTime:
                  type:
                  - string
                  - 'null'
                latestRemark:
                  type:
                  - string
                  - 'null'
                GrievenceDescription:
                  type:
                  - string
                  - 'null'
                TicketCategoryID:
                  type:
                  - number
                  - string
                  - 'null'
                TicketCategoryName:
                  type:
                  - string
                  - 'null'
                TicketSubCategoryID:
                  type:
                  - number
                  - string
                  - 'null'
                TicketSubCategoryName:
                  type:
                  - string
                  - 'null'
                CropName:
                  type:
                  - string
                  - 'null'
          - type: 'null'
