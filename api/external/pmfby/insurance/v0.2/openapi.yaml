openapi: 3.1.1
info:
  title: PMFBY policy and claim lookup
  version: 0.2.0
  description: >
    Native policy and claim reads, separate from grievance ticket status.
    The adapter status flow verifies OTP and resolves the farmer ID before these
    reads. This slice does not define the login exchange, an official PMFBY
    specification or a Beckn invocation binding. Keep the farmer ID, credentials,
    and returned beneficiary records out of public catalogs. All examples are synthetic.
security: [{providerToken: []}]
paths:
  /api/v1/policy/policy/farmerpolicylist:
    get:
      operationId: listPmfbyInsurancePolicies
      summary: List policies and their applications for the authenticated farmer
      parameters:
        - {$ref: '#/components/parameters/FarmerId'}
        - {in: query, name: listType, required: true, schema: {type: string, const: POLICY_LIST}, example: POLICY_LIST}
        - in: query
          name: sssyID
          required: true
          description: The adapter concatenates 040, its one-character season code, 00 and the last two year digits. The example is Kharif 2026.
          schema: {type: string, pattern: '^040[123]00[0-9]{2}$'}
          example: '04010026'
      responses:
        '200':
          description: The adapter reads the policy array directly or from data. An empty array contains no policies for the selection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyListResponse'}
              examples:
                onePolicy:
                  value:
                    data:
                      - policyID: EXAMPLE-POLICY
                        insuranceCompanyName: Example insurer
                        applicationList:
                          - applicationNo: EXAMPLE-APPLICATION
                            cropName: Paddy
                            policyStatus: Example policy status
                            seasonName: Kharif
                            seasonYear: '2026'
                noPolicies: {value: []}
        default: {description: Error body not established. Do not report authentication or transport failure as no policies.}
  /api/v1/claims/claims/claimSearchReport:
    get:
      operationId: listPmfbyInsuranceClaims
      summary: Read claims for the authenticated farmer, season and year
      parameters:
        - {$ref: '#/components/parameters/FarmerId'}
        - {in: query, name: searchType, required: true, schema: {type: string, const: farmerID}, example: farmerID}
        - {in: query, name: season, required: true, schema: {type: string, enum: ['1','2','3']}, description: 'The adapter sends 1 for Kharif, 2 for Rabi or 3 for Summer.', example: '1'}
        - {in: query, name: year, required: true, schema: {type: string, pattern: '^[0-9]{4}$'}, example: '2026'}
      responses:
        '200':
          description: Claim records use different field names from policy applications. The adapter displays ClaimStatus or falls back to Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimListResponse'}
              examples:
                oneClaim:
                  value:
                    - applicationNo: EXAMPLE-APPLICATION
                      ClaimStatus: Example claim status
                      ClaimType: Example claim type
                noClaims: {value: {data: []}}
        default: {description: No verified error schema; an upstream failure does not establish whether a claim exists.}
components:
  securitySchemes:
    providerToken: {type: apiKey, in: header, name: token, description: A provider credential held by the adapter; not the farmer OTP.}
  parameters:
    FarmerId: {in: query, name: farmerID, required: true, schema: {type: string}, description: A provider ID previously resolved for the authorized farmer., example: EXAMPLE-FARMER}
  schemas:
    Identifier: {type: [string, integer, 'null']}
    Amount: {type: [string, number, 'null']}
    Text: {type: [string, 'null']}
    PolicyApplication:
      type: object
      description: Selected fields read by the mapper. Accounts and land details may also be returned; they remain private.
      properties:
        applicationNo: {$ref: '#/components/schemas/Identifier'}
        cropID: {$ref: '#/components/schemas/Identifier'}
        cropName: {$ref: '#/components/schemas/Text'}
        seasonCode: {$ref: '#/components/schemas/Identifier'}
        seasonName: {$ref: '#/components/schemas/Text'}
        seasonYear: {$ref: '#/components/schemas/Identifier'}
        policyStatus: {$ref: '#/components/schemas/Text'}
        policyStatusCode: {$ref: '#/components/schemas/Identifier'}
        claimStatus: {$ref: '#/components/schemas/Text'}
        claimAmount: {$ref: '#/components/schemas/Amount'}
        sumInsured: {$ref: '#/components/schemas/Amount'}
    Policy:
      type: object
      properties:
        policyID: {$ref: '#/components/schemas/Identifier'}
        insuranceCompanyName: {$ref: '#/components/schemas/Text'}
        districtName: {$ref: '#/components/schemas/Text'}
        stateName: {$ref: '#/components/schemas/Text'}
        applicationList: {type: [array, 'null'], items: {$ref: '#/components/schemas/PolicyApplication'}}
    Claim:
      type: object
      description: Selected private fields read by the adapter; the provider can return additional payment and identity information.
      properties:
        applicationNo: {$ref: '#/components/schemas/Identifier'}
        ClaimStatus: {$ref: '#/components/schemas/Text'}
        Status: {$ref: '#/components/schemas/Text'}
        claimDate: {$ref: '#/components/schemas/Text'}
        ClaimType: {$ref: '#/components/schemas/Text'}
        amount: {$ref: '#/components/schemas/Amount'}
        totalPayable: {$ref: '#/components/schemas/Amount'}
    Policies: {type: array, items: {$ref: '#/components/schemas/Policy'}}
    Claims: {type: array, items: {$ref: '#/components/schemas/Claim'}}
    PolicyListResponse:
      oneOf:
        - {$ref: '#/components/schemas/Policies'}
        - {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Policies'}}}
    ClaimListResponse:
      oneOf:
        - {$ref: '#/components/schemas/Claims'}
        - {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Claims'}}}
