status: draft-native
deployable: false
action: status
source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/pmfby/pmfby.service.ts#L148
sessionBinding: Bind session.farmerID from verified lookup result.farmerID. The private token header comes from the authenticated session.
operationRef: https://openagrinet.github.io/network-specs/api/external/pmfby/insurance/v0.2/openapi.yaml#/paths/~1api~1v1~1policy~1policy~1farmerpolicylist/get
request:
  in: query
  jsonata: '{"farmerID": session.farmerID, "listType": "POLICY_LIST", "sssyID": "040" & payload.season & "00" & payload.year}'
response:
  jsonata: response
  guard: Read farmerID only from the verified adapter session; never trust an externally supplied farmerID. Return policy records only to that caller.
missing:
- Bind the private input and authenticated adapter context.
- Verify the native exchange and response handling before deployment.
