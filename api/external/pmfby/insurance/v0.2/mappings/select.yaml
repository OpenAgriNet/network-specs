status: draft-native
deployable: false
action: select
source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/pmfby/pmfby.service.ts#L105
sessionBinding: Bind session.farmerID from verified lookup result.farmerID. The private token header comes from the authenticated session.
operationRef: https://openagrinet.github.io/network-specs/api/external/pmfby/insurance/v0.2/openapi.yaml#/paths/~1api~1v1~1claims~1claims~1claimSearchReport/get
request:
  in: query
  jsonata: '{"farmerID": session.farmerID, "searchType": "farmerID", "season": payload.season, "year":
    payload.year}'
response:
  jsonata: response
  guard: Read farmerID only from the verified adapter session; never trust an externally supplied farmerID. Return claim records only to that caller.
missing:
- Bind the private input and authenticated adapter context.
- Verify the native exchange and response handling before deployment.
