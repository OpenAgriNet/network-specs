openapi: 3.1.1
info:
  title: PM-KISAN grievance provider API
  version: 0.2.0
  x-contract-role: provider-native
  description: Native PM-KISAN registration-number grievance calls and their separate
    OTP service calls. The routes and fields come from OpenAgriNet network-adapter
    29bc016f and provider backend origin/dev e42a69a. The grievance
    service and OTP service use different encrypted envelopes. Live behavior was not
    verified. Plaintext examples are synthetic and are not HTTP bodies.
servers:
- url: https://pm-kisan-grievance.example.invalid
  description: Placeholder for the PM-KISAN grievance service base URL, including
    its configured service path.
paths:
  "/ChatbotOTP":
    post:
      operationId: sendPmkisanGrievanceOtp
      x-oan-mapping: {"href": "./mappings/init.yaml", "status": "existing", "scope": "adapter-action"}
      summary: Request a PM-KISAN grievance OTP
      x-oan-binding:
        action: init
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request.
      servers:
      - url: https://pm-kisan.example.invalid/services/chatbotservice.asmx
        description: Placeholder for the PM-KISAN OTP and application-status service
          base URL.
      x-plaintext-request:
        type: object
        properties:
          Types:
            const: Ben_id
          Values:
            type: string
        required:
        - Types
        - Values
        examples:
        - Types: Ben_id
          Values: DEMO0000001
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
  "/ChatbotOTPVerified":
    post:
      operationId: verifyPmkisanGrievanceOtp
      summary: Verify the PM-KISAN grievance OTP
      x-oan-binding:
        actions:
        - status
        - support
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
        steps:
          status:
          - verifyPmkisanGrievanceOtp
          - readPmkisanGrievance
          support:
          - verifyPmkisanGrievanceOtp
          - filePmkisanGrievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request. The adapter verifies the OTP
        on the application host before either grievance operation.
      servers:
      - url: https://pm-kisan.example.invalid/services/chatbotservice.asmx
        description: Placeholder for the PM-KISAN OTP and application-status service
          base URL.
      x-plaintext-request:
        type: object
        properties:
          Types:
            const: Ben_id
          Values:
            type: string
          OTP:
            type: string
            example: '0000'
        required:
        - Types
        - Values
        - OTP
        examples:
        - Types: Ben_id
          Values: DEMO0000001
          OTP: '0000'
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
  "/GrievanceStatusCheck":
    post:
      operationId: readPmkisanGrievance
      x-oan-mapping: {"href": "./mappings/status.yaml", "status": "existing", "scope": "adapter-action"}
      summary: Read PM-KISAN grievances for a registration number
      x-oan-binding:
        action: status
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
        steps:
        - verifyPmkisanGrievanceOtp
        - readPmkisanGrievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted grievance-service payload,
        not the plaintext fields shown in x-plaintext-request. The adapter selects
        the matching filing date from the returned records. It does not send the filing
        date to PM-KISAN.
      x-plaintext-request:
        type: object
        properties:
          Type:
            const: Reg_No_Status
          IdentityNo:
            type: string
        required:
        - Type
        - IdentityNo
        examples:
        - Type: Reg_No_Status
          IdentityNo: DEMO0000001
      x-plaintext-response:
        anyOf:
        - type: array
          items:
            type: object
            properties:
              GrievanceDate:
                type:
                - string
                - 'null'
              GrievanceStatus:
                type:
                - string
                - 'null'
              OfficerReply:
                type:
                - string
                - 'null'
              OfficeReplyDate:
                type:
                - string
                - 'null'
              GrievanceDescription:
                type:
                - string
                - 'null'
        - type: object
          properties:
            Rsponce:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            Responce:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            Status:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            status:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            details:
              oneOf:
              - type: array
                items:
                  type: object
                  properties:
                    GrievanceDate:
                      type:
                      - string
                      - 'null'
                    GrievanceStatus:
                      type:
                      - string
                      - 'null'
                    OfficerReply:
                      type:
                      - string
                      - 'null'
                    OfficeReplyDate:
                      type:
                      - string
                      - 'null'
                    GrievanceDescription:
                      type:
                      - string
                      - 'null'
              - type: object
                properties:
                  GrievanceDate:
                    type:
                    - string
                    - 'null'
                  GrievanceStatus:
                    type:
                    - string
                    - 'null'
                  OfficerReply:
                    type:
                    - string
                    - 'null'
                  OfficeReplyDate:
                    type:
                    - string
                    - 'null'
                  GrievanceDescription:
                    type:
                    - string
                    - 'null'
  "/LodgeGrievance":
    post:
      operationId: filePmkisanGrievance
      x-oan-mapping: {"href": "./mappings/support.yaml", "status": "existing", "scope": "adapter-action"}
      summary: File a PM-KISAN grievance
      x-oan-binding:
        action: support
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
        steps:
        - verifyPmkisanGrievanceOtp
        - filePmkisanGrievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted grievance-service payload,
        not the plaintext fields shown in x-plaintext-request. The adapter reads the
        ticket number from GrievanceID, grievanceId or GrievanceNo. It derives filedOn in IST rather
        than reading it from the native submission response.
      x-plaintext-request:
        type: object
        properties:
          Type:
            const: Reg_No_Details
          IdentityNo:
            type: string
          GrievanceType:
            type: string
          GrievanceDescription:
            type: string
        required:
        - Type
        - IdentityNo
        - GrievanceType
        - GrievanceDescription
        examples:
        - Type: Reg_No_Details
          IdentityNo: DEMO0000001
          GrievanceType: '101'
          GrievanceDescription: The latest instalment is missing.
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          GrievanceID:
            oneOf:
            - type: number
            - type: string
          grievanceId:
            oneOf:
            - type: number
            - type: string
          GrievanceNo:
            oneOf:
            - type: number
            - type: string
          Message:
            type: string
          message:
            type: string
components:
  schemas:
    EncryptedRequest:
      type: object
      properties:
        EncryptedRequest:
          type: string
          minLength: 1
          description: Encrypted provider payload. See the operation for its plaintext
            shape and envelope.
      required:
      - EncryptedRequest
    EncryptedResponse:
      anyOf:
      - type: object
        properties:
          d:
            type: object
            properties:
              output:
                type: string
            required:
            - output
        required:
        - d
      - type: object
        properties:
          output:
            type: string
        required:
        - output
      description: Response wrapper read by the adapter. The output value carries
        the encrypted response.
