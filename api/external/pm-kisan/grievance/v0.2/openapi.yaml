openapi: 3.1.1
info:
  title: PM-KISAN grievance provider API
  version: 0.2.0
  x-contract-role: provider-native
  description: >
    Files and retrieves grievances by registration number. OTP operations and grievance operations use different services and encryption envelopes.
servers:
- url: https://pm-kisan-grievance.example.invalid
  description: Placeholder for the PM-KISAN grievance service base URL, including
    its configured service path.
paths:
  "/ChatbotOTP":
    post:
      operationId: sendPmkisanGrievanceOtp
      x-oan-mapping: {"href": "./mappings/init.yaml", "status": "existing", "scope": "adapter-action"}
      summary: Request a PM-KISAN grievance OTP
      x-oan-binding:
        action: init
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
      x-oan-request-attributes:
        description: >
          What the call carries at the Beckn layer. PM-KISAN seals its bodies,
          and on this capability it is the ADAPTER that builds the plaintext --
          x-plaintext-request shows it -- from these. So what a caller fills is
          the registration number, not the provider's own field names.
        schema:
          type: object
          required: [enrolmentId]
          properties:
            enrolmentId: {type: string, x-oan-from: enrolment.id}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request.
      servers:
      - url: https://pm-kisan.example.invalid/services/chatbotservice.asmx
        description: Placeholder for the PM-KISAN OTP and application-status service
          base URL.
      x-plaintext-request:
        type: object
        properties:
          Types:
            const: Ben_id
          Values:
            type: string
        required:
        - Types
        - Values
        examples:
        - Types: Ben_id
          Values: DEMO0000001
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
  "/ChatbotOTPVerified":
    post:
      operationId: verifyPmkisanGrievanceOtp
      summary: Verify the PM-KISAN grievance OTP
      x-oan-binding:
        actions:
        - status
        - support
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
        steps:
          status:
          - verifyPmkisanGrievanceOtp
          - readPmkisanGrievance
          support:
          - verifyPmkisanGrievanceOtp
          - filePmkisanGrievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request. The adapter verifies the OTP
        on the application host before either grievance operation.
      servers:
      - url: https://pm-kisan.example.invalid/services/chatbotservice.asmx
        description: Placeholder for the PM-KISAN OTP and application-status service
          base URL.
      x-plaintext-request:
        type: object
        properties:
          Types:
            const: Ben_id
          Values:
            type: string
          OTP:
            type: string
            example: '0000'
        required:
        - Types
        - Values
        - OTP
        examples:
        - Types: Ben_id
          Values: DEMO0000001
          OTP: '0000'
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
  "/GrievanceStatusCheck":
    post:
      operationId: readPmkisanGrievance
      x-oan-mapping: {"href": "./mappings/status.yaml", "status": "existing", "scope": "adapter-action"}
      summary: Read PM-KISAN grievances for a registration number
      x-oan-binding:
        action: status
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
        steps:
        - verifyPmkisanGrievanceOtp
        - readPmkisanGrievance
      x-oan-request-attributes:
        description: >
          What the call carries at the Beckn layer. PM-KISAN seals its bodies,
          and on this capability it is the ADAPTER that builds the plaintext --
          x-plaintext-request shows it -- from these. So what a caller fills is
          the registration number and the OTP, not the provider's own field names.
        schema:
          type: object
          required: [enrolmentId, challenge]
          properties:
            enrolmentId: {type: string, x-oan-from: enrolment.id}
            challenge: {"$ref": "#/components/schemas/OtpChallenge"}
            case:
              type: object
              description: >
                Which filing to read. Left out, the adapter reads the newest
                one, which is what a farmer who names no date is asking for.
              properties:
                filedOn:
                  type: string
                  format: date
                  x-oan-from: grievance.filedOn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted grievance-service payload,
        not the plaintext fields shown in x-plaintext-request. The adapter selects
        the matching filing date from the returned records. It does not send the filing
        date to PM-KISAN.
      x-plaintext-request:
        type: object
        properties:
          Type:
            const: Reg_No_Status
          IdentityNo:
            type: string
        required:
        - Type
        - IdentityNo
        examples:
        - Type: Reg_No_Status
          IdentityNo: DEMO0000001
      x-plaintext-response:
        anyOf:
        - type: array
          items:
            type: object
            properties:
              GrievanceDate:
                type:
                - string
                - 'null'
              GrievanceStatus:
                type:
                - string
                - 'null'
              OfficerReply:
                type:
                - string
                - 'null'
              OfficeReplyDate:
                type:
                - string
                - 'null'
              GrievanceDescription:
                type:
                - string
                - 'null'
        - type: object
          properties:
            Rsponce:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            Responce:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            Status:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            status:
              type:
              - string
              - boolean
              description: Provider business result flag. The adapter checks the first
                present spelling.
            details:
              oneOf:
              - type: array
                items:
                  type: object
                  properties:
                    GrievanceDate:
                      type:
                      - string
                      - 'null'
                    GrievanceStatus:
                      type:
                      - string
                      - 'null'
                    OfficerReply:
                      type:
                      - string
                      - 'null'
                    OfficeReplyDate:
                      type:
                      - string
                      - 'null'
                    GrievanceDescription:
                      type:
                      - string
                      - 'null'
              - type: object
                properties:
                  GrievanceDate:
                    type:
                    - string
                    - 'null'
                  GrievanceStatus:
                    type:
                    - string
                    - 'null'
                  OfficerReply:
                    type:
                    - string
                    - 'null'
                  OfficeReplyDate:
                    type:
                    - string
                    - 'null'
                  GrievanceDescription:
                    type:
                    - string
                    - 'null'
  "/LodgeGrievance":
    post:
      operationId: filePmkisanGrievance
      x-oan-mapping: {"href": "./mappings/support.yaml", "status": "existing", "scope": "adapter-action"}
      summary: File a PM-KISAN grievance
      x-oan-binding:
        action: support
        resourceType: openagrinet:Grievance
        descriptorCode: pm-kisan-grievances
        schema: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/attributes.yaml#/components/schemas/Grievance
        steps:
        - verifyPmkisanGrievanceOtp
        - filePmkisanGrievance
      x-oan-request-attributes:
        description: >
          What the call carries at the Beckn layer. PM-KISAN seals its bodies,
          and on this capability it is the ADAPTER that builds the plaintext --
          x-plaintext-request shows it -- from these. So what a caller fills is
          the registration number, the OTP and the complaint, not the provider's own field names.
        schema:
          type: object
          required: [enrolmentId, challenge, grievance]
          properties:
            enrolmentId: {type: string, x-oan-from: enrolment.id}
            challenge: {"$ref": "#/components/schemas/OtpChallenge"}
            grievance:
              type: object
              required: [category, description]
              properties:
                category:
                  type: object
                  required: [code]
                  properties:
                    code: {type: string, x-oan-from: grievance.category}
                description: {type: string, x-oan-from: grievance.text}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted grievance-service payload,
        not the plaintext fields shown in x-plaintext-request. The adapter reads the
        ticket number from GrievanceID, grievanceId or GrievanceNo. It derives filedOn in IST rather
        than reading it from the native submission response.
      x-plaintext-request:
        type: object
        properties:
          Type:
            const: Reg_No_Details
          IdentityNo:
            type: string
          GrievanceType:
            type: string
          GrievanceDescription:
            type: string
        required:
        - Type
        - IdentityNo
        - GrievanceType
        - GrievanceDescription
        examples:
        - Type: Reg_No_Details
          IdentityNo: DEMO0000001
          GrievanceType: '101'
          GrievanceDescription: The latest instalment is missing.
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          GrievanceID:
            oneOf:
            - type: number
            - type: string
          grievanceId:
            oneOf:
            - type: number
            - type: string
          GrievanceNo:
            oneOf:
            - type: number
            - type: string
          Message:
            type: string
          message:
            type: string
components:
  schemas:
    OtpChallenge:
      type: object
      description: >
        The OTP the farmer read out. The adapter answers it at PM-KISAN's OTP
        service before making this call, so the code itself never reaches this
        endpoint.
      required: [response]
      properties:
        response:
          type: object
          required: [method, value]
          properties:
            method: {const: OTP}
            value: {type: string, x-oan-from: challenge.otp}
    EncryptedRequest:
      type: object
      properties:
        EncryptedRequest:
          type: string
          minLength: 1
          description: Encrypted provider payload. See the operation for its plaintext
            shape and envelope.
      required:
      - EncryptedRequest
    EncryptedResponse:
      anyOf:
      - type: object
        properties:
          d:
            type: object
            properties:
              output:
                type: string
            required:
            - output
        required:
        - d
      - type: object
        properties:
          output:
            type: string
        required:
        - output
      description: Response wrapper read by the adapter. The output value carries
        the encrypted response.
