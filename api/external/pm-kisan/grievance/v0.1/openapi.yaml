        case:
          type: object
          additionalProperties: false
          description: The case the reply concerns.
          x-jsonld-id: openagrinet:case
          properties:
            filedOn:
              type: string
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              description: When the grievance was filed. Picks one case out of all
