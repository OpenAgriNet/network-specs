              x-jsonld-id: openagrinet:filedOn
            repliedOn:
              type: string
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              description: When the desk replied.
              x-jsonld-id: openagrinet:repliedOn
            reply:
              type: string
              minLength: 1
              maxLength: 2000
              description: The desk's reply to the grievance.
              x-oan-pii:
                class: freetext
                handling:
                - no-log
                - no-trace
              x-jsonld-id: openagrinet:caseReply
            status:
              type: object
              additionalProperties: false
              description: Where the case stands.
              x-jsonld-id: openagrinet:caseStatus
              properties:
                code:
                  type: string
                  enum:
                  - Registered
                  - UnderReview
                  - AwaitingApplicant
                  - Replied
                  - Resolved
                  - Rejected
                  - Closed
                  description: The status the desk reports.
              required:
              - code
          required:
