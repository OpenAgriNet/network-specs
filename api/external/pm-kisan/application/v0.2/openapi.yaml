openapi: 3.1.1
info:
  title: PM-KISAN application status provider API
  version: 0.2.0
  x-contract-role: provider-native
  description: Native PM-KISAN OTP, application status, and payment-blocker calls.
    The provider backend client and OpenAgriNet network-adapter 29bc016f establish
    the HTTP requests and the response fields the adapter reads. The service uses
    the OTP-service encrypted envelope. Live behavior was not verified. Plaintext
    examples are synthetic and are not HTTP bodies.
servers:
- url: https://pm-kisan.example.invalid/services/chatbotservice.asmx
  description: Placeholder for the PM-KISAN OTP and application-status service base
    URL.
paths:
  "/ChatbotOTP":
    post:
      operationId: sendPmkisanApplicationOtp
      x-oan-mapping: {"href": "./mappings/init.yaml", "status": "existing", "scope": "adapter-action"}
      summary: Request a PM-KISAN application OTP
      x-oan-binding:
        action: init
        resourceType: openagrinet:SchemeApplication
        descriptorCode: pm-kisan-benefits
        schema: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.2/attributes.yaml#/components/schemas/SchemeApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request.
      x-plaintext-request:
        type: object
        properties:
          Types:
            type: string
            enum:
            - Ben_id
            - Mobile
          Values:
            type: string
        required:
        - Types
        - Values
        examples:
        - Types: Ben_id
          Values: DEMO0000001
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
  "/ChatbotOTPVerified":
    post:
      operationId: verifyPmkisanApplicationOtp
      summary: Verify the PM-KISAN application OTP
      x-oan-binding:
        action: status
        resourceType: openagrinet:SchemeApplication
        descriptorCode: pm-kisan-benefits
        schema: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.2/attributes.yaml#/components/schemas/SchemeApplication
        steps:
        - verifyPmkisanApplicationOtp
        - readPmkisanApplication
        - readPmkisanApplicationBlockers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request. Verification precedes the application
        lookup.
      x-plaintext-request:
        type: object
        properties:
          Types:
            type: string
            enum:
            - Ben_id
            - Mobile
          Values:
            type: string
          OTP:
            type: string
            example: '0000'
        required:
        - Types
        - Values
        - OTP
        examples:
        - Types: Ben_id
          Values: DEMO0000001
          OTP: '0000'
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
  "/ChatbotUserDetails":
    post:
      operationId: readPmkisanApplication
      x-oan-mapping: {"href": "./mappings/status.yaml", "status": "existing", "scope": "adapter-action"}
      summary: Read PM-KISAN application and instalment details
      x-oan-binding:
        action: status
        resourceType: openagrinet:SchemeApplication
        descriptorCode: pm-kisan-benefits
        schema: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.2/attributes.yaml#/components/schemas/SchemeApplication
        steps:
        - verifyPmkisanApplicationOtp
        - readPmkisanApplication
        - readPmkisanApplicationBlockers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request. The adapter requires a successful
        result, registration number, and usable instalment count before returning
        application status.
      x-plaintext-request:
        type: object
        properties:
          Types:
            type: string
            enum:
            - Ben_id
            - Mobile
          Values:
            type: string
        required:
        - Types
        - Values
        examples:
        - Types: Ben_id
          Values: DEMO0000001
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Reg_No:
            type: string
          DateOfRegistration:
            type: string
          LatestInstallmentPaid:
            oneOf:
            - type: number
            - type: string
          eKYC_Status:
            type: string
  "/ChatbotBeneficiaryStatus":
    post:
      operationId: readPmkisanApplicationBlockers
      summary: Read PM-KISAN payment blockers
      x-oan-binding:
        action: status
        resourceType: openagrinet:SchemeApplication
        descriptorCode: pm-kisan-benefits
        schema: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.2/attributes.yaml#/components/schemas/SchemeApplication
        steps:
        - verifyPmkisanApplicationOtp
        - readPmkisanApplication
        - readPmkisanApplicationBlockers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncryptedRequest"
            example: {EncryptedRequest: "<synthetic ciphertext>"}
      responses:
        2XX:
          description: Provider response. An HTTP success does not imply business
            success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EncryptedResponse"
              example: {d: {output: "<synthetic ciphertext>"}}
        default:
          description: Other HTTP response. No stable error body is established by
            the source.
      description: The JSON body carries the encrypted OTP-service payload, not the
        plaintext fields shown in x-plaintext-request. The adapter makes this optional
        read with the same identifier as the details request. Additional response
        fields can contain provider blocker phrases. A failed follow-up does not erase
        the application details.
      x-plaintext-request:
        type: object
        properties:
          Types:
            type: string
            enum:
            - Ben_id
            - Mobile
          Values:
            type: string
        required:
        - Types
        - Values
        examples:
        - Types: Ben_id
          Values: DEMO0000001
      x-plaintext-response:
        type: object
        properties:
          Rsponce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Responce:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          status:
            type:
            - string
            - boolean
            description: Provider business result flag. The adapter checks the first
              present spelling.
          Message:
            type: string
          message:
            type: string
        additionalProperties: true
components:
  schemas:
    EncryptedRequest:
      type: object
      properties:
        EncryptedRequest:
          type: string
          minLength: 1
          description: Encrypted provider payload. See the operation for its plaintext
            shape and envelope.
      required:
      - EncryptedRequest
    EncryptedResponse:
      anyOf:
      - type: object
        properties:
          d:
            type: object
            properties:
              output:
                type: string
            required:
            - output
        required:
        - d
      - type: object
        properties:
          output:
            type: string
        required:
        - output
      description: Response wrapper read by the adapter. The output value carries
        the encrypted response.
