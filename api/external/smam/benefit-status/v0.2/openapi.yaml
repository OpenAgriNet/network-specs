openapi: 3.1.1
info:
  x-contract-role: provider-native
  title: SMAM benefit application status
  version: 0.2.0
  description: >
    Looks up benefit application status using a private search value.
servers:
  - url: https://smam.example.invalid
    description: Placeholder only. Obtain the service base URL from the provider.
paths:
  /api/BeneficiaryService/GetApplicationStatusByAI:
    post:
      operationId: readSmamBenefitStatus
      x-oan-mapping: {"href": "./mappings/status.yaml", "status": "existing", "scope": "adapter-action"}
      x-oan-binding: {descriptorCode: smam-benefits, resourceType: "openagrinet:SchemeApplication", action: status}
      security: [{providerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmamBenefitStatusRequest'}
            example: {SearchValue: EXAMPLE-APPLICATION}
      responses:
        '200':
          description: >
            Inspect success before interpreting data. The legacy adapter parses data
            and returns an empty catalog when no application is parsed, even if
            success is false. A new adapter must keep upstream failure and malformed
            payloads separate from a successful lookup with no applications.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmamBenefitStatusResponse'}
              examples:
                found:
                  value: {success: true, data: [{ApplicationID: 1, ApplicationRefNo: EXAMPLE, Implements: [{ImplementName: Example implement, StatusHistory: [{StatusText: Example stage}]}]}]}
                notFound: {value: {success: true, data: '[]'}}
                failed: {value: {success: false, message: Example failure, data: null}}
        default: {description: Transport/provider failure; error payload not verified.}
components:
  securitySchemes:
    providerToken: {type: apiKey, name: Token, in: header}
  schemas:
    SmamBenefitStatusRequest:
      type: object
      required: [SearchValue]
      properties:
        SearchValue:
          type: string
          minLength: 1
          writeOnly: true
          description: >
            Private search value. The adapter translates the legacy search_params
            tag to SearchValue and sends no search_type field to SMAM.
    SmamBenefitStatusResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        data:
          oneOf:
            - {type: 'null'}
            - {type: string, description: JSON-encoded applications (parsed by the adapter).}
            - {$ref: '#/components/schemas/Application'}
            - {type: array, items: {$ref: '#/components/schemas/Application'}}
    Application:
      type: object
      properties:
        ApplicationID: {type: [integer, string]}
        ApplicationRefNo: {type: string}
        Implements:
          type: array
          items:
            type: object
            properties:
              ImplementSubsidyID: {type: [integer, string]}
              ImplementName: {type: string}
              StatusHistory:
                type: array
                description: The legacy mapper uses the first entry as current status without sorting by date.
                items:
                  type: object
                  properties:
                    StatusCode: {type: [integer, string]}
                    StatusText: {type: string}
                    StatusDate: {type: string}
