# Private payload legs only, not a full on_status envelope.
# Adapter operation: SMAMReadBenefit. Native operation: readSmamBenefitStatus.
# The native body carries only SearchValue. If a legacy bridge also sends
# search_params metadata, translate mobile to phone_no before calling it.
# The adapter authenticates, checks HTTP status, validates both schemas and
# normalizes data to an array before the response leg. Decode string-encoded
# arrays as JSON, wrap a direct object, and reject malformed data. Never eval it.
# Check success before treating an empty data value as no records.
# This draft projection accepts a single implement with one status per record.
# It intentionally rejects more complex histories rather than hiding implements.
required:
  - check: |
      (
        $a := beckn.message.contract.commitments[0].commitmentAttributes;
        $a.searchType in ["application_no","mobile"] and
        $type($a.searchValue) = "string" and $length($trim($a.searchValue)) > 0
      )
    message: Valid lookup kind and a nonempty private lookup value are required.
request: |
  {"SearchValue": beckn.message.contract.commitments[0].commitmentAttributes.searchValue}
response: |
  (
    $rows := $lookup(response, "data");
    $assert(response.success = true and $type($rows) = "array", "Provider failure or unreadable records");
    {"records": [$map($rows, function($a){(
      $assert($type($a.ApplicationRefNo) = "string" and $length($a.ApplicationRefNo) > 0, "Missing reference");
      $assert($count($a.Implements) = 1 and $count($a.Implements[0].StatusHistory) = 1, "Ambiguous status history");
      $s := $a.Implements[0].StatusHistory[0].StatusText;
      $assert($type($s) = "string" and $length($s) > 0, "Missing status");
      {"applicationReference": $a.ApplicationRefNo, "status": $s}
    )})]}
  )
