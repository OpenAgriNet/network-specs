openapi: 3.1.1
info:
  x-contract-role: provider-native
  title: Kisan Help Center grievances
  version: 0.2.0
  description: >
    Registers a farmer's grievance with the Kisan Help Center and reads its
    status back. Filing is a three-step journey -- an OTP to the farmer's
    mobile, a verification that returns a session token, then the grievance
    itself -- because a grievance is written against a real desk under a real
    farmer's name. The free text a farmer writes, their mobile number, name,
    gender and village are all private.

    Seven reference lookups resolve the state, district, sub-district, village,
    scheme, category and sub-category identifiers a filing has to quote. They
    are deliberately left unbound; see the note on each.
security:
- serviceToken: []
servers:
  - url: https://khc.example.invalid
    description: Placeholder only. Obtain the service base URL from the provider.
paths:
  "/auth/send-otp":
    post:
      operationId: KhcStart
      summary: Send an OTP to the farmer's mobile to open a filing session
      x-oan-mapping: {href: ./mappings/init.yaml, status: source-traced}
      x-oan-binding:
        descriptorCode: khc-grievance
        resourceType: openagrinet:Grievance
        action: init
      description: 'get_otp: farmerMobileNumber → mobile. Enforce resend limits and
        bind mobile to transaction.'
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L344
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcStartResponse"
              examples:
                KhcStart:
                  value:
                    status: 200 OK
                    data: 
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful
            callback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KhcStartRequest"
            examples:
              KhcStart:
                value:
                  mobile: "<mobile>"
  "/auth/verify-otp":
    post:
      operationId: KhcVerify
      summary: Verify the OTP and receive the session token a filing must quote
      x-oan-mapping: {href: ./mappings/confirm.yaml, status: source-traced}
      x-oan-binding:
        descriptorCode: khc-grievance
        resourceType: openagrinet:Grievance
        action: confirm
      description: 'verify_otp: farmerMobileNumber → mobile. Keep verification and
        registration state private.'
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L384
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcVerifyResponse"
              examples:
                KhcVerify:
                  value:
                    status: 200 OK
                    data:
                      isRegistered: true
                      mobile: "<mobile>"
                      token: "<redacted>"
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful
            callback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KhcVerifyRequest"
            examples:
              KhcVerify:
                value:
                  mobile: "<mobile>"
                  otp: '000000'
