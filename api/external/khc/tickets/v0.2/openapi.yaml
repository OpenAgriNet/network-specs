                  gender: O
  "/v1/state/grievances/check-status":
    post:
      operationId: KhcStatusStart
      x-oan-mapping: {href: ./mappings/select.yaml, status: draft-native}
      x-oan-binding:
        descriptorCode: khc-grievance
        resourceType: openagrinet:Grievance
        action: select
      summary: Ask KHC to send an OTP before a gated status read
      description: >
        Bound to the Grievance capability's `select` action. The only input is a
        query parameter on a POST -- verified against the provider on
        2026-11-24, where grievanceNo in the body returns
        400 "grievanceNo is required" and the same value in the query string
        reaches the grievance. A registry Path cannot hold a query, so the
        mapping names the field under the reserved `_query` key and the adapter
        lifts it onto the URL whatever the method (util/query.go, Split).

        The request body below is empty and required because this repository's
        contract checker requires one on every POST. Nothing is read from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KhcStatusStartRequest"
            examples:
              KhcStatusStart:
                value: {}
      parameters:
      - name: grievanceNo
        in: query
        required: true
        x-oan-from: grievance.id
        description: >
          KHC's own number for the grievance, not the externalReferenceNo the
          filing sent.
        schema:
          "$ref": "#/components/schemas/GrievanceNumber"
        example: MH/123456/1
      responses:
        '200':
          description: An OTP was sent to the mobile the grievance is filed against.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcStatusStartResponse"
              examples:
                KhcStatusStart:
                  value:
                    status: 200 OK
                    message: OTP sent
        default:
          description: >
            Provider error, or no such grievance. A 404 here carries
            message "Grievance not found".
  "/v1/state/grievances/verify-otp":
    post:
      operationId: KhcStatusVerify
      x-oan-mapping: {href: ./mappings/status.yaml, status: draft-native}
      x-oan-binding:
        descriptorCode: khc-grievance
        resourceType: openagrinet:Grievance
        action: status
      summary: Verify the status OTP and read the grievance
      description: >
        Bound to the Grievance capability's `status` action, the second step of
        the gated read. Takes both values in a JSON body, unlike check-status.
        Verified on 2026-11-24: a body of grievanceNo plus otp returns
        401 "Invalid or expired OTP" when no check-status preceded it, which is
        the gate -- a caller cannot reach a grievance with a number alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KhcStatusVerifyRequest"
            examples:
              KhcStatusVerify:
                value:
                  grievanceNo: MH/123456/1
                  otp: '123456'
      responses:
        '200':
          description: >
            The grievance as KHC holds it. Carries the farmer's own words, so it
            is private in full, not only in its identifiers.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcReadGrievanceResponse"
              examples:
                KhcStatusVerify:
                  value:
                    status: 200 OK
                    data:
                      grievanceNo: MH/123456/1
                      currentStatus: Open
        default:
          description: Wrong or expired OTP, or provider error.
  "/v1/state/grievances/status":
    get:
      operationId: KhcReadGrievance
      summary: Read a grievance by its number
      x-oan-unbound-reason: >
        Unbound on purpose, and not pending anything. It reads a grievance on a
        number alone, with no OTP, and the reply carries the free text the
        farmer wrote -- so binding it would publish a read with no gate at all.
        v1 prompts for a six-digit OTP before reaching this endpoint, but the
        provider backend's status branch ignores the request type that prompt
        sets, so the prompt may never have gated anything.

        The gated pair above is bound instead: check-status sends an OTP to the
        mobile the grievance was filed against, and verify-otp answers it and
        returns the same body this operation would. Nothing is lost by leaving
        this one out.
      parameters:
      - name: grievanceNo
        in: query
        required: true
        x-oan-from: grievance.id
        description: >
          KHC's own number for the grievance, not the externalReferenceNo the
          filing sent. Accepted shape is two letters, a six-digit block and a
          serial, e.g. MH/123456/1.
        schema:
          "$ref": "#/components/schemas/GrievanceNumber"
        example: MH/123456/1
      responses:
        '200':
          description: >
            The grievance as KHC holds it. Carries the farmer's own words, so
            it is private in full, not only in its identifiers.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcReadGrievanceResponse"
              examples:
                KhcReadGrievance:
                  value:
                    status: 200 OK
                    data:
                      grievanceNo: MH/123456/1
                      currentStatus: Open
        default:
          description: Provider error or unconfirmed result. Does not establish
            that the grievance is absent.
components:
  schemas:
    KhcStartRequest:
      type: object
      properties:
        mobile:
          type: string
          x-oan-from: subject.mobile
      required:
      - mobile
    KhcStartResponse:
      type: object
      properties:
        status:
          type: string
        data: {}
    KhcVerifyRequest:
      type: object
      properties:
        mobile:
          type: string
          x-oan-from: subject.mobile
        otp:
          type: string
          x-oan-from: challenge.otp
      required:
      - mobile
      - otp
    KhcVerifyResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            isRegistered:
              type: boolean
            mobile:
              type: string
            token:
              type: string
    KhcRefstatesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              stateid:
                type: integer
              statename:
                type: string
    KhcRefdistrictsResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              districtid:
                type: integer
              districtname:
                type: string
    KhcRefsubdistrictsResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              subdistrictid:
                type: integer
              subdistrictname:
                type: string
    KhcRefvillagesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              villageid:
                type: integer
              villagename:
                type: string
    KhcRefschemesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: integer
              schemename:
                type: string
    KhcRefcategoriesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              problemcategory:
                type: integer
              categoryname:
                type: string
    KhcRefsubcategoriesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              problemsubcategory:
                type: integer
              subcategoryname:
                type: string
    KhcCreateRequest:
      type: object
      properties:
        externalReferenceNo:
          type: string
          x-oan-from: grievance.reference
        farmerMobileNumber:
          type: string
          x-oan-from: subject.mobile
        farmerText:
          type: string
          x-oan-from: grievance.text
        farmerLanguage:
          type: string
          x-oan-from: subject.language
        stateId:
          type: integer
          x-oan-from: subject.state
        villageId:
          type: integer
          x-oan-from: subject.village
        scheme:
          type: integer
          x-oan-from: scheme.id
        division:
          type: integer
          x-oan-from: scheme.division
        problemCategory:
          type: integer
          x-oan-from: grievance.category
        problemSubCategory:
          type: integer
          x-oan-from: grievance.subCategory
        farmerName:
          type: string
          x-oan-from: subject.name
        gender:
          x-oan-from: subject.gender
          enum:
          - M
          - F
          - O
      required:
      - externalReferenceNo
      - farmerMobileNumber
      - farmerText
      - farmerLanguage
      - stateId
      - villageId
      - scheme
      - division
      - problemCategory
      - problemSubCategory
    KhcCreateResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            grievanceNo:
              type: string
    ReferenceId:
      type: integer
      minimum: 1
      description: >
        A KHC reference identifier. Every list returns its own id field --
        stateid, districtid, subdistrictid, villageid, scheme, problemcategory,
        problemsubcategory -- and the parent is sent back under a camelCase
        name, so stateId goes out and stateid comes back.
    KhcStatusStartRequest:
      type: object
      additionalProperties: false
      description: >
        Deliberately empty. This POST carries no body fields: grievanceNo
        travels in the query string, which is why no registry row can express
        it. Declared only because an empty body is what the provider accepts
        and every POST in this repository must declare one.
    KhcStatusStartResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    KhcStatusVerifyRequest:
      type: object
      required: [grievanceNo, otp]
      additionalProperties: false
      properties:
        grievanceNo:
          x-oan-from: grievance.id
          "$ref": "#/components/schemas/GrievanceNumber"
        otp:
          type: string
          x-oan-from: challenge.otp
          pattern: '^[0-9]{6}$'
          description: >
            Six digits. The length KHC's filing challenge advertises; the status
            OTP has not been separately stated.
    GrievanceNumber:
      type: string
      pattern: '^[A-Za-z]{2}/[0-9]{6}/0*[1-9][0-9]*$'
      description: >
        Two letters, a six-digit block and a serial with no leading zero.
        Carried over from the guard in agents/tools/khc.py, which is the only
        place the shape is written down; KHC has not stated it.
    KhcReadGrievanceResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            grievanceNo:
