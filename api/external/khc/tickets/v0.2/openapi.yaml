  "/v1/state/grievances":
    post:
      operationId: KhcCreate
      summary: File the grievance against the resolved desk and return its number
      x-oan-mapping: {href: ./mappings/support.yaml, status: source-traced}
      x-oan-binding:
        descriptorCode: khc-grievance
        resourceType: openagrinet:Grievance
        action: support
      description: Legacy init/create_grievance → proposed v2 support. Require explicit
        confirmation, verified registration and resolved IDs. New farmers also send
        farmerName and gender. Do not equate externalReferenceNo with returned grievanceNo;
        ambiguous submission must not auto-retry.
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L588
      responses:
        '200':
          description: Native success payload; examples are synthetic.
