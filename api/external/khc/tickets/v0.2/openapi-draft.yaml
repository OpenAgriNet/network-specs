components:
  schemas:
    KhcStartRequest:
      type: object
      properties:
        mobile:
          type: string
      required:
      - mobile
    KhcStartResponse:
      type: object
      properties:
        status:
          type: string
        data: {}
    KhcVerifyRequest:
      type: object
      properties:
        mobile:
          type: string
        otp:
          type: string
      required:
      - mobile
      - otp
    KhcVerifyResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            isRegistered:
              type: boolean
            mobile:
              type: string
            token:
              type: string
    KhcRefstatesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              stateid:
                type: integer
              statename:
                type: string
    KhcRefdistrictsResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              districtid:
                type: integer
              districtname:
                type: string
    KhcRefsubdistrictsResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              subdistrictid:
                type: integer
              subdistrictname:
                type: string
    KhcRefvillagesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              villageid:
                type: integer
              villagename:
                type: string
    KhcRefschemesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: integer
              schemename:
                type: string
    KhcRefcategoriesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              problemcategory:
                type: integer
              categoryname:
                type: string
    KhcRefsubcategoriesResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              problemsubcategory:
                type: integer
              subcategoryname:
                type: string
    KhcCreateRequest:
      type: object
      properties:
        externalReferenceNo:
          type: string
        farmerMobileNumber:
          type: string
        farmerText:
          type: string
        farmerLanguage:
          type: string
        stateId:
          type: integer
        villageId:
          type: integer
        scheme:
          type: integer
        division:
          type: integer
        problemCategory:
          type: integer
        problemSubCategory:
          type: integer
        farmerName:
          type: string
        gender:
          enum:
          - M
          - F
          - O
      required:
      - externalReferenceNo
      - farmerMobileNumber
      - farmerText
      - farmerLanguage
      - stateId
      - villageId
      - scheme
      - division
      - problemCategory
      - problemSubCategory
    KhcCreateResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            grievanceNo:
              type: string
    KhcStatusStartResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    KhcStatusReadRequest:
      type: object
      properties:
        grievanceNo:
          type: string
        otp:
          type: string
      required:
      - grievanceNo
      - otp
    KhcStatusReadResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            grievanceNo:
              type: string
            currentStatus:
              type: string
  securitySchemes:
    service:
      type: apiKey
      in: header
      name: Authorization
      description: ApiKey followed by a space and the configured key.
