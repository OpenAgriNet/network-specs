                value:
                  externalReferenceNo: BV-example
                  farmerMobileNumber: "<mobile>"
                  farmerText: Example issue
                  farmerLanguage: en
                  stateId: 1
                  villageId: 2
                  scheme: 3
                  division: 4
                  problemCategory: 5
                  problemSubCategory: 6
              newFarmer:
                value:
                  externalReferenceNo: BV-example
                  farmerMobileNumber: "<mobile>"
                  farmerText: Example issue
                  farmerLanguage: en
                  stateId: 1
                  villageId: 2
                  scheme: 3
                  division: 4
                  problemCategory: 5
                  problemSubCategory: 6
                  farmerName: Example
                  gender: O
  "/v1/state/grievances/check-status":
    post:
      operationId: KhcStatusStart
      description: 'get_status_otp: query only, no HTTP body. Starts a separate challenge
        for this grievance.'
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L568
