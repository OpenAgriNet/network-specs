openapi: 3.1.1
info:
  title: khc/tickets native requests (implementation draft)
  version: 0.2.0-draft
  x-contract-role: provider-native
servers:
- url: https://provider.example.invalid
  description: Non-routable placeholder; configure the provider service base URL.
x-draft:
  catalogCandidate:
    descriptorCode: khc-tickets
    resourceType: openagrinet:Grievance
    informationMode: OnDemand
    publicationStatus: inactive-proposal
    actions:
    - action: init
      operationRef: '#/paths/~1auth~1send-otp/post'
      variant: KhcStart
      mapping: mappings/init/send-otp.yaml
    - action: init
      operationRef: '#/paths/~1auth~1verify-otp/post'
      variant: KhcVerify
      mapping: mappings/init/verify-otp.yaml
    - action: support
      operationRef: '#/paths/~1v1~1state~1grievances/post'
      variant: KhcCreate
      mapping: mappings/support.yaml
    - action: status
      operationRef: '#/paths/~1v1~1state~1grievances~1check-status/post'
      variant: KhcStatusStart
      mapping: mappings/status/KHCStartCaseLookup.yaml
    - action: status
      operationRef: '#/paths/~1v1~1state~1grievances~1verify-otp/post'
      variant: KhcStatusRead
      mapping: mappings/status/KHCReadCase.yaml
  proposedActions:
  - init
  - support
  - status
  needsConfirmation:
  - Pin deployed revision; validate sanitized success and failure responses and session
    handling before activation.
paths:
  "/auth/send-otp":
    post:
      operationId: KhcStart
      description: 'get_otp: farmerMobileNumber → mobile. Enforce resend limits and
        bind mobile to transaction.'
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L344
      x-mappings:
      - mappings/init/send-otp.yaml
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcStartResponse"
              examples:
                KhcStart:
                  value:
                    status: 200 OK
                    data: 
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful
            callback.
      security:
      - service: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KhcStartRequest"
            examples:
              KhcStart:
                value:
                  mobile: "<mobile>"
  "/auth/verify-otp":
    post:
      operationId: KhcVerify
      description: 'verify_otp: farmerMobileNumber → mobile. Keep verification and
        registration state private.'
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L384
      x-mappings:
      - mappings/init/verify-otp.yaml
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KhcVerifyResponse"
              examples:
                KhcVerify:
                  value:
                    status: 200 OK
                    data:
                      isRegistered: true
                      mobile: "<mobile>"
                      token: "<redacted>"
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful
            callback.
      security:
      - service: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KhcVerifyRequest"
            examples:
              KhcVerify:
                value:
                  mobile: "<mobile>"
                  otp: '000000'
