status: draft-native
deployable: false
action: support
source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/khc/khc.service.ts#L588
operationRef: https://openagrinet.github.io/network-specs/api/external/khc/tickets/v0.2/openapi.yaml#/paths/~1v1~1state~1grievances/post
request:
  in: body
  jsonata: >
    {"externalReferenceNo": $attributes.referenceNo,
     "farmerMobileNumber": $string($attributes.farmerMobileNumber),
     "farmerText": $trim($attributes.grievance.description),
     "farmerLanguage": $attributes.grievance.language,
     "stateId": $attributes.location.stateId,
     "villageId": $attributes.location.villageId,
     "scheme": $number($attributes.scheme.code),
     "division": $attributes.grievance.division,
     "problemCategory": $number($attributes.grievance.category.code),
     "problemSubCategory": $number($attributes.grievance.subCategory.code)}
  newFarmerAdditionalFields:
    jsonata: '{"farmerName": $attributes.applicantName, "gender": $attributes.applicantGender}'
    when: the confirm reply returned data.isRegistered false
  preconditions:
  - a session token captured on confirm, for this same mobile
  - the farmer confirmed filing in words, not by the agent inferring it
  - every one of the ten identifiers resolved, none defaulted
response:
  jsonata: '{"grievanceNo": response.data.grievanceNo}'
  guard: >
    externalReferenceNo is ours and grievanceNo is KHC's. They are not the same
    value and must never be reported as one -- quoting our own reference back
    as the grievance number would hand the farmer a number no desk recognises.

    Never retried on an ambiguous result. A timeout after the request left is
    not evidence the grievance was not filed, and a retry files a second one
    against a real desk under a real farmer's name. Report the uncertainty
    instead and let the farmer check the status.
missing:
- Which of the ten identifiers KHC validates against each other. If it accepts
  a villageId that does not sit under the stateId sent, a mis-resolved cascade
  files the grievance at the wrong desk and still answers 200.
