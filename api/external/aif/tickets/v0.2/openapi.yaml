openapi: 3.1.1
info:
  title: aif/tickets native requests
  version: 0.2.0
  x-contract-role: provider-native
servers:
- url: https://provider.example.invalid
  description: Non-routable placeholder; configure the provider service base URL.
paths:
  "/support-tickets":
    get:
      operationId: AifTickets
      description: 'grievance_status: beneficiary_id → beneficiaryId. Query and JSON
        body are identical. A string instead of an array can mean no tickets; an object
        with Message signals failure. No filing call.'
      x-source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/aif/aif.service.ts#L225
      x-oan-mapping: {href: ./mappings/status.yaml, status: existing}
      x-oan-binding:
        descriptorCode: aif-support-tickets
        resourceType: openagrinet:Grievance
        action: status
      responses:
        '200':
          description: Native success payload; examples are synthetic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AifTicketsResponse"
              examples:
                AifTickets:
                  value:
                  - BeneficiaryId: 101
                    LoanApplicationNumber: 201
                    Question: Example
                    Status: Open
                    description: Example
                    subQueryType: Example
                empty:
                  value: No tickets
        default:
          description: Provider error or unconfirmed result. Do not treat as a successful
            callback.
      security:
      - apiKey: []
        session: []
      parameters:
      - name: beneficiaryId
        in: query
        required: true
        x-oan-from: beneficiary.id
        # Bound to the session the loan capability bought; bindings read text only.
        x-oan-as: string
        schema:
          "$ref": "#/components/schemas/AifBeneficiaryId"
        example: 101
      x-client-body: Same JSON fields as query; existing client sends both.
components:
  schemas:
    AifBeneficiaryId:
      type: integer
    AifTicketsResponse:
      anyOf:
      - type: array
        items:
          type: object
          properties:
            BeneficiaryId:
              type: integer
            LoanApplicationNumber:
              type: integer
            Question:
              type: string
            Status:
              type: string
            description:
              type: string
            subQueryType:
              type: string
      - type: string
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apiKey
    session:
      type: http
      scheme: bearer
