status: draft-native
deployable: false
action: status
source: https://github.com/OpenAgriNet/bharat-provider-backend/blob/dev/src/services/kcc/kcc.service.ts#L259
operationRef: https://openagrinet.github.io/network-specs/api/external/kcc/loan/v0.2/openapi.yaml#/paths/~1bharatVistaar~1krishika~1applicationStatus/post
request:
  in: body
  sealed: AES-256-CBC over UTF-8 JSON, hex, under data. The adapter seals; the mapping writes plaintext.
  jsonata: '{"requestID": session.requestID, "otp": $number(payload.otp)}'
response:
  jsonata: '{"applications": response.applications}'
  guard: >
    One call both checks the OTP and answers with the applications, so a
    refusal here means the OTP was wrong or expired -- report that, not an
    outage. A rejected application is returned as DRAFT, so rejectionReason
    decides whether it was rejected. An empty list is a valid answer.
missing:
- Confirm the IV rule for the fixed AES key. Everything else is traced to source.
