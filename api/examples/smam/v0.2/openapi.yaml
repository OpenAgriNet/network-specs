openapi: 3.1.1
info:
  title: SMAM proposed adapter exchanges
  version: 0.2.0
  description: Illustrative consumer-facing operation contracts, not native endpoints, verified bindings,
    or production schemas. Field names, session references and sample values are proposed, not the legacy
    payload. Transport authentication, failures, retries and protocol profile must be agreed before invocation.
servers:
- url: https://adapter.example.invalid
paths:
  /example/readBenefit:
    post:
      operationId: SMAMReadBenefit
      summary: Read a benefit record by application number or mobile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMAMReadBenefitRequest'
            example:
              searchType: application_no
              searchValue: DEMO-APPLICATION
      responses:
        '200':
          description: Completed operation; not a transport acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMAMReadBenefitResponse'
              example:
                records: []
        default:
          description: Failure; authentication and error mapping require provider agreement.
components:
  schemas:
    SMAMReadBenefitRequest:
      type: object
      properties:
        searchType:
          enum:
          - application_no
          - mobile
        searchValue:
          type: string
          minLength: 1
      required:
      - searchType
      - searchValue
      additionalProperties: false
    SMAMReadBenefitResponse:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              applicationReference:
                type: string
                minLength: 1
              status:
                type: string
                minLength: 1
            required:
            - applicationReference
            - status
            additionalProperties: false
      required:
      - records
      additionalProperties: false
