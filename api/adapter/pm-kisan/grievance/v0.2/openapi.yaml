openapi: 3.1.1
info:
  x-contract-role: adapter-proposal
  title: PM-KISAN grievance integration contract
  version: 0.2.0
  description: Proposed OAN adapter payloads for this external service. Not an official
    provider API specification. Paths are illustrative; authentication, errors and
    Beckn wire bindings are not defined. Examples are synthetic.
servers:
- url: https://adapter.example.invalid
  description: Non-operational review placeholder
paths:
  /pmkisan/init:
    post:
      operationId: PMKISANInit
      summary: PMKISANInit attributes exchange
      description: Proposed adapter-facing synchronous operation for consumer review.
        Not a deployed provider URL or a complete Beckn wire envelope. Authentication
        and the final Beckn binding require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMKISANInitRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMKISANInitResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream
            errors or personal data.
  /pmkisan/status:
    post:
      operationId: PMKISANStatus
      summary: PMKISANStatus attributes exchange
      description: Proposed adapter-facing synchronous operation for consumer review.
        Not a deployed provider URL or a complete Beckn wire envelope. Authentication
        and the final Beckn binding require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMKISANStatusRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMKISANStatusResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream
            errors or personal data.
  /pmkisan/support:
    post:
      operationId: PMKISANSupport
      summary: PMKISANSupport attributes exchange
      description: Proposed adapter-facing synchronous operation for consumer review.
        Not a deployed provider URL or a complete Beckn wire envelope. Authentication
        and the final Beckn binding require consumer agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PMKISANSupportRequest'
      responses:
        '200':
          description: Successful operation outcome, not a transport ACK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PMKISANSupportResponse'
        default:
          description: Error contract is not yet agreed. Do not return raw upstream
            errors or personal data.
components:
  schemas:
    PMKISANInitRequest:
      type: object
      additionalProperties: false
      properties:
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context
            array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        enrolmentId:
          type: string
          pattern: ^[A-Za-z0-9]+$
          minLength: 6
          maxLength: 20
          not:
            pattern: ^[0-9]{12}$
          description: The enrolment the grievance is about, as the scheme numbers
            it. Never an Aadhaar number.
          x-oan-pii:
            class: identifier
            handling:
            - no-log
            - no-trace
          x-jsonld-id: openagrinet:enrolmentId
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        scheme:
          type: object
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
          properties:
            code:
              const: PM-KISAN
              type: string
              enum:
              - PM-KISAN
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          required:
          - code
      required:
      - '@context'
      - '@type'
      - enrolmentId
      - informationMode
      - scheme
