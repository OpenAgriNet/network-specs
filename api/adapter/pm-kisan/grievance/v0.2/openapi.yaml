              type: string
              enum:
              - PM-KISAN
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          required:
          - code
      required:
      - '@context'
      - '@type'
      - challenge
      - informationMode
      - scheme
