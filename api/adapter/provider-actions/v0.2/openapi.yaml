components:
  schemas:
    RequestConsentRequest:
      type: object
      required:
      - purpose
      properties:
        purpose:
          type: string
          minLength: 1
      description: Private adapter input; authentication and authorization are checked outside discovery.
    RequestConsentResult:
      type: object
      required:
      - consentRequestReference
      properties:
        consentRequestReference:
          type: string
          minLength: 1
    ReadConsentedRecordsRequest:
      type: object
      required:
      - consentGrantReference
      properties:
        consentGrantReference:
          type: string
          minLength: 1
      description: Private adapter input; authentication and authorization are checked outside discovery.
    ReadConsentedRecordsResult:
      type: object
      required:
      - farmRecords
      properties:
        farmRecords:
          type: array
          items:
            type: object
          description: Provider-specific records; field-level agreement is required before rollout.
    RetrieveAmulSchemesRequest:
      type: object
      required:
      - resourceId
      properties:
        resourceId:
          type: string
          minLength: 1
      description: Private adapter input; authentication and authorization are checked outside discovery.
    RetrieveAmulSchemesResult:
      type: object
      required:
      - resources
      properties:
        resources:
          type: array
          items:
            type: object
            required:
            - id
            - resourceAttributes
            properties:
              id:
                type: string
              resourceAttributes:
                allOf:
                - $ref: https://openagrinet.github.io/network-specs/schema/KnowledgeResource/v0.2/attributes.yaml#/components/schemas/KnowledgeResource
                - properties:
                    informationMode:
                      const: Direct
    ReadAllowanceRequest:
      type: object
      required:
      - plotReference
      properties:
        plotReference:
          type: string
          minLength: 1
      description: Private adapter input; authentication and authorization are checked outside discovery.
    ReadAllowanceResult:
      type: object
      required:
      - allowanceReference
      properties:
        allowanceReference:
          type: string
          minLength: 1
    PrepareBookingRequest:
      type: object
      required:
      - allowanceReference
      properties:
        allowanceReference:
          type: string
          minLength: 1
      description: Private adapter input; authentication and authorization are checked outside discovery.
    PrepareBookingResult:
      type: object
      required:
