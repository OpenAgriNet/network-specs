openapi: 3.1.1
info:
  x-contract-role: adapter-proposal
  title: KCC proposed adapter exchanges
  version: 0.2.0
  description: Illustrative consumer-facing operation contracts, not native endpoints, verified bindings,
    or production schemas. Field names, session references and sample values are proposed, not the legacy
    payload. Transport authentication, failures, retries and protocol profile must be agreed before invocation.
servers:
- url: https://adapter.example.invalid
paths:
  /example/startChallenge:
    post:
      operationId: KCCStartChallenge
      summary: Start the applicant's verification challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KCCStartChallengeRequest'
            example:
              mobile: DEMO-MOBILE
      responses:
        '200':
          description: Completed operation; not a transport acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KCCStartChallengeResponse'
              example:
                challengeReference: DEMO-CHALLENGE
        default:
          description: Failure; authentication and error mapping require provider agreement.
  /example/readApplications:
    post:
      operationId: KCCReadApplications
      summary: Verify and read candidate applications; ask which one only if several are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KCCReadApplicationsRequest'
            example:
              challengeReference: DEMO-CHALLENGE
              otp: '000000'
      responses:
        '200':
          description: Completed operation; not a transport acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KCCReadApplicationsResponse'
              example:
                applications:
                - applicationNumber: DEMO-KCC
                  status: received
        default:
          description: Failure; authentication and error mapping require provider agreement.
components:
  schemas:
    KCCStartChallengeRequest:
      type: object
      properties:
        mobile:
          type: string
          minLength: 1
      required:
      - mobile
      additionalProperties: false
    KCCStartChallengeResponse:
      type: object
      properties:
        challengeReference:
          type: string
          minLength: 1
      required:
      - challengeReference
      additionalProperties: false
    KCCReadApplicationsRequest:
      type: object
      properties:
        challengeReference:
          type: string
          minLength: 1
        otp:
          type: string
          minLength: 1
      required:
      - challengeReference
      - otp
      additionalProperties: false
    KCCReadApplicationsResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            type: object
            properties:
              applicationNumber:
                type: string
                minLength: 1
              status:
                type: string
                minLength: 1
            required:
            - applicationNumber
            - status
            additionalProperties: false
      required:
      - applications
      additionalProperties: false
