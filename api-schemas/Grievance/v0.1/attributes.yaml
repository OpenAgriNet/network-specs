openapi: 3.1.1
info:
  title: OpenAgriNet - Grievance API Attributes (base)
  version: 0.1.0
  description: >
    The field set every grievance API pack on this network shares, plus the
    vocabulary those fields are written in.

    Not a pack, and not a payload type. There is no profile.json beside this
    file, so it is never indexed as a schema pack, and nothing ever sends
    "@type": openagrinet:GrievanceBase. It exists to be composed: a pack
    allOf-references GrievanceBase, pins its own @type and scheme, and adds the
    fields its own portal has. What a payload declares itself to be is always a
    concrete pack.

    It lives under api-schemas/ rather than schema/ on purpose. A grievance is
    a Provider's API surface, not a thing the network describes, so the shape
    belongs beside the packs that use it and not in a domain schema.

    A payload has five bands, and the band a field sits in says who wrote it.
    At the top: who is asking and about what -- informationMode, provider,
    scheme, enrolmentId. Under grievance: what the farmer submitted. Under case:
    what the portal has on file, the stamps it applied included. Under
    challenge: the proof the caller presents with a guarded call. Under
    challengeIssued: the portal's acknowledgement that it sent one. Anything a
    pack adds of its own -- a crop season, an applicant's phone -- sits at the
    top with the rest of the context.

    Not every pack uses every band. A desk that issues no challenge refuses
    both challenge bands outright rather than leave them defined and
    unfillable, and says so in challengeMethods.

    The grievance and case containers are the point of this file. Before them the same split
    lived in a prefix -- grievanceCategory against caseStatus -- which read the
    same but checked nothing: a field named either way validated either way.
    As containers the split is enforced, and three rules come with it that were
    conventions before. A grievance is all or nothing, because required inside
    the block fires whenever the block is present. A response must say where the
    case stands. And a request must be asking for something. Each pack states
    the last two, because what counts as a complete answer and as a meaningful
    ask is the portal's business, not the network's.

    One field sits in no band at all. challengeMethods says what a desk
    requires before a grievance can be filed, and it appears on a catalog entry
    and on no transaction payload.

    @type is deliberately absent: it is the pack's identity, so a base could
    only accept any string and leave the pack to restate the whole thing.

    Descriptions here say what a field means network-wide. A pack restates the
    field with a description of its own to record how its portal fills it:
    which upstream field it is read from, and what the portal does that the
    shape alone does not show.

components:
  schemas:
    GrievanceBase:
      type: object
      # No additionalProperties: false. A pack adds its own fields on top of
      # this, and sealing here would refuse every one of them.
      required: [informationMode, scheme]
      properties:
        informationMode:
          type: string
          enum: [OnDemand, Direct]
          description: >
            Direction of this payload. OnDemand is the ask; Direct is an
            answer carrying a real case.

            Direction is carried by this field and never by the Beckn action,
            so the same attributes serve every leg without change.
          x-jsonld-id: "openagrinet:informationMode"

        provider:
          allOf:
            - $ref: "#/components/schemas/ProviderReference"
          description: >
            The portal this grievance belongs to: who it is filed with on the
            way in, and who the case came from on the way out. One field for
            both, because on a grievance they are always the same party -- the
            adapter reads a case back from the portal it filed with, and no
            third party stands between them.

            Carried in the attributes on the support leg only, and only
            because a SupportAction composes no Contract: every other action
            has one, and there the same fact is read from
            commitments[].offer.provider.

            Same shape in both places, deliberately. A reader writes
            .provider.id on support and .provider.id on the contract, and the
            adapter's own binding path says channels[].provider.id against a
            Beckn v2 default of commitments[].offer.provider.id -- the same
            grammar, the same tail, a different container.

            scheme.code names a scheme rather than a participant, so it cannot
            stand in.

            Not required, and deliberately not part of a Direct guard. On a
            contract leg the attributes genuinely do not carry it -- Beckn's
            offer does -- so requiring it here would force a second copy into
            commitmentAttributes.
          x-jsonld-id: "openagrinet:provider"

        scheme:
          allOf:
            - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
            - type: object
              required: [code]
          description: >
            Scheme the grievance is raised against. Present on every payload in
            both directions, which is what makes it the one unconditional
            field.

            A pack pins code to its own scheme, because a pack describes one
            scheme and nothing else. Left open, a payload could name another
            scheme and still validate -- the one field present on every payload
            would be the one field checking nothing. allOf narrowing is
            evaluated, so a pack's pin is enforced rather than advisory.

            name is not pinned anywhere: a scheme has an official title but it
            is written differently in different places, and the network has no
            reason to arbitrate spelling.
          x-jsonld-id: "openagrinet:scheme"

        enrolmentId:
          type: string
          minLength: 1
          maxLength: 64
          x-oan-pii:
            class: identifier
            handling: [no-log, no-trace]
            note: >
              Ties a case to a named farmer's standing in a scheme. Returned on
              a case read, so no-echo would be wrong; it is the caller's own
              reference coming back.
          description: >
            The enrolment the grievance is about: the farmer's standing in the
            scheme, not the farmer. Every scheme issues one under some name --
            an insurance application number, a registration number -- and it is
            what support is raised against.

            One slot rather than a differently-named field per scheme, because
            every pack had put its own name on the same thing and then given it
            the same Beckn placement. A reader writes .enrolmentId once.

            On support it is the orderId, the thing support is required
            against, and it holds that meaning in both directions: the ask
            sends it and on_support echoes it unchanged. Whatever handle the
            portal issues in return does not go there -- it comes back in
            case.ticketNo, because a ticket is not what the complaint is
            against.

            The IRI is the network's own and shared. The value spaces differ by
            scheme and the packs pin them, but an opaque enrolment reference is
            not a vocabulary anyone reasons over, so there is nothing to tell
            apart at the IRI level -- unlike the category codes, which are.
          x-beckn-path:
            support: message.support.orderId
          x-jsonld-id: "openagrinet:enrolmentId"

        grievance:
          allOf:
            - $ref: "#/components/schemas/Grievance"
          description: >
            What the farmer submitted. Absent on a payload that is not about a
            specific complaint -- reading every case on an enrolment, or
            acknowledging a challenge.
          x-jsonld-id: "openagrinet:grievance"

        case:
          allOf:
            - $ref: "#/components/schemas/Case"
          description: >
            What the portal has on file. Absent on the way in, except where a
            caller is naming a case to read.
          x-jsonld-id: "openagrinet:case"

        challengeMethods:
          type: array
          uniqueItems: true
          items:
            type: string
          description: >
            Which challenge a caller must pass before a grievance can be filed.
            Non-empty means a challenge comes first and the array names it;
            empty means the portal issues none and filing is the first call. A
            caller reads this to know which sequence a desk needs before it
            sends anything.

            Declaration-only: it appears on a catalog entry and never on a
            transaction payload. Each pack pins it to the one answer its portal
            gives, so the value is the pack's statement and not the publisher's
            choice.

            Empty rather than absent where there is no challenge. The field is
            also what tells a catalog entry apart from an ask: a grievance pack
            uses OnDemand for both, so a declaration carries none of the things
            each pack's "about something" gate looks for and needs a member of
            its own to satisfy it.

            A caller branches on the values and not on the length. A portal that
            adds a second mechanism widens the list, and a caller that reads the
            method keeps working.
          x-jsonld-id: "openagrinet:challengeMethods"

        challenge:
          type: object
          required: [method, value]
          additionalProperties: false
          x-oan-pii:
            class: credential
            handling: [no-log, no-trace, no-echo, no-forward]
            note: Proven once by the verify call and never passed to the lodge call.
          properties:
            method:
              type: string
              description: >
                Which mechanism this proof is for. Always one of the values the
                desk published in challengeMethods; each pack pins the enum to
                what its portal offers.
              x-jsonld-id: "openagrinet:challengeMethod"
            value:
              type: string
              pattern: "^[0-9]{4,8}$"
              x-oan-pii:
                class: credential
                handling: [no-log, no-trace, no-echo, no-forward]
                note: Proven once against the portal and never carried further.
              description: >
                The secret itself. The base bounds it to between four and eight
                digits, which is the range the portals on this network issue;
                each pack narrows to the one length its portal accepts, and the
                narrowing is evaluated rather than left to a mapping guard.

                Direction is carried by x-oan-pii, not by writeOnly. The network
                validates every payload as a request, on the way out as well as
                in, so writeOnly here would assert nothing while readOnly on the
                answering field would reject the very response it describes.
                no-echo is the rule the adapter reads, and it is unconditional.
              x-jsonld-id: "openagrinet:challengeValue"
          description: >
            Proof of identity, presented with the call it guards. Which calls
            those are is each pack's business: a desk that issues a challenge
            says so in challengeMethods and names the guarded actions in
            x-oan-required-by-action.

            No correlator field exists and additionalProperties refuses one.
            The portals on this network bind a challenge to the identity it was
            issued against and hand back no handle, so a caller sending one is
            confused about the mechanism rather than being quietly ignored.

            The whole object travels inbound only: never returned in any
            response, written to a log or attached to a trace, and the value is
            never forwarded to the call it guards. That is x-oan-pii no-echo and
            no-forward, which the adapter enforces.
          x-jsonld-id: "openagrinet:challenge"

        challengeIssued:
          type: object
          required: [method, expiresAt]
          additionalProperties: false
          properties:
            method:
              type: string
              description: Mechanism the portal used, from the same set as challengeMethods.
              x-jsonld-id: "openagrinet:challengeMethod"
            sentTo:
              type: string
              x-oan-pii:
                class: contact
                handling: [no-log, no-trace, mask-on-echo]
                note: >
                  Always the masked form of the destination, never the full
                  value. The one field in these packs that is echoed at all and
                  so the one that mask-on-echo applies to; everywhere else a
                  contact value is no-echo, which leaves nothing to mask.
              description: >
                Masked destination, so the farmer can confirm where the
                challenge went without the destination being disclosed.

                Optional, because not every portal says. One that names the
                destination has this field and a pack that pins the mask shape;
                one that answers only "sent to the registered mobile number"
                has nothing to put here, and the field is absent rather than
                guessed at from a number the caller supplied.
              x-jsonld-id: "openagrinet:challengeSentTo"
            expiresAt:
              allOf:
                - $ref: "#/components/schemas/Instant"
              description: >
                When the challenge stops being accepted. Required because the
                adapter always derives one, so a caller may rely on it.

                Always adapter-derived, never quoted. The OTP services on this
                network acknowledge with a message and no expiry, so the window
                here is the adapter's own statement about how long it will
                accept the proof.
              x-jsonld-id: "openagrinet:challengeExpiresAt"
          description: >
            Acknowledgement that the portal has sent a challenge. Carries no
            secret: the value itself is never returned. No correlator field
            exists and additionalProperties refuses one, for the same reason as
            on challenge.

            Returned and never sent, but not marked readOnly: the network
            validates responses as requests too, so readOnly would reject this
            acknowledgement outright.
          x-jsonld-id: "openagrinet:challengeIssued"

    Grievance:
      type: object
      required: [description]
      description: >
        The complaint as the farmer submitted it. Nothing the portal authored
        belongs in here, including the date it stamped on receipt -- that is
        case.filedOn.

        Present or absent as a whole. The required list fires only when the
        block is there, which is the rule worth having: a partial grievance is
        an error, an absent one is a payload that is not about a complaint.

        category is not required, because it is not always returned. PM-KISAN's
        status call does not send the grievance type back, so a response would
        have to omit it. Whether a caller must choose one to file is an
        action-level rule and is enforced by that action's mapping guard, which
        is where the rest of the per-action requirements already live.
      properties:
        category:
          allOf:
            - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
            - anyOf:
                - required: [code]
                - required: [name]
          description: >
            What the complaint is about, in the portal's own classification.
            code is the portal's value and name is its label.

            One of the two must be present, rather than code outright. A
            caller filing a grievance states code, because that is what the
            portal accepts. PMFBY's case read answers with
            TicketCategoryName and no id at all, so a response that carried
            the classification the portal actually sent could not satisfy a
            code requirement. Requiring either lets both legs say what they
            have; requiring neither would let an empty object through.

            Each pack pins its own value space and supplies its own IRI: the
            codes are published lists that do not overlap, and one IRI holding
            both could not be reasoned over.

        subCategory:
          allOf:
            - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
            - anyOf:
                - required: [code]
                - required: [name]
          description: >
            A second level of classification, where the portal has one. Carries
            the same code-or-name rule as category, and for the same reason:
            PMFBY returns TicketSubCategoryName without an id. Defined
            here rather than in a pack because a two-level taxonomy is ordinary
            in grievance systems, and a pack whose portal has one level refuses
            the field outright with not/required.

            A level of its own rather than half of a joined string. An earlier
            draft put both levels in one code separated by a dot, which the
            adapter then split back apart to send and rejoined to return --
            and the rejoin was ambiguous, because the portal's own category
            names contain the separator.

        description:
          type: string
          minLength: 10
          maxLength: 2000
          x-oan-pii:
            class: freetext
            handling: [no-log, no-trace]
            note: >
              Returned verbatim on a case read, so no-echo would be wrong. It is
              the farmer's own words and may hold anything the schema cannot see.
          description: >
            The farmer's account of the problem, in their own words. A minimum
            length because a grievance that says nothing cannot be acted on, and
            a maximum because this is unvalidated free text arriving from a
            caller and going on to the portal. Neither portal publishes an upper
            limit, so the bound is the network's own and matches case.remark:
            2000 characters, long enough for any real account of a problem.

            The one required member, because it is the only thing a grievance
            cannot be without.
          x-jsonld-id: "openagrinet:grievanceDescription"

    Case:
      type: object
      description: >
        The record as the portal holds it, the stamps it applied included. Every
        field here can differ between two reads of the same grievance.

        filedOn sits here rather than with the complaint even though it never
        changes: the portal stamps it, the farmer does not send it, and who
        authored a value is the line these two blocks are drawn on. Drawn on
        mutability instead, ticketNo would have had to move the other way, which
        reads wrong.

        No required list. A caller naming a case to read sends ticketNo alone; a
        response carries a status. What a complete response looks like is the
        pack's statement, since it depends on what the portal issues.
      properties:
        ticketNo:
          type: string
          description: >
            The handle the portal issues when a grievance is filed, and the
            thing a farmer quotes back to ask about it. Travels in both
            directions.

            Stays in the attributes on every leg -- no x-beckn-path moves it --
            so on_support returns it here and leaves orderId holding the
            enrolment reference it arrived with.

            A pack whose portal issues no handle at all would refuse the field
            outright with not/required, rather than leave it defined and
            permanently absent. Neither portal here is that case: both issue a
            handle on filing. PM-KISAN simply does not repeat it on a case
            read, so the field is present on a lodge reply and absent from a
            read -- which is why that pack's answer gate does not require it.
          x-jsonld-id: "openagrinet:ticketNo"

        status:
          allOf:
            - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
            - type: object
              required: [code]
              properties:
                code:
                  $ref: "#/components/schemas/CaseStatusCode"
          description: >
            Where the grievance stands. code is the network's CaseStatusCode,
            which is what a client branches on; name is the portal's own status
            phrase, kept verbatim, which is what the farmer is shown.

            code is required and name is not, and the absence of name is
            informative: it is how a client tells a state the adapter inferred
            from one the portal stated.

            A phrase the adapter does not recognise maps to UnderReview, keeping
            the phrase in name -- never to a terminal state, which must come
            from the portal. The adapter may infer a state; it must never infer
            that a case is finished.

            The enum is not narrowed in either pack. Neither portal publishes a
            full status vocabulary, so narrowing would be a guess that rejects a
            legitimate state.
          x-jsonld-id: "openagrinet:caseStatus"

        filedOn:
          allOf:
            - $ref: "#/components/schemas/CalendarDate"
          description: >
            Date the grievance was filed with the portal. An IST calendar date:
            an adapter must take today's date in IST and not from a UTC clock,
            which would record the previous day for anything filed before
            05:30 IST.
          x-jsonld-id: "openagrinet:filedOn"

        remark:
          type: string
          minLength: 1
          maxLength: 2000
          x-oan-pii:
            class: freetext
            handling: [no-log, no-trace]
            note: Written about this farmer's case.
          description: >
            The most recent remark recorded against the case. Named for the
            case rather than for an author: a remark may come from a reviewing
            officer, from a body handling the claim, or from the system closing
            a record, and the one portal that publishes remarks at all does not
            name the author reliably. It is an annotation on a record, not
            necessarily a reply addressed to the farmer.

            Absent rather than empty while nothing has been recorded, so an
            absent field reads as "nothing recorded yet". Bounded at 2000
            characters because it is unvalidated upstream free text being placed
            in a response.
          x-jsonld-id: "openagrinet:caseRemark"

        remarkedOn:
          allOf:
            - $ref: "#/components/schemas/CalendarDate"
          description: >
            Date the remark was recorded. Absent until there is a remark. An IST
            calendar date; see CalendarDate.

            Defined here because a portal may publish it. A pack whose portal
            does not refuses the field outright with not/required rather than
            leaving it defined and permanently absent.
          x-jsonld-id: "openagrinet:remarkedOn"

    CaseStatusCode:
      type: string
      enum: [Registered, UnderReview, AwaitingApplicant, Replied, Resolved, Rejected, Closed]
      description: >
        Where a case stands, in the network's own vocabulary, rather than in the
        portal's wording.

        The split is deliberate. code is the network's word and is what a client
        branches on; the accompanying descriptor name is the portal's own phrase,
        kept verbatim, and is what a farmer is shown. A portal phrase the adapter
        does not recognise maps to UnderReview -- non-terminal, and honest -- with
        the phrase preserved in name. The adapter may infer a state; it must never
        infer that a case is finished, so anything unmapped stays non-terminal.

        One list, shared by every grievance pack. A portal vocabulary is not
        enumerated anywhere: portals add phrases without notice, and the mapping
        from phrase to code is the adapter's job.
      x-enum-details:
        - value: Registered
          meaning: Lodged and acknowledged by the portal, not yet picked up.
          terminal: false
        - value: UnderReview
          meaning: Being worked by the portal. Also the fallback for a portal phrase the adapter does not recognise.
          terminal: false
        - value: AwaitingApplicant
          meaning: Blocked on the applicant -- a document or a clarification is needed before work can continue.
          terminal: false
        - value: Replied
          meaning: A response has been recorded against the case, which remains open.
          terminal: false
        - value: Resolved
          meaning: Closed with action taken.
          terminal: true
        - value: Rejected
          meaning: Closed without action; the case was refused.
          terminal: true
        - value: Closed
          meaning: Closed with no further action -- lapsed, withdrawn, or closed automatically.
          terminal: true

    CalendarDate:
      type: string
      format: date
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: >
        A calendar date in IST, as YYYY-MM-DD.

        The pattern is what enforces the shape. format is annotation-only under
        the validator in use -- no string format is registered, so format: date
        alone would accept any string at all. The zone is named because a bare
        date has no day boundary of its own: an adapter deriving one from a UTC
        clock records the previous day for anything happening before 05:30 IST.

    Instant:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
      description: >
        A fully-qualified instant, RFC 3339, with the offset always present.

        The pattern is what enforces the shape. format is annotation-only under
        the validator in use -- no string format is registered, so
        format: date-time alone would accept any string at all. Both are kept:
        the format for the generators that read it, the pattern for the
        validator that does not.

        The offset is not optional. A bare local timestamp is exactly what the
        portals send and exactly what must not cross the network, because a
        reader has no way to know which clock it came off. Either Z or a
        numeric offset is accepted here; which one is right is the emitting
        field's business, and a field that reads an IST clock says so itself.

    ProviderReference:
      allOf:
        - $ref: "https://schema.beckn.io/Provider/v2.1/attributes.yaml#/components/schemas/Provider"
        # A reference to a participant, not a catalog entry about one. Beckn's
        # Provider carries both, so the two it does not need here are refused
        # rather than left to drift into the payload.
        - not:
            required: [availableAt]        # a grievance portal has no premises
        - not:
            required: [providerAttributes] # an attributes object inside a
                                           # channel that is already one
        - type: object
          # Beckn already requires both. Restated because a reader -- and the
          # page generator -- resolves this file without fetching the remote
          # schema, and would otherwise be told id is optional. It is the
          # routing key; nothing about it is optional.
          required: [id, descriptor]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9.-]*$"
              maxLength: 100
              description: >
                Network participant id, lower-case, matching the registry
                exactly. This is the only field the adapter routes on.
            descriptor:
              type: object
              required: [name]
              description: >
                How the portal is named to a reader. Only name is required; the
                routing is done on id.
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >
                    Human-readable name of the provider. Beckn requires a
                    Provider to carry a descriptor, and a name is the only part
                    of one worth carrying here -- a code would merely repeat id.

                    Advisory, and never authoritative: the registry owns this
                    word. The adapter reads id and ignores name, so a caller
                    that sends a stale name is routed correctly anyway. It is
                    required because a participant id alone makes a payload
                    unreadable to anyone without the registry open.
      description: >
        A Beckn Provider narrowed to a reference: who this is, and nothing more.
        id is required and descriptor is required by Beckn itself; this
        narrowing adds the registry's id format and requires the descriptor to
        carry a name.
