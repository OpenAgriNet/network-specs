openapi: 3.1.1
info:
  title: OpenAgriNet - Scheme Application API Attributes
  version: 0.1.0
  description: >
    Read where a farmer's application to a government scheme stands: how many
    instalments have been paid, whether eKYC is done, and what is holding the
    money up. One scheme per payload, named by scheme.code. Each scheme defines
    one flat schema per call it serves and nothing else, so a new scheme or a
    new call is an addition and never an edit. This pack stands alone: it
    borrows nothing from another capability. Per-call shapes, worked examples
    and the reasoning behind every constraint are in README.md.


components:
  schemas:

    SchemeApplication:
      x-beckn-container-by-action:
        catalog/publish: resourceAttributes
        init: commitmentAttributes
        status: commitmentAttributes
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/api-schemas/SchemeApplication/v0.1/context.jsonld"
        "@type": openagrinet:SchemeApplication
      x-oan-schema-by-action:
        catalog/publish: SchemeApplicationCatalog
        init: SchemeApplicationInit
        status: SchemeApplicationStatus
      oneOf:
        - $ref: "#/components/schemas/PMKISANApplicationCatalog"
        - $ref: "#/components/schemas/PMKISANApplicationInit"
        - $ref: "#/components/schemas/PMKISANApplicationStatus"

    SchemeApplicationCatalog:
      oneOf:
        - $ref: "#/components/schemas/PMKISANApplicationCatalog"

    SchemeApplicationInit:
      oneOf:
        - $ref: "#/components/schemas/PMKISANApplicationInit"

    SchemeApplicationStatus:
      oneOf:
        - $ref: "#/components/schemas/PMKISANApplicationStatus"

    IsPMKISAN:
      type: object
      required: [scheme]
      properties:
        scheme:
          type: object
          required: [code]
          properties:
            code: { const: PM-KISAN }

    PMKISANApplicationCatalog:
      x-oan-fields:
        comesBack: [informationMode, scheme.code, scheme.name, challenge.methods]
      allOf:
        - $ref: "#/components/schemas/IsPMKISAN"
        - type: object
          additionalProperties: false
          required: ["@context", "@type", informationMode, scheme, challenge]
          properties:
            "@context": { $ref: "#/components/schemas/Context" }
            "@type": { $ref: "#/components/schemas/Type" }
            informationMode:
              type: string
              enum: [OnDemand]
              x-jsonld-id: "openagrinet:informationMode"
            scheme:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, enum: [PM-KISAN] }
                name: { type: string, minLength: 1 }
              x-jsonld-id: "openagrinet:scheme"
            challenge:
              type: object
              additionalProperties: false
              required: [methods]
              properties:
                methods:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [method, length, valueType]
                    properties:
                      method: { type: string, enum: [SMS_OTP] }
                      length: { type: integer, enum: [4] }
                      valueType: { type: string, enum: [NUMERIC] }
                  x-jsonld-id: "openagrinet:challengeMethods"
              x-jsonld-id: "openagrinet:challenge"

    PMKISANApplicationInit:
      x-oan-fields:
        mustSend:  [informationMode, scheme.code]
        oneOf:     [enrolmentId, applicant.mobile]
        maySend:   [scheme.name]
        comesBack: [informationMode, scheme.code, scheme.name,
                    challenge.issued.method, challenge.issued.length,
                    challenge.issued.valueType, challenge.issued.expiresAt]
      allOf:
        - $ref: "#/components/schemas/IsPMKISAN"
        - type: object
          additionalProperties: false
          required: ["@context", "@type", informationMode, scheme]
          properties:
            "@context": { $ref: "#/components/schemas/Context" }
            "@type": { $ref: "#/components/schemas/Type" }
            informationMode:
              type: string
              enum: [OnDemand]
              x-jsonld-id: "openagrinet:informationMode"
            scheme:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, enum: [PM-KISAN] }
                name: { type: string, minLength: 1 }
              x-jsonld-id: "openagrinet:scheme"
            enrolmentId: { $ref: "#/components/schemas/PMKISANEnrolmentId" }
            applicant: { $ref: "#/components/schemas/Applicant" }
            challenge:
              type: object
              additionalProperties: false
              required: [issued]
              properties:
                issued:
                  type: object
                  additionalProperties: false
                  required: [method, length, valueType, expiresAt]
                  properties:
                    method: { type: string, enum: [SMS_OTP] }
                    length: { type: integer, enum: [4] }
                    valueType: { type: string, enum: [NUMERIC] }
                    expiresAt: { $ref: "#/components/schemas/Instant" }
                  x-jsonld-id: "openagrinet:challengeIssued"
              x-jsonld-id: "openagrinet:challenge"
        - oneOf:
            - allOf:
                - oneOf:
                    - required: [enrolmentId]
                    - required: [applicant]
                - not: { required: [challenge] }
            - allOf:
                - required: [challenge]
                - not: { required: [applicant] }

    PMKISANApplicationStatus:
      x-oan-fields:
        mustSend:  [informationMode, scheme.code,
                    challenge.response.method, challenge.response.value]
        oneOf:     [enrolmentId, applicant.mobile]
        maySend:   [scheme.name]
        comesBack: [informationMode, scheme.code, scheme.name, enrolmentId,
                    application.registeredOn, application.latestInstalmentPaid,
                    application.ekyc.code, application.blockers]
      allOf:
        - $ref: "#/components/schemas/IsPMKISAN"
        - type: object
          additionalProperties: false
          required: ["@context", "@type", informationMode, scheme]
          properties:
            "@context": { $ref: "#/components/schemas/Context" }
            "@type": { $ref: "#/components/schemas/Type" }
            informationMode:
              type: string
              enum: [OnDemand]
              x-jsonld-id: "openagrinet:informationMode"
            scheme:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, enum: [PM-KISAN] }
                name: { type: string, minLength: 1 }
              x-jsonld-id: "openagrinet:scheme"
            enrolmentId: { $ref: "#/components/schemas/PMKISANEnrolmentId" }
            applicant: { $ref: "#/components/schemas/Applicant" }
            challenge: { $ref: "#/components/schemas/PMKISANChallengeResponse" }
            application:
              type: object
              additionalProperties: false
              required: [latestInstalmentPaid]
              properties:
                registeredOn:
                  allOf: [{ $ref: "#/components/schemas/Instant" }]
                  x-jsonld-id: "openagrinet:registeredOn"
                latestInstalmentPaid:
                  type: integer
                  minimum: 0
                  x-jsonld-id: "openagrinet:latestInstalmentPaid"
                ekyc:
                  type: object
                  additionalProperties: false
                  required: [code]
                  properties:
                    code: { type: string, enum: [Done, Pending] }
                  x-jsonld-id: "openagrinet:ekycStatus"
                blockers:
                  type: array
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, name]
                    properties:
                      code:
                        type: string
                        enum: [IncomeTaxPayee, LandSeedingPending, Other]
                      name:
                        type: string
                        minLength: 1
                        maxLength: 500
                        x-oan-pii:
                          class: freetext
                          handling: [no-log, no-trace]
                  x-jsonld-id: "openagrinet:applicationBlockers"
              x-jsonld-id: "openagrinet:application"
        - oneOf:
            - allOf:
                - required: [challenge]
                - not: { required: [application] }
                - oneOf:
                    - required: [enrolmentId]
                    - required: [applicant]
            - allOf:
                - required: [application, enrolmentId]
                - not: { required: [applicant] }

    Applicant:
      type: object
      additionalProperties: false
      required: [mobile]
      properties:
        mobile:
          type: string
          pattern: "^[6-9][0-9]{9}$"
          x-oan-pii:
            class: contact
            handling: [no-log, no-trace, no-echo]
          x-jsonld-id: "openagrinet:applicantMobile"
      x-jsonld-id: "openagrinet:applicant"

    PMKISANEnrolmentId:
      type: string
      pattern: "^[A-Za-z0-9]+$"
      minLength: 6
      maxLength: 20
      not: { pattern: "^[0-9]{12}$" }
      x-oan-pii:
        class: identifier
        handling: [no-log, no-trace]
      x-jsonld-id: "openagrinet:enrolmentId"

    PMKISANChallengeResponse:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response:
          type: object
          additionalProperties: false
          required: [method, value]
          properties:
            method: { type: string, enum: [SMS_OTP] }
            value:
              type: string
              pattern: "^[0-9]{4}$"
              x-oan-pii:
                class: credential
                handling: [no-log, no-trace, no-echo, no-forward]
              x-jsonld-id: "openagrinet:challengeValue"
          x-jsonld-id: "openagrinet:challengeResponse"
      x-jsonld-id: "openagrinet:challenge"

    Instant:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"

    Context:
      oneOf:
        - type: string
          const: https://openagrinet.github.io/network-specs/api-schemas/SchemeApplication/v0.1/context.jsonld
        - type: array
          minItems: 2
          uniqueItems: true
          items: { type: string, minLength: 1 }
          contains:
            const: https://openagrinet.github.io/network-specs/api-schemas/SchemeApplication/v0.1/context.jsonld

    Type:
      oneOf:
        - type: string
          const: openagrinet:SchemeApplication
        - type: array
          minItems: 2
          uniqueItems: true
          contains:
            const: openagrinet:SchemeApplication
          items:
            oneOf:
              - const: openagrinet:SchemeApplication
              - type: string
                minLength: 1
                not: { pattern: "^openagrinet:" }
