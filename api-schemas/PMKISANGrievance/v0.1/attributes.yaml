openapi: 3.1.1
info:
  title: OpenAgriNet - PM-KISAN Grievance API Attributes
  version: 0.1.0
  description: >
    Attributes for grievances raised against Pradhan Mantri Kisan Samman Nidhi.
    This is an API schema, not a domain schema: it describes what the PM-KISAN
    grievance API accepts and returns, so an experience layer can call it
    without reading adapter mapping files. Attaches through
    commitmentAttributes: a grievance is a promise with a lifecycle of its
    own, not a catalogable resource.

    Self-contained on purpose. Everything this pack needs is defined in this
    file, apart from IdentifiedDescriptor, which the domain schemas already
    publish. A grievance is one Provider's API surface, not a thing the network
    describes, so nothing here is added to a domain pack for two API packs to
    share. The cost is that PMFBY restates the same case vocabulary; that is
    accepted, and the two are kept in step by review rather than by a $ref.

    Direction is carried by informationMode, never by the Beckn action.
    OnDemand is the ask, Direct is an answer carrying a real case. The same
    attributes serve status without change. On support the payload attaches
    through channels instead, and three fields move into the Support object
    itself. The channel also carries provider, which exists for that action
    alone: a SupportAction composes no Contract, so the adapter has nowhere
    else to read the provider from. The grievance is lodged with support, not
    confirm, so no confirm entry appears below; there is no init leg either,
    because PM-KISAN sends no OTP. x-beckn-container-by-action says which
    container each action uses, and the per-field x-beckn-path says where a
    field that moves ends up.

    Nothing here identifies a single case the way PMFBY's ticketNo does: neither
    the lodge reply nor a status record carries a case identifier. A grievance is
    retrieved by the identity it was filed under, and every grievance on that
    identity comes back together.

components:
  schemas:
    PMKISANGrievance:
      type: object
      x-beckn-container: commitmentAttributes
      x-beckn-container-by-action:
        status: commitmentAttributes
        support: channels
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/api-schemas/PMKISANGrievance/v0.1/context.jsonld"
        "@type": openagrinet:PMKISANGrievance
      allOf:
        - type: object
          required: ["@type", "informationMode", "scheme"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:PMKISANGrievance
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:PMKISANGrievance
                  items:
                    oneOf:
                      - const: openagrinet:PMKISANGrievance
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.

            informationMode:
              type: string
              enum: [OnDemand, Direct]
              description: >
                Direction of this payload. OnDemand is the ask; Direct is an
                answer carrying a real case.

                Direction is carried by this field and never by the Beckn
                action, so the same attributes serve every leg without change.
              x-jsonld-id: "openagrinet:informationMode"

            provider:
              allOf:
                - $ref: "#/components/schemas/ProviderReference"
              description: >
                The portal this grievance belongs to: who it is filed with on
                the way in, and who the case came from on the way out. One
                field for both, because on a grievance they are always the same
                party -- the adapter reads a case back from the portal it filed
                with, and no third party stands between them.

                Carried in the attributes on the support leg only, and only
                because a SupportAction composes no Contract: every other
                action has one, and there the same fact is read from
                commitments[].offer.provider.

                Same shape in both places, deliberately. A reader writes
                .provider.id on support and .provider.id on the contract, and
                the adapter's own binding path says channels[].provider.id
                against a Beckn v2 default of commitments[].offer.provider.id
                -- the same grammar, the same tail, a different container.

                scheme.code names a scheme rather than a participant, so it
                cannot stand in.

                Not required, and deliberately not part of the Direct guard. On
                a contract leg the attributes genuinely do not carry it --
                Beckn's offer does -- so requiring it here would force a second
                copy into commitmentAttributes.
              x-jsonld-id: "openagrinet:provider"

            scheme:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  required: [code]
                  properties:
                    code:
                      enum: [PM-KISAN]
              description: >
                Scheme the grievance is raised against. Present on every payload in
                both directions, which is what makes it the one unconditional field.

                code is pinned because this pack describes PM-KISAN and nothing
                else, so there is exactly one legal value. Left open, a payload
                could name another scheme and still validate here -- the one field
                present on every payload would be the one field checking nothing.
                allOf narrowing is evaluated, so this is enforced rather than
                advisory. name is not pinned: the scheme has an official title but
                it is written differently in different places, and the network has
                no reason to arbitrate spelling. The title in the examples is
                "Pradhan Mantri Kisan Samman Nidhi".
              x-jsonld-id: "openagrinet:scheme"

            registrationNo:
              type: string
              pattern: "^[A-Za-z0-9]+$"
              maxLength: 64
              x-oan-pii:
                class: identifier
                handling: [no-log, no-trace]
                note: >
                  The farmer's PM-KISAN registration number. Returned on a case
                  read, so no-echo would be wrong; it is the caller's own
                  registration number coming back.
              description: >
                The PM-KISAN registration number the grievance is filed under. It
                is both the identity the portal authenticates on and the enrolment
                the complaint is against, because PM-KISAN has no separate
                reference for either -- the upstream takes one field, IdentityNo,
                and nothing else names a case. That is why it carries the same
                x-beckn-path as PMFBY's applicationNo: on support it is the
                orderId, the thing support is required against.

                Named for the enrolment rather than for the applicant. An earlier
                draft called it applicantId, which claimed the field names a person
                and sat one letter from PMFBY's applicantPhone -- inviting a caller
                to read the two as the same role and put a phone number in orderId.
                It names neither a person nor a contact: it names the enrolment a
                complaint is filed against, which is what applicationNo names on
                PMFBY. The two ends match so the pair reads as one slot.

                Aadhaar is deliberately not accepted. The portal takes a token
                derived from one through /GrievanceAadhaarToken and carries it in
                the same IdentityNo field, which would make this value sometimes a
                stable reference and sometimes an ephemeral secret. Registration
                numbers only keeps it one thing, and keeps the upstream Type field
                a constant.

                Not writeOnly, and no-echo is deliberately absent: the value is
                returned in orderId, which is the provider's slot to fill. Sending
                back the caller's own registration number over the same signed
                exchange it arrived on discloses nothing. no-log and no-trace are
                the markings that matter here and they are unconditional.

                The rule is only non-empty and alphanumeric. Eleven alphanumeric
                characters is the documented shape, but nothing upstream enforces
                it, and a length rule taken from a tool docstring would reject a
                valid grievance before the farmer's complaint reached the portal.
                ASCII-only is on purpose: the upstream accepts Devanagari and other
                native-script digits and forwards them unconverted.
              x-beckn-path:
                support: message.support.orderId
              x-jsonld-id: "openagrinet:registrationNo"

            grievanceCategory:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  properties:
                    code:
                      type: string
                      enum: [G001, G002, G003, G004, G005, G006, G007, G008, G009, G010]
                      x-enum-details:
                        - value: G001
                          meaning: Account number not correct.
                        - value: G002
                          meaning: Online application pending for approval.
                        - value: G003
                          meaning: Installment not received.
                        - value: G004
                          meaning: Transaction failed.
                        - value: G005
                          meaning: Problem in Aadhaar correction.
                        - value: G006
                          meaning: Gender not correct.
                        - value: G007
                          meaning: Payment related.
                        - value: G008
                          meaning: Problem in OTP-based eKYC.
                        - value: G009
                          meaning: Problem in biometric-based eKYC.
                        - value: G010
                          meaning: Problem in facial-based eKYC.
              description: >
                Category of the grievance. Unlike PMFBY, the portal publishes a
                closed list of ten codes, so the pack enumerates them and an
                unknown code is refused at the network edge rather than upstream.
                The code goes to the portal verbatim.
              # No status entry, unlike PMFBY. Reg_No_Status does not return
              # GrievanceType, so the category never appears on a status leg in
              # either direction and there is no placement to state.
              x-beckn-path:
                support: message.support.descriptor.code and .name
              x-jsonld-id: "openagrinet:pmkisanGrievanceCategory"

            grievanceDescription:
              type: string
              minLength: 10
              maxLength: 2000
              x-oan-pii:
                class: freetext
                handling: [no-log, no-trace]
                note: >
                  Returned verbatim on a case read, so no-echo would be wrong. It is
                  the farmer's own words and may hold anything the schema cannot see.
              description: >
                The farmer's account of the problem, in their own words. A minimum
                length because a grievance that says nothing cannot be acted on, and
                a maximum because this is unvalidated free text arriving from a
                caller and going on to the portal. The portal publishes no upper
                limit, so the bound is the network's own and matches caseRemark:
                2000 characters, long enough for any real account of a problem.

                Does not travel inside the attributes object. x-beckn-path moves it
                to the Beckn descriptor, which is where a contract says what it is
                about -- so a client that does not know this pack still sees what
                was complained about.

                PM-KISAN note: the length above is measured on the raw string,
                while the upstream client measures it after trimming -- so ten
                characters of whitespace pass here and fail there. The adapter
                trims before sending and re-checks.
              x-beckn-path:
                support: message.support.descriptor.longDesc
                status: message.contract.descriptor.longDesc
              x-jsonld-id: "openagrinet:grievanceDescription"

            caseStatus:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  required: [code]
                  properties:
                    code:
                      $ref: "#/components/schemas/CaseStatusCode"
              description: >
                Where the grievance stands. code is the network's
                CaseStatusCode, which is what a client branches on; name is the
                portal's own status phrase, kept verbatim, which is what the
                farmer is shown.

                code is required and name is not, and the absence of name is
                informative: it is how a client tells a state the adapter
                inferred from one the portal stated.

                A phrase the adapter does not recognise maps to UnderReview,
                keeping the phrase in name -- never to a terminal state, which
                must come from the portal. The adapter may infer a state; it
                must never infer that a case is finished.

                The enum is not narrowed. PM-KISAN publishes no full status
                vocabulary, so narrowing would be a guess that rejects a
                legitimate state.

                PM-KISAN note: name carries the portal's GrievanceStatus phrase.
                Where GrievanceStatus is missing the adapter infers Replied or
                UnderReview according to whether a remark is present, and a lodge
                reply carries no status of any kind, so Registered is asserted. In
                all three cases code stands alone.
              x-jsonld-id: "openagrinet:caseStatus"

            filedOn:
              $ref: "#/components/schemas/CalendarDate"
              description: >
                Date the grievance was filed with the portal. An IST calendar
                date: an adapter must take today's date in IST and not from a
                UTC clock, which would record the previous day for anything
                filed before 05:30 IST.

                PM-KISAN note: read from the portal on a case read; generated by
                the adapter on a lodge, because the lodge reply carries no date.
                It is also half the case selector -- see the guard below.
              x-jsonld-id: "openagrinet:filedOn"

            caseRemark:
              type: string
              minLength: 1
              maxLength: 2000
              x-oan-pii:
                class: freetext
                handling: [no-log, no-trace]
                note: Written about this farmer's case.
              description: >
                The most recent remark recorded against the case. Named for the
                case rather than for an author: a remark may come from a
                reviewing officer, from a body handling the claim, or from the
                system closing a record, and the portal publishes no reliable
                author. It is an annotation on a record, not necessarily a reply
                addressed to the farmer.

                Absent rather than empty while nothing has been recorded, so an
                absent field reads as "nothing recorded yet". Bounded at 2000
                characters because it is unvalidated upstream free text being
                placed in a response.

                PM-KISAN note: read from OfficerReply. Its companion date is
                OfficeReplyDate -- an office rather than an officer, which is one
                reason the network does not adopt the portal's field name.
              x-jsonld-id: "openagrinet:caseRemark"

            remarkedOn:
              $ref: "#/components/schemas/CalendarDate"
              description: >
                Date the remark was recorded. Absent until there is a remark. An
                IST calendar date; see CalendarDate.

                PM-KISAN note: read from OfficeReplyDate.
              x-jsonld-id: "openagrinet:remarkedOn"

        # Direction, not action. A response carrying a real case always says where
        # the case stands, when it was filed and where it came from -- true of a
        # lodge reply and a case read alike. There is no ticket number to require:
        # the portal issues none.
        #
        # There is deliberately no matching OnDemand branch. Lodging sends the
        # identity, the category and the complaint; reading sends the identity
        # alone. Requiring the lodge fields here would reject a legitimate read.
        # What each action must carry is enforced by that action's mapping guard.
        #
        # No case reference is required, because none exists. PM-KISAN issues no
        # ticket, so a case is identified only by the registration number it was
        # filed under and the date it was filed on -- which means two grievances
        # filed on one day under one registration number cannot be told apart in
        # a payload. The adapter selects on filedOn and PMFBY has ticketNo for
        # exactly this job. The network cannot mint an identifier the portal does
        # not issue, so this is recorded as a limitation rather than papered over.
        - if:
            properties:
              informationMode:
                const: Direct
            required: [informationMode]
          # No provenance member here. provider says which portal the case came
          # from, but on a contract leg it lives in commitments[].offer.provider
          # rather than in these attributes, so a guard on the attributes object
          # cannot reach it. What this guard still asserts is what a Direct
          # response must say about the case itself.
          then:
            required: [caseStatus, filedOn]

    CaseStatusCode:
      type: string
      enum: [Registered, UnderReview, AwaitingApplicant, Replied, Resolved, Rejected, Closed]
      description: >
        Where a case stands, in the network's own vocabulary, rather than in the
        portal's wording.

        The split is deliberate. code is the network's word and is what a client
        branches on; the accompanying descriptor name is the portal's own phrase,
        kept verbatim, and is what a farmer is shown. A portal phrase the adapter
        does not recognise maps to UnderReview -- non-terminal, and honest -- with
        the phrase preserved in name. The adapter may infer a state; it must never
        infer that a case is finished, so anything unmapped stays non-terminal.

        The same seven values appear in the PMFBY pack. Each API pack stands on
        its own, so the list is restated there rather than shared through a
        domain schema; a change to one is a change to both.
      x-enum-details:
        - value: Registered
          meaning: Lodged and acknowledged by the portal, not yet picked up.
          terminal: false
        - value: UnderReview
          meaning: Being worked by the portal. Also the fallback for a portal phrase the adapter does not recognise.
          terminal: false
        - value: AwaitingApplicant
          meaning: Blocked on the applicant -- a document or a clarification is needed before work can continue.
          terminal: false
        - value: Replied
          meaning: A response has been recorded against the case, which remains open.
          terminal: false
        - value: Resolved
          meaning: Closed with action taken.
          terminal: true
        - value: Rejected
          meaning: Closed without action; the case was refused.
          terminal: true
        - value: Closed
          meaning: Closed with no further action -- lapsed, withdrawn, or closed automatically.
          terminal: true

    CalendarDate:
      type: string
      format: date
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: >
        A calendar date in IST, as YYYY-MM-DD.

        The pattern is what enforces the shape. format is annotation-only under
        the validator in use -- no string format is registered, so format: date
        alone would accept any string at all. The zone is named because a bare
        date has no day boundary of its own: an adapter deriving one from a UTC
        clock records the previous day for anything happening before 05:30 IST.

    ProviderReference:
      allOf:
        - $ref: "https://schema.beckn.io/Provider/v2.1/attributes.yaml#/components/schemas/Provider"
        # A reference to a participant, not a catalog entry about one. Beckn's
        # Provider carries both, so the two it does not need here are refused
        # rather than left to drift into the payload.
        - not:
            required: [availableAt]        # a grievance portal has no premises
        - not:
            required: [providerAttributes] # an attributes object inside a
                                           # channel that is already one
        - type: object
          # Beckn already requires both. Restated because a reader -- and the
          # page generator -- resolves this file without fetching the remote
          # schema, and would otherwise be told id is optional. It is the
          # routing key; nothing about it is optional.
          required: [id, descriptor]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9.-]*$"
              maxLength: 100
              description: >
                Network participant id, lower-case, matching the registry
                exactly. This is the only field the adapter routes on.
            descriptor:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >
                    Human-readable name of the provider. Beckn requires a
                    Provider to carry a descriptor, and a name is the only part
                    of one worth carrying here -- a code would merely repeat id.

                    Advisory, and never authoritative: the registry owns this
                    word. The adapter reads id and ignores name, so a caller
                    that sends a stale name is routed correctly anyway. It is
                    required because a participant id alone makes a payload
                    unreadable to anyone without the registry open.
      description: >
        A Beckn Provider narrowed to a reference: who this is, and nothing more.
        id is required and descriptor is required by Beckn itself; this
        narrowing adds the registry's id format and requires the descriptor to
        carry a name.
