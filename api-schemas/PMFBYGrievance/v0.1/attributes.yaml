openapi: 3.1.1
info:
  title: OpenAgriNet - PMFBY Grievance API Attributes
  version: 0.1.0
  description: >
    Attributes for grievances raised against the Pradhan Mantri Fasal Bima
    Yojana crop insurance scheme. This is an API schema, not a domain schema:
    it describes what the PMFBY grievance API accepts and returns, so an
    experience layer can call it without reading adapter mapping files.
    Attaches through commitmentAttributes: a grievance is a promise with a
    lifecycle of its own, not a catalogable resource.

    Extends GrievanceBase, in api-schemas/Grievance/v0.1. The base owns the
    field set every grievance pack shares and the vocabulary those fields are
    written in; this file pins @type and scheme to PMFBY, adds what PMFBY alone
    has -- the phone, the application, the season, the OTP challenge and the
    ticket number -- and records against each inherited field how this portal
    fills it. Nothing grievance-related is added to a domain schema: a
    grievance is a Provider's API surface, not a thing the network describes.

    Direction is carried by informationMode, never by the Beckn action.
    OnDemand is the ask, Direct is an answer carrying a real case. The same
    attributes serve init and status without change. On support the payload
    attaches through channels instead, and three fields move into the Support
    object itself. The channel also carries provider, which exists for that
    action alone: a SupportAction composes no Contract, so the adapter has
    nowhere else to read the provider from. The grievance is lodged with
    support, not confirm, so no confirm entry appears below.
    x-beckn-container-by-action says which container each action uses, and the
    per-field x-beckn-path says where a field that moves ends up.

components:
  schemas:
    PMFBYGrievance:
      type: object
      x-beckn-container: commitmentAttributes
      x-beckn-container-by-action:
        init: commitmentAttributes
        status: commitmentAttributes
        support: channels
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/api-schemas/PMFBYGrievance/v0.1/context.jsonld"
        "@type": openagrinet:PMFBYGrievance
      allOf:
        - $ref: "../../Grievance/v0.1/attributes.yaml#/components/schemas/GrievanceBase"
        # PMFBY publishes no date against a remark, so the inherited field is
        # refused rather than left permanently absent. One member to delete if
        # the portal ever starts publishing one.
        - not:
            required: [remarkedOn]
        - type: object
          required: ["@type"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:PMFBYGrievance
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:PMFBYGrievance
                  items:
                    oneOf:
                      - const: openagrinet:PMFBYGrievance
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.

            applicantPhone:
              type: string
              pattern: "^[6-9][0-9]{9}$"
              x-oan-pii:
                class: contact
                handling: [no-log, no-trace, no-echo, mask-on-echo]
              description: >
                Mobile number of the farmer raising the grievance, and the number the
                portal sends the OTP to. Ten digits, Indian mobile series. Never
                returned in a response; on_init carries the masked challengeIssued.sentTo
                instead.
              x-jsonld-id: "openagrinet:applicantPhone"
            applicationNo:
              type: string
              minLength: 1
              maxLength: 64
              x-oan-pii:
                class: identifier
                handling: [no-log, no-trace]
                note: >
                  Identifies a named farmer's policy. Returned on a case read, so
                  no-echo would be wrong; it is the caller's own application number
                  coming back.
              description: >
                PMFBY crop insurance application number the grievance concerns.
                On support it is the orderId, the thing support is required
                against, and it holds that meaning in both directions: the ask
                sends it and on_support echoes it unchanged. The ticket the portal
                issues does not go there -- it comes back in ticketNo on the
                channel, because a ticket is not what the complaint is against.
              x-beckn-path:
                support: message.support.orderId
              x-jsonld-id: "openagrinet:applicationNo"
            cropYear:
              type: string
              pattern: "^[0-9]{4}$"
              description: >
                Crop year of the application, as a four-digit year. The portal
                returns request_year as a number, so the adapter stringifies it
                on the way back. It is the year of the application, not of the
                grievance: a 2025 crop year can carry a 2026 complaint date.
              x-jsonld-id: "openagrinet:cropYear"
            season:
              type: string
              enum: [Kharif, Rabi, Zaid]
              description: >
                Crop season of the application. PMFBY accepts three seasons and
                nothing else. The network carries the name; the adapter maps it to
                the numeric request_season the portal wants -- Kharif 1, Rabi 2,
                Zaid 3. Summer is the same season as Zaid and is sent as Zaid.
              x-jsonld-id: "openagrinet:season"
            grievanceCategory:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  properties:
                    code:
                      type: string
                      pattern: "^[0-9]+\\.[0-9]+$"
                      description: >
                        Category and sub-category joined by a dot, exactly as the
                        portal numbers them.
              description: >
                Category of the grievance. The code is the portal's category and
                sub-category joined by a dot, and the adapter splits it on that dot
                into two upstream fields, so the shape is load-bearing rather than
                cosmetic. The portal returns a name for each half on a case read
                and the adapter joins them with a slash, so name follows code.
                The portal publishes no list of valid pairs; see the pack README.
              x-beckn-path:
                support: message.support.descriptor.code and .name
                status: message.contract.descriptor.code and .name
              x-jsonld-id: "openagrinet:pmfbyGrievanceCategory"


            challenge:
              type: object
              writeOnly: true
              required: [method, value]
              additionalProperties: false
              x-oan-pii:
                class: credential
                handling: [no-log, no-trace, no-echo, no-forward]
                note: Proven once by the verify call and never passed to the lodge call.
              properties:
                method:
                  type: string
                  enum: [SMS_OTP]
                  description: >
                    Authentication mechanism. PMFBY offers one: a six-digit OTP
                    texted to the registered mobile number. Supporting a second
                    mechanism later is widening this enum and pinning the format
                    its value takes; nothing about the carrier changes.
                  x-jsonld-id: "openagrinet:challengeMethod"
                value:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
                  x-oan-pii:
                    class: credential
                    handling: [no-log, no-trace, no-echo, no-forward]
                    note: Proven once against the portal and never carried further.
                  description: >
                    The OTP itself, six digits, since the portal rejects any
                    other length. The pattern is what enforces that -- allOf
                    narrowing is evaluated, so the rule is held by the pack and
                    not left to a mapping guard.

                    writeOnly is the contract: it travels inbound only and must
                    never be returned in a response, written to a log, or
                    attached to a trace.
                  x-jsonld-id: "openagrinet:challengeValue"
              description: >
                Proof of the phone number, presented when filing. No correlator
                field exists, and additionalProperties refuses one: PMFBY binds
                the challenge to the phone number alone and issues none, so a
                caller sending one is confused about the mechanism rather than
                being quietly ignored.

                writeOnly is the contract: the whole object travels inbound
                only. It must never be returned in any response, written to a
                log, or attached to a trace, and the value is never forwarded
                to the lodge call.
              x-jsonld-id: "openagrinet:challenge"

            ticketNo:
              type: string
              pattern: '^[0-9]+$'
              maxLength: 32
              description: >
                Portal grievance ticket number. Returned when a grievance is filed
                and presented again to read its replies, so it travels in both
                directions. It stays in the attributes on every leg -- no
                x-beckn-path moves it -- so on_support returns it here and leaves
                orderId holding the application number it arrived with. Digits only, and long enough not to be mistaken for a
                phone number: the live system routes a ten-digit answer to the phone
                and anything longer to the ticket, and observed tickets run twelve
                to fifteen digits. The exact length is not pinned because that range
                is described as typical, not as a rule; the maxLength is a sanity
                bound well clear of it, not a statement about the format.
              x-jsonld-id: "openagrinet:ticketNo"

            challengeIssued:
              type: object
              readOnly: true
              required: [method, sentTo, expiresAt]
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [SMS_OTP]
                  description: Mechanism the portal used. PMFBY offers SMS_OTP only.
                  x-jsonld-id: "openagrinet:challengeMethod"
                sentTo:
                  type: string
                  pattern: "^[0-9]{2}X{6}[0-9]{2}$"
                  x-oan-pii:
                    class: contact
                    handling: [no-log, no-trace]
                    note: Always the masked form of the destination, never the full number.
                  description: >
                    Masked destination, so the farmer can confirm which number
                    was used without the number being disclosed. PMFBY sends to
                    a phone, so the mask is a phone mask -- first two and last
                    two digits only, the six between them always X.
                  x-jsonld-id: "openagrinet:challengeSentTo"
                expiresAt:
                  type: string
                  format: date-time
                  description: >
                    When the challenge stops being accepted. Required because
                    the adapter always derives one, so a caller may rely on it.
                  x-jsonld-id: "openagrinet:challengeExpiresAt"
              description: >
                Acknowledgement that the portal has sent a challenge. Carries no
                secret: the OTP itself is never returned. No correlator field
                exists and additionalProperties refuses one, since PMFBY issues
                none. readOnly is the contract: this is returned and never sent.
              x-jsonld-id: "openagrinet:challengeIssued"


            # Inherited from GrievanceBase. Restated with a description only,
            # to record how this portal fills each one. The shape, the bounds
            # and the IRIs stay with the base.

            scheme:
              allOf:
                - type: object
                  properties:
                    code:
                      enum: [PMFBY]
                      description: The scheme this pack describes.
              description: >
                Pinned to PMFBY: this pack describes one scheme and nothing
                else, so there is exactly one legal value for code. The title
                in the examples is "Pradhan Mantri Fasal Bima Yojana".

            caseStatus:
              description: >
                PMFBY note: name carries the portal's TicketStatus phrase. The
                portal also returns a numeric TicketStatusID, an opaque
                internal key that is not mapped -- the derived code replaces
                it. A lodge reply carries no status at all, so there is nothing
                to quote and code stands alone.

            filedOn:
              description: >
                PMFBY note: read from ComplaintDate, which the portal already
                sends as ISO. On a lodge the adapter generates it.

            caseRemark:
              description: >
                PMFBY note: read from latestRemark. The portal sends an empty
                string while no remark exists; the adapter omits the field
                rather than passing the empty string through. PMFBY publishes
                no companion date, which is why this pack refuses remarkedOn.

        # Direction, not action. A response carrying a real case is Direct and
        # always names the case, its status, when it was filed and where it came
        # from -- true of on_support and on_status alike.
        #
        # There is deliberately no matching OnDemand branch. The ask side has no
        # field common to every payload: filing sends the phone, the application,
        # the season and the OTP; reading a case sends the phone and the ticket;
        # an OTP acknowledgement sends neither, because it must not echo the phone.
        # Requiring any of them here would reject a legitimate payload of some
        # other action, which is exactly the coupling this pack avoids. What each
        # action must carry is enforced by that action's mapping guard.
        - if:
            properties:
              informationMode:
                const: Direct
            required: [informationMode]
          # No provenance member here. provider says which portal the case came
          # from, but on a contract leg it lives in commitments[].offer.provider
          # rather than in these attributes, so a guard on the attributes object
          # cannot reach it. What this guard still asserts is what a Direct
          # response must say about the case itself.
          then:
            required: [ticketNo, caseStatus, filedOn]
