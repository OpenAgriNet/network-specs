openapi: 3.1.1
info:
  title: OpenAgriNet - PMFBY Grievance API Attributes
  version: 0.1.0
  description: >
    Attributes for grievances raised against the Pradhan Mantri Fasal Bima
    Yojana crop insurance scheme. This is an API schema, not a domain schema:
    it describes what the PMFBY grievance API accepts and returns, so an
    experience layer can call it without reading adapter mapping files.
    Attaches through commitmentAttributes: a grievance is a promise with a
    lifecycle of its own, not a catalogable resource.

    Extends GrievanceBase, in api-schemas/Grievance/v0.1. The base owns the
    four bands a grievance payload has -- the context at the top, the farmer's
    complaint under grievance, the portal's record under case -- and the
    vocabulary they are written in. This file pins @type and scheme to PMFBY,
    adds what PMFBY alone has (the phone, the crop year, the season and the OTP
    challenge), pins the value spaces inside the two containers, and states
    what a PMFBY payload must carry to be an answer and to be an ask. Nothing
    grievance-related is added to a domain schema: a grievance is a Provider's
    API surface, not a thing the network describes.

    Direction is carried by informationMode, never by the Beckn action.
    OnDemand is the ask, Direct is an answer carrying a real case. The same
    attributes serve init and status without change. On support the payload
    attaches through channels instead, and enrolmentId moves into the Support
    object itself. The channel also carries provider, which exists for that
    action alone: a SupportAction composes no Contract, so the adapter has
    nowhere else to read the provider from. The grievance is lodged with
    support, not confirm, so no confirm entry appears below.
    x-beckn-container-by-action says which container each action uses, and the
    per-field x-beckn-path says where a field that moves ends up.

    Nothing is hoisted into a Beckn descriptor. An earlier draft put the
    category and the complaint text there, which placed them outside the object
    the validator binds to -- so the pack's own rules did not reach them and
    the mapping files re-implemented each one by hand. Both legs now send no
    descriptor at all, which Beckn permits: Support requires only @context and
    @type, and Contract only commitments.

components:
  schemas:
    PMFBYGrievance:
      type: object
      x-beckn-container: commitmentAttributes
      x-beckn-container-by-action:
        init: commitmentAttributes
        status: commitmentAttributes
        support: channels
      # What each action must carry. Paths are relative to the attribute
      # object; enrolmentId is named here under its attribute name, not the
      # message.support.orderId it moves to under x-beckn-path.
      x-oan-required-by-action:
        init: [applicantPhone]
        support:
          - enrolmentId
          - applicantPhone
          - cropYear
          - season
          - grievance.category.code
          - grievance.subCategory.code
          - grievance.description
          - challenge.method
          - challenge.value
        status: [applicantPhone, case.ticketNo]
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/api-schemas/PMFBYGrievance/v0.1/context.jsonld"
        "@type": openagrinet:PMFBYGrievance
      allOf:
        - $ref: "../../Grievance/v0.1/attributes.yaml#/components/schemas/GrievanceBase"
        - type: object
          required: ["@type"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:PMFBYGrievance
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:PMFBYGrievance
                  items:
                    oneOf:
                      - const: openagrinet:PMFBYGrievance
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.

            applicantPhone:
              type: string
              pattern: "^[6-9][0-9]{9}$"
              x-oan-pii:
                class: contact
                handling: [no-log, no-trace, no-echo, mask-on-echo]
              description: >
                Mobile number of the farmer raising the grievance, and the number the
                portal sends the OTP to. Ten digits, Indian mobile series. Never
                returned in a response; on_init carries the masked challengeIssued.sentTo
                instead.
              x-jsonld-id: "openagrinet:applicantPhone"

            cropYear:
              type: string
              pattern: "^[0-9]{4}$"
              description: >
                Crop year of the application, as a four-digit year. Sent
                upstream as requestYear when lodging. The portal does not
                return it on a case read, so it is present on the way in and
                absent on the way out. It is the year of the application, not
                of the grievance: a 2025 crop year can carry a 2026 complaint
                date.

                Sits at the top rather than under grievance because it
                qualifies the enrolment, not the complaint.
              x-jsonld-id: "openagrinet:cropYear"

            season:
              type: string
              enum: [Kharif, Rabi, Zaid]
              description: >
                Crop season of the application. PMFBY accepts three seasons and
                nothing else. The network carries the name; the adapter maps it to
                the numeric requestSeason the portal wants -- Kharif 1, Rabi 2,
                Zaid 3. Summer is the same season as Zaid and is sent as Zaid.

                Sits at the top for the same reason as cropYear: it says which
                enrolment, not what went wrong, and like cropYear it is never
                returned.
              x-jsonld-id: "openagrinet:season"

            complaintDate:
              type: string
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
              description: >
                The date the complaint was filed, as YYYY-MM-DD in IST. Goes
                upstream as complaintDate on the lodge call.

                Optional. Omit it and the adapter stamps the current IST date,
                which is what a live submission wants. Send it when the filing
                date is not today -- a submission taken offline and replayed
                later carries the date the farmer actually filed.

                Sent only. The portal stores it and returns it on a case read
                as ComplaintDate, which the pack surfaces as case.filedOn --
                so the value comes back in the case band, not here.
              x-jsonld-id: "openagrinet:complaintDate"

            receiptSourceId:
              type: string
              pattern: "^[0-9]+$"
              maxLength: 16
              description: >
                The channel the ticket arrived through. PMFBY issues one id per
                integrating channel and uses it to attribute the ticket; Bharat
                Vistaar's is 134306. Goes upstream as receiptSourceID.

                Optional. Omit it and the adapter sends the id configured for
                itself, which is the normal case. Send it only if PMFBY issued
                an id to you directly. It names the channel, not the farmer,
                and is never returned on a read.
              x-jsonld-id: "openagrinet:receiptSourceId"

            challenge:
              type: object
              required: [method, value]
              additionalProperties: false
              x-oan-pii:
                class: credential
                handling: [no-log, no-trace, no-echo, no-forward]
                note: Proven once by the verify call and never passed to the lodge call.
              properties:
                method:
                  type: string
                  enum: [SMS_OTP]
                  description: >
                    Authentication mechanism. PMFBY offers one: a six-digit OTP
                    texted to the registered mobile number. Supporting a second
                    mechanism later is widening this enum and pinning the format
                    its value takes; nothing about the carrier changes.
                  x-jsonld-id: "openagrinet:challengeMethod"
                value:
                  type: string
                  pattern: "^[0-9]{6}$"
                  x-oan-pii:
                    class: credential
                    handling: [no-log, no-trace, no-echo, no-forward]
                    note: Proven once against the portal and never carried further.
                  description: >
                    The OTP itself, six digits, since the portal rejects any
                    other length. The pattern is what enforces that -- allOf
                    narrowing is evaluated, so the rule is held by the pack and
                    not left to a mapping guard.

                    Direction is carried by x-oan-pii, not by writeOnly. The
                    network validates every payload as a request, on the way out
                    as well as in, so writeOnly here would assert nothing while
                    readOnly on the answering field would reject the very
                    response it describes. no-echo is the rule the adapter
                    reads, and it is unconditional.
                  x-jsonld-id: "openagrinet:challengeValue"
              description: >
                Proof of the phone number, presented when filing. No correlator
                field exists, and additionalProperties refuses one: PMFBY binds
                the challenge to the phone number alone and issues none, so a
                caller sending one is confused about the mechanism rather than
                being quietly ignored.

                The whole object travels inbound only: never returned in any
                response, written to a log or attached to a trace, and the value
                is never forwarded to the lodge call. That is x-oan-pii no-echo
                and no-forward, which the adapter enforces. It is deliberately
                not writeOnly -- see the note on value.
              x-jsonld-id: "openagrinet:challenge"

            challengeIssued:
              type: object
              required: [method, sentTo, expiresAt]
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [SMS_OTP]
                  description: Mechanism the portal used. PMFBY offers SMS_OTP only.
                  x-jsonld-id: "openagrinet:challengeMethod"
                sentTo:
                  type: string
                  pattern: "^[0-9]{2}X{6}[0-9]{2}$"
                  x-oan-pii:
                    class: contact
                    handling: [no-log, no-trace]
                    note: Always the masked form of the destination, never the full number.
                  description: >
                    Masked destination, so the farmer can confirm which number
                    was used without the number being disclosed. PMFBY sends to
                    a phone, so the mask is a phone mask -- first two and last
                    two digits only, the six between them always X.
                  x-jsonld-id: "openagrinet:challengeSentTo"
                expiresAt:
                  type: string
                  format: date-time
                  description: >
                    When the challenge stops being accepted. Required because
                    the adapter always derives one, so a caller may rely on it.
                  x-jsonld-id: "openagrinet:challengeExpiresAt"
              description: >
                Acknowledgement that the portal has sent a challenge. Carries no
                secret: the OTP itself is never returned. No correlator field
                exists and additionalProperties refuses one, since PMFBY issues
                none. This is returned and never sent, but it is not marked
                readOnly: the network validates responses as requests too, so
                readOnly would reject this acknowledgement outright.
              x-jsonld-id: "openagrinet:challengeIssued"

            # Inherited from GrievanceBase, narrowed to what this portal does.
            # Where a field is restated with a description alone, the shape and
            # the bounds stay with the base and the note records how PMFBY
            # fills it.

            scheme:
              allOf:
                - type: object
                  properties:
                    code:
                      enum: [PMFBY]
                      description: The scheme this pack describes.
              description: >
                Pinned to PMFBY: this pack describes one scheme and nothing
                else, so there is exactly one legal value for code. The title
                in the examples is "Pradhan Mantri Fasal Bima Yojana".

            challengeMethods:
              allOf:
                - type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [SMS_OTP]
              description: >
                Pinned non-empty: PMFBY challenges every filing, so its catalog
                entry publishes ["SMS_OTP"] and a caller runs init before
                support. The item enum is the one challenge.method carries;
                supporting a second mechanism means widening both.

            enrolmentId:
              allOf:
                - type: string
                  minLength: 10
                  maxLength: 30
              description: >
                The enrolment the grievance is about; on support it is the
                orderId. For PMFBY that is the crop insurance application
                number, which goes upstream as applicationNo and comes back
                as ApplicationNo on a case read.

                The bounds are a sanity range around the observed form -- a
                state code, a crop year, a season marker and a serial -- not a
                published rule. PMFBY documents no format.

            grievance:
              properties:
                category:
                  allOf:
                    - type: object
                      properties:
                        code:
                          type: string
                          pattern: "^[0-9]+$"
                          description: >
                            The portal's ticket_category_id, digits only.
                  description: >
                    PMFBY note: ticketCategoryID on the way up,
                    TicketCategoryName on the way back -- a name with no id
                    beside it. The portal returns no TicketCategoryID, so on a
                    case read code cannot be filled and name stands alone.
                    That is why the base requires one of code or name here
                    rather than code outright.

                    The live integration pins this to 3 and the sub-category to
                    10, so the farmer never chooses. It is still carried as a
                    value rather than written into the mapping: when the portal
                    exposes its category list the experience layer starts
                    sending a real choice and nothing here changes. The portal
                    publishes no list of valid pairs; see the pack README.
                  x-jsonld-id: "openagrinet:pmfbyGrievanceCategory"

                subCategory:
                  allOf:
                    - type: object
                      properties:
                        code:
                          type: string
                          pattern: "^[0-9]+$"
                          description: >
                            The portal's ticket_sub_category_id, digits only.
                  description: >
                    PMFBY note: ticketSubCategoryID on the way up,
                    TicketSubCategoryName on the way back. Like the category,
                    the read carries a name and no id. A level of its own,
                    because the portal numbers the two levels separately on
                    the way up and names them separately on the way back.
                  x-jsonld-id: "openagrinet:pmfbyGrievanceSubCategory"

                description:
                  description: >
                    PMFBY note: sent as grievenceDescription -- the portal's
                    own spelling -- and returned verbatim as
                    GrievenceDescription on a case read.

            case:
              # PMFBY publishes neither a remark nor a date against one. The
              # ticket record the portal returns carries a status phrase and
              # nothing resembling a reply, so both inherited fields are
              # refused rather than left permanently absent. Two members to
              # delete if the portal ever starts publishing them.
              not:
                anyOf:
                  - required: [remark]
                  - required: [remarkedOn]
              properties:
                ticketNo:
                  allOf:
                    - type: string
                      pattern: '^[0-9]+$'
                      maxLength: 32
                  description: >
                    Portal grievance ticket number, returned as
                    GrievenceSupportTicketNo when a grievance is filed and
                    presented again as GrievenceSupportTicketNo to read it.

                    The case read does not return it. The portal answers that
                    call with GrievenceSupportTicketID, an internal key that is
                    not mapped, so on a read the adapter echoes the number the
                    caller asked with -- it is the key the record was selected
                    by, so echoing it asserts nothing the caller did not
                    already state.

                    Digits only, and long enough not to be mistaken for a phone
                    number: the live system routes a ten-digit answer to the
                    phone and anything longer to the ticket, and observed
                    tickets run twelve to fifteen digits. The exact length is
                    not pinned because that range is described as typical, not
                    as a rule; the maxLength is a sanity bound well clear of
                    it, not a statement about the format.

                status:
                  description: >
                    PMFBY note: name carries the portal's TicketStatus phrase,
                    verbatim. The portal publishes no status code beside it, so
                    the network's code is always derived from that phrase. A
                    lodge reply carries no status at all, so there is nothing
                    to quote and code stands alone.

                filedOn:
                  description: >
                    PMFBY note: read from ComplaintDate. The portal's format
                    for it is not published, so the adapter normalises to the
                    IST calendar date this field requires rather than passing
                    the value through. On a lodge the adapter generates it and
                    sends it up as complaintDate.

                cropName:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: >
                    The insured crop the ticket was raised against, as the
                    portal names it. Read from CropName on a case read; never
                    sent, because the application number already says which
                    policy and the portal resolves the crop from it.

                    Added by this pack rather than inherited: PMFBY tickets
                    carry a crop because the scheme insures one, and a
                    grievance system that is not crop insurance has nothing to
                    put here. It sits in case rather than beside cropYear and
                    season because the portal authors it -- the caller never
                    states it -- and that is the line the bands are drawn on.

                    Free text with no published vocabulary, so it is bounded
                    and otherwise unconstrained. Shown to the farmer, never
                    branched on.
                  x-jsonld-id: "openagrinet:cropName"

        # A Direct payload is a response, and a response with no case standing
        # is not an answer. Stated with anyOf and not with if/then: if/then is
        # parsed but never evaluated by the validator in use, so a guard
        # written that way looks like it holds and does not.
        #
        # There is deliberately no matching OnDemand branch here. What each
        # action must carry on the way in is enforced by that action's mapping
        # guard; what every ask must carry at all is the gate below.
        #
        # No provenance member. provider says which portal the case came from,
        # but on a contract leg it lives in commitments[].offer.provider rather
        # than in these attributes, so a guard on the attributes object cannot
        # reach it.
        - anyOf:
            - properties:
                informationMode:
                  enum: [OnDemand]
            - allOf:
                - required: [case]
                - properties:
                    case:
                      required: [ticketNo, status, filedOn]

        # Every payload must be about something. The same @type serves filing,
        # reading and acknowledging, and informationMode cannot tell them apart
        # -- all three asks are OnDemand -- so what separates them is what the
        # payload brought. One that brought none of these is asking for
        # nothing, and before the containers existed nothing caught it: a
        # grievance could go missing field by field and still validate.
        - anyOf:
            - required: [grievance]         # filing, or a case read echoing one
            - required: [case]              # reading one case by its ticket
            - required: [enrolmentId]       # reading by the application
            - required: [challengeIssued]   # acknowledging an OTP, which must
                                            # echo nothing else
            - required: [applicantPhone]    # asking for one: on init the phone
                                            # is the whole subject, since the
                                            # farmer has stated nothing yet
            - required: [challengeMethods]  # a catalog entry: it declares what
                                            # this desk needs and asks nothing,
                                            # so it brings none of the above
