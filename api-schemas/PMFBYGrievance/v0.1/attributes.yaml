openapi: 3.1.1
info:
  title: OpenAgriNet - PMFBY Grievance API Attributes
  version: 0.1.0
  description: >
    Attributes for grievances raised against the Pradhan Mantri Fasal Bima
    Yojana crop insurance scheme. This is an API schema, not a domain schema:
    it describes what the PMFBY grievance API accepts and returns, so an
    experience layer can call it without reading adapter mapping files.
    Attaches through commitmentAttributes: a grievance is a promise with a
    lifecycle of its own, not a catalogable resource.

    Self-contained on purpose. Everything this pack needs is defined in this
    file, apart from IdentifiedDescriptor, which the domain schemas already
    publish. A grievance is one Provider's API surface, not a thing the network
    describes, so nothing here is added to a domain pack for two API packs to
    share. The cost is that PM-KISAN restates the same case vocabulary; that is
    accepted, and the two are kept in step by review rather than by a $ref.

    Direction is carried by informationMode, never by the Beckn action.
    OnDemand is the ask, Direct is an answer carrying a real case. The same
    attributes serve init and status without change. On support the payload
    attaches through channels instead, and three fields move into the Support
    object itself. The channel also carries provider, which exists for that
    action alone: a SupportAction composes no Contract, so the adapter has
    nowhere else to read the provider from. The grievance is lodged with
    support, not confirm, so no confirm entry appears below.
    x-beckn-container-by-action says which container each action uses, and the
    per-field x-beckn-path says where a field that moves ends up.

components:
  schemas:
    PMFBYGrievance:
      type: object
      x-beckn-container: commitmentAttributes
      x-beckn-container-by-action:
        init: commitmentAttributes
        status: commitmentAttributes
        support: channels
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/api-schemas/PMFBYGrievance/v0.1/context.jsonld"
        "@type": openagrinet:PMFBYGrievance
      allOf:
        # PMFBY publishes no date against a remark, so the field is refused
        # rather than defined and left permanently absent. One member to delete
        # if the portal ever starts publishing one.
        - not:
            required: [remarkedOn]
        - type: object
          required: ["@type", "informationMode", "scheme"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:PMFBYGrievance
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:PMFBYGrievance
                  items:
                    oneOf:
                      - const: openagrinet:PMFBYGrievance
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.

            informationMode:
              type: string
              enum: [OnDemand, Direct]
              description: >
                Direction of this payload. OnDemand is the ask; Direct is an
                answer carrying a real case.

                Direction is carried by this field and never by the Beckn
                action, so the same attributes serve init and status without
                change.
              x-jsonld-id: "openagrinet:informationMode"

            provider:
              allOf:
                - $ref: "#/components/schemas/ProviderReference"
              description: >
                The portal this grievance belongs to: who it is filed with on
                the way in, and who the case came from on the way out. One
                field for both, because on a grievance they are always the same
                party -- the adapter reads a case back from the portal it filed
                with, and no third party stands between them.

                Carried in the attributes on the support leg only, and only
                because a SupportAction composes no Contract: every other
                action has one, and there the same fact is read from
                commitments[].offer.provider.

                Same shape in both places, deliberately. A reader writes
                .provider.id on support and .provider.id on the contract, and
                the adapter's own binding path says channels[].provider.id
                against a Beckn v2 default of commitments[].offer.provider.id
                -- the same grammar, the same tail, a different container.

                scheme.code names a scheme rather than a participant, so it
                cannot stand in.

                Not required, and deliberately not part of the Direct guard. On
                a contract leg the attributes genuinely do not carry it --
                Beckn's offer does -- so requiring it here would force a second
                copy into commitmentAttributes.
              x-jsonld-id: "openagrinet:provider"

            scheme:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  required: [code]
                  properties:
                    code:
                      enum: [PMFBY]
              description: >
                Scheme the grievance is raised against. Present on every payload in
                both directions, which is what makes it the one unconditional field.

                code is pinned because this pack describes PMFBY and nothing
                else, so there is exactly one legal value. Left open, a payload
                could name another scheme and still validate here -- the one field
                present on every payload would be the one field checking nothing.
                allOf narrowing is evaluated, so this is enforced rather than
                advisory. name is not pinned: the scheme has an official title but
                it is written differently in different places, and the network has
                no reason to arbitrate spelling. The title in the examples is
                "Pradhan Mantri Fasal Bima Yojana".
              x-jsonld-id: "openagrinet:scheme"

            applicantPhone:
              type: string
              pattern: "^[6-9][0-9]{9}$"
              x-oan-pii:
                class: contact
                handling: [no-log, no-trace, no-echo, mask-on-echo]
              description: >
                Mobile number of the farmer raising the grievance, and the number the
                portal sends the OTP to. Ten digits, Indian mobile series. Never
                returned in a response; on_init carries the masked challengeIssued.sentTo
                instead.
              x-jsonld-id: "openagrinet:applicantPhone"
            applicationNo:
              type: string
              minLength: 1
              maxLength: 64
              x-oan-pii:
                class: identifier
                handling: [no-log, no-trace]
                note: >
                  Identifies a named farmer's policy. Returned on a case read, so
                  no-echo would be wrong; it is the caller's own application number
                  coming back.
              description: >
                PMFBY crop insurance application number the grievance concerns.
                On support it is the orderId, the thing support is required
                against, and it holds that meaning in both directions: the ask
                sends it and on_support echoes it unchanged. The ticket the portal
                issues does not go there -- it comes back in ticketNo on the
                channel, because a ticket is not what the complaint is against.
              x-beckn-path:
                support: message.support.orderId
              x-jsonld-id: "openagrinet:applicationNo"
            cropYear:
              type: string
              pattern: "^[0-9]{4}$"
              description: >
                Crop year of the application, as a four-digit year. The portal
                returns request_year as a number, so the adapter stringifies it
                on the way back. It is the year of the application, not of the
                grievance: a 2025 crop year can carry a 2026 complaint date.
              x-jsonld-id: "openagrinet:cropYear"
            season:
              type: string
              enum: [Kharif, Rabi, Zaid]
              description: >
                Crop season of the application. PMFBY accepts three seasons and
                nothing else. The network carries the name; the adapter maps it to
                the numeric request_season the portal wants -- Kharif 1, Rabi 2,
                Zaid 3. Summer is the same season as Zaid and is sent as Zaid.
              x-jsonld-id: "openagrinet:season"
            grievanceCategory:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  properties:
                    code:
                      type: string
                      pattern: "^[0-9]+\\.[0-9]+$"
              description: >
                Category of the grievance. The code is the portal's category and
                sub-category joined by a dot, and the adapter splits it on that dot
                into two upstream fields, so the shape is load-bearing rather than
                cosmetic. The portal returns a name for each half on a case read
                and the adapter joins them with a slash, so name follows code.
                The portal publishes no list of valid pairs; see the pack README.
              x-beckn-path:
                support: message.support.descriptor.code and .name
                status: message.contract.descriptor.code and .name
              x-jsonld-id: "openagrinet:pmfbyGrievanceCategory"

            grievanceDescription:
              type: string
              minLength: 10
              maxLength: 2000
              x-oan-pii:
                class: freetext
                handling: [no-log, no-trace]
                note: >
                  Returned verbatim on a case read, so no-echo would be wrong. It is
                  the farmer's own words and may hold anything the schema cannot see.
              description: >
                The farmer's account of the problem, in their own words. A minimum
                length because a grievance that says nothing cannot be acted on, and
                a maximum because this is unvalidated free text arriving from a
                caller and going on to the portal. The portal publishes no upper
                limit, so the bound is the network's own and matches caseRemark:
                2000 characters, long enough for any real account of a problem.

                Does not travel inside the attributes object. x-beckn-path moves it
                to the Beckn descriptor, which is where a contract says what it is
                about -- so a client that does not know this pack still sees what
                was complained about.
              x-beckn-path:
                support: message.support.descriptor.longDesc
                status: message.contract.descriptor.longDesc
              x-jsonld-id: "openagrinet:grievanceDescription"

            challenge:
              type: object
              writeOnly: true
              required: [method, value]
              additionalProperties: false
              x-oan-pii:
                class: credential
                handling: [no-log, no-trace, no-echo, no-forward]
                note: Proven once by the verify call and never passed to the lodge call.
              properties:
                method:
                  type: string
                  enum: [SMS_OTP]
                  description: >
                    Authentication mechanism. PMFBY offers one: a six-digit OTP
                    texted to the registered mobile number. Supporting a second
                    mechanism later is widening this enum and pinning the format
                    its value takes; nothing about the carrier changes.
                  x-jsonld-id: "openagrinet:challengeMethod"
                value:
                  type: string
                  pattern: "^[0-9]{6}$"
                  writeOnly: true
                  x-oan-pii:
                    class: credential
                    handling: [no-log, no-trace, no-echo, no-forward]
                    note: Proven once against the portal and never carried further.
                  description: >
                    The OTP itself, six digits, since the portal rejects any
                    other length. The pattern is what enforces that -- allOf
                    narrowing is evaluated, so the rule is held by the pack and
                    not left to a mapping guard.

                    writeOnly is the contract: it travels inbound only and must
                    never be returned in a response, written to a log, or
                    attached to a trace.
                  x-jsonld-id: "openagrinet:challengeValue"
              description: >
                Proof of the phone number, presented when filing. No correlator
                field exists, and additionalProperties refuses one: PMFBY binds
                the challenge to the phone number alone and issues none, so a
                caller sending one is confused about the mechanism rather than
                being quietly ignored.

                writeOnly is the contract: the whole object travels inbound
                only. It must never be returned in any response, written to a
                log, or attached to a trace, and the value is never forwarded
                to the lodge call.
              x-jsonld-id: "openagrinet:challenge"

            ticketNo:
              type: string
              pattern: '^[0-9]+$'
              maxLength: 32
              description: >
                Portal grievance ticket number. Returned when a grievance is filed
                and presented again to read its replies, so it travels in both
                directions. It stays in the attributes on every leg -- no
                x-beckn-path moves it -- so on_support returns it here and leaves
                orderId holding the application number it arrived with. Digits only, and long enough not to be mistaken for a
                phone number: the live system routes a ten-digit answer to the phone
                and anything longer to the ticket, and observed tickets run twelve
                to fifteen digits. The exact length is not pinned because that range
                is described as typical, not as a rule; the maxLength is a sanity
                bound well clear of it, not a statement about the format.
              x-jsonld-id: "openagrinet:ticketNo"

            challengeIssued:
              type: object
              readOnly: true
              required: [method, sentTo, expiresAt]
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [SMS_OTP]
                  description: Mechanism the portal used. PMFBY offers SMS_OTP only.
                  x-jsonld-id: "openagrinet:challengeMethod"
                sentTo:
                  type: string
                  pattern: "^[0-9]{2}X{6}[0-9]{2}$"
                  x-oan-pii:
                    class: contact
                    handling: [no-log, no-trace]
                    note: Always the masked form of the destination, never the full number.
                  description: >
                    Masked destination, so the farmer can confirm which number
                    was used without the number being disclosed. PMFBY sends to
                    a phone, so the mask is a phone mask -- first two and last
                    two digits only, the six between them always X.
                  x-jsonld-id: "openagrinet:challengeSentTo"
                expiresAt:
                  type: string
                  format: date-time
                  description: >
                    When the challenge stops being accepted. Required because
                    the adapter always derives one, so a caller may rely on it.
                  x-jsonld-id: "openagrinet:challengeExpiresAt"
              description: >
                Acknowledgement that the portal has sent a challenge. Carries no
                secret: the OTP itself is never returned. No correlator field
                exists and additionalProperties refuses one, since PMFBY issues
                none. readOnly is the contract: this is returned and never sent.
              x-jsonld-id: "openagrinet:challengeIssued"

            caseStatus:
              allOf:
                - $ref: "../../../schema/AgricultureResource/v0.1/attributes.yaml#/components/schemas/IdentifiedDescriptor"
                - type: object
                  required: [code]
                  properties:
                    code:
                      $ref: "#/components/schemas/CaseStatusCode"
              description: >
                Where the grievance stands. code is the network's
                CaseStatusCode, which is what a client branches on; name is the
                portal's own status phrase, kept verbatim, which is what the
                farmer is shown.

                code is required and name is not, and the absence of name is
                informative: it is how a client tells a state the adapter
                inferred from one the portal stated. A lodge reply carries no
                status at all, so there is nothing to quote.

                A phrase the adapter does not recognise maps to UnderReview,
                keeping the phrase in name -- never to a terminal state, which
                must come from the portal. The adapter may infer a state; it
                must never infer that a case is finished.

                The enum is not narrowed. PMFBY publishes no full status
                vocabulary, so narrowing would be a guess that rejects a
                legitimate state.

                PMFBY note: name carries the portal's TicketStatus phrase. The
                portal also returns a numeric TicketStatusID, an opaque
                internal key that is not mapped -- the derived code replaces it.
              x-jsonld-id: "openagrinet:caseStatus"

            filedOn:
              $ref: "#/components/schemas/CalendarDate"
              description: >
                Date the grievance was filed with the portal. An IST calendar
                date: an adapter must take today's date in IST and not from a
                UTC clock, which would record the previous day for anything
                filed before 05:30 IST.

                PMFBY note: read from ComplaintDate, which the portal already
                sends as ISO. On a lodge the adapter generates it.
              x-jsonld-id: "openagrinet:filedOn"

            caseRemark:
              type: string
              minLength: 1
              maxLength: 2000
              x-oan-pii:
                class: freetext
                handling: [no-log, no-trace]
                note: Written about this farmer's case.
              description: >
                The most recent remark recorded against the case. Named for the
                case rather than for an author: a remark may come from a
                reviewing officer, from a body handling the claim, or from the
                system closing a record, and the portal publishes no reliable
                author. It is an annotation on a record, not necessarily a reply
                addressed to the farmer.

                Absent rather than empty while nothing has been recorded, so an
                absent field reads as "nothing recorded yet". Bounded at 2000
                characters because it is unvalidated upstream free text being
                placed in a response.

                PMFBY note: read from latestRemark. The portal sends an empty
                string while no remark exists; the adapter omits the field
                rather than passing the empty string through. PMFBY publishes no
                companion date, which is why this pack refuses remarkedOn.
              x-jsonld-id: "openagrinet:caseRemark"

        # Direction, not action. A response carrying a real case is Direct and
        # always names the case, its status, when it was filed and where it came
        # from -- true of on_support and on_status alike.
        #
        # There is deliberately no matching OnDemand branch. The ask side has no
        # field common to every payload: filing sends the phone, the application,
        # the season and the OTP; reading a case sends the phone and the ticket;
        # an OTP acknowledgement sends neither, because it must not echo the phone.
        # Requiring any of them here would reject a legitimate payload of some
        # other action, which is exactly the coupling this pack avoids. What each
        # action must carry is enforced by that action's mapping guard.
        - if:
            properties:
              informationMode:
                const: Direct
            required: [informationMode]
          # No provenance member here. provider says which portal the case came
          # from, but on a contract leg it lives in commitments[].offer.provider
          # rather than in these attributes, so a guard on the attributes object
          # cannot reach it. What this guard still asserts is what a Direct
          # response must say about the case itself.
          then:
            required: [ticketNo, caseStatus, filedOn]

    CaseStatusCode:
      type: string
      enum: [Registered, UnderReview, AwaitingApplicant, Replied, Resolved, Rejected, Closed]
      description: >
        Where a case stands, in the network's own vocabulary, rather than in the
        portal's wording.

        The split is deliberate. code is the network's word and is what a client
        branches on; the accompanying descriptor name is the portal's own phrase,
        kept verbatim, and is what a farmer is shown. A portal phrase the adapter
        does not recognise maps to UnderReview -- non-terminal, and honest -- with
        the phrase preserved in name. The adapter may infer a state; it must never
        infer that a case is finished, so anything unmapped stays non-terminal.

        The same seven values appear in the PM-KISAN pack. Each API pack stands
        on its own, so the list is restated there rather than shared through a
        domain schema; a change to one is a change to both.
      x-enum-details:
        - value: Registered
          meaning: Lodged and acknowledged by the portal, not yet picked up.
          terminal: false
        - value: UnderReview
          meaning: Being worked by the portal. Also the fallback for a portal phrase the adapter does not recognise.
          terminal: false
        - value: AwaitingApplicant
          meaning: Blocked on the applicant -- a document or a clarification is needed before work can continue.
          terminal: false
        - value: Replied
          meaning: A response has been recorded against the case, which remains open.
          terminal: false
        - value: Resolved
          meaning: Closed with action taken.
          terminal: true
        - value: Rejected
          meaning: Closed without action; the case was refused.
          terminal: true
        - value: Closed
          meaning: Closed with no further action -- lapsed, withdrawn, or closed automatically.
          terminal: true

    CalendarDate:
      type: string
      format: date
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: >
        A calendar date in IST, as YYYY-MM-DD.

        The pattern is what enforces the shape. format is annotation-only under
        the validator in use -- no string format is registered, so format: date
        alone would accept any string at all. The zone is named because a bare
        date has no day boundary of its own: an adapter deriving one from a UTC
        clock records the previous day for anything happening before 05:30 IST.

    ProviderReference:
      allOf:
        - $ref: "https://schema.beckn.io/Provider/v2.1/attributes.yaml#/components/schemas/Provider"
        # A reference to a participant, not a catalog entry about one. Beckn's
        # Provider carries both, so the two it does not need here are refused
        # rather than left to drift into the payload.
        - not:
            required: [availableAt]        # a grievance portal has no premises
        - not:
            required: [providerAttributes] # an attributes object inside a
                                           # channel that is already one
        - type: object
          # Beckn already requires both. Restated because a reader -- and the
          # page generator -- resolves this file without fetching the remote
          # schema, and would otherwise be told id is optional. It is the
          # routing key; nothing about it is optional.
          required: [id, descriptor]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9.-]*$"
              maxLength: 100
              description: >
                Network participant id, lower-case, matching the registry
                exactly. This is the only field the adapter routes on.
            descriptor:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >
                    Human-readable name of the provider. Beckn requires a
                    Provider to carry a descriptor, and a name is the only part
                    of one worth carrying here -- a code would merely repeat id.

                    Advisory, and never authoritative: the registry owns this
                    word. The adapter reads id and ignores name, so a caller
                    that sends a stale name is routed correctly anyway. It is
                    required because a participant id alone makes a payload
                    unreadable to anyone without the registry open.
      description: >
        A Beckn Provider narrowed to a reference: who this is, and nothing more.
        id is required and descriptor is required by Beckn itself; this
        narrowing adds the registry's id format and requires the descriptor to
        carry a name.
