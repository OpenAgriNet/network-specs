openapi: 3.1.1
info:
  title: OpenAgriNet - Agriculture Resource Attributes
  version: 0.1.0
  description: >
    Shared agriculture attributes for information published on OpenAgriNet.
    Attaches to beckn:Resource through resourceAttributes.

    It also holds the cross-cutting definitions every pack reuses rather than
    restates -- descriptors, addresses, locations, time periods, source
    references, and the authentication Challenge. A pack references one of
    these and narrows it; the definition stays in one place.

components:
  schemas:
    AgricultureResource:
      x-beckn-container: resourceAttributes
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/schema/AgricultureResource/v0.1/context.jsonld"
        "@type": openagrinet:AgricultureResource
      allOf:
        - $ref: "#/components/schemas/AgricultureResourceFields"
        - type: object
          required: ["@type"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:AgricultureResource
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:AgricultureResource
                  items:
                    oneOf:
                      - const: openagrinet:AgricultureResource
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.

    AgricultureResourceFields:
      type: object
      required: [informationMode, subjectCategories]
      properties:
        informationMode:
          type: string
          enum: [OnDemand, Direct]
          description: Whether obtaining specific information requires a Provider invocation or the Resource already contains or directly references that information.
          x-jsonld-id: "openagrinet:informationMode"
        subjectCategories:
          type: array
          minItems: 1
          uniqueItems: true
          description: Required broad discovery categories for the Resource. Concrete schema packs may refine the applicable categories. The Resource type is expressed by @type, not repeated here.
          items:
            type: string
            enum: [Crop, Livestock, Weather, Market, Scheme, Practice, Facility]
            x-enum-details:
              - value: Crop
                meaning: Crop production, protection, harvest, or crop-specific information.
                example: Cotton sowing guidance.
              - value: Livestock
                meaning: Farm animals, poultry, fisheries, animal health, or husbandry.
                example: Dairy cattle vaccination guidance.
              - value: Weather
                meaning: Weather conditions, forecasts, alerts, or weather-dependent information.
                example: District rainfall forecast.
              - value: Market
                meaning: Commodity prices, demand, trade, or market opportunities.
                example: Cotton modal price at an APMC.
              - value: Scheme
                meaning: Government or institutional schemes, benefits, and eligibility information.
                example: PM-KISAN eligibility guidance.
              - value: Practice
                meaning: A method used in farming or livestock management.
                example: Drip irrigation or integrated pest management.
              - value: Facility
                meaning: An agricultural service location or physical facility.
                example: KVK, warehouse, Custom Hiring Centre, or Soil Testing Facility.
          x-jsonld-id: "openagrinet:subjectCategories"
        agricultureSubjects:
          type: array
          minItems: 1
          uniqueItems: true
          description: Optional governed subjects such as a named crop, livestock species, pest, or scheme. Absence means the Resource applies broadly within subjectCategories.
          items:
            $ref: "#/components/schemas/AgricultureSubjectReference"
          x-jsonld-id: "openagrinet:agricultureSubjects"
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          description: BCP 47 language tags supported by or present in the Resource.
          items:
            type: string
            minLength: 2
          x-jsonld-id: "openagrinet:languages"
        coverageAreas:
          type: array
          minItems: 1
          uniqueItems: true
          description: Geographic areas within which the Resource applies. Each item is either an administrative area reference or a GeoJSON geometry.
          items:
            oneOf:
              - $ref: "#/components/schemas/AdministrativeAreaReference"
              - $ref: "#/components/schemas/CompleteGeoJSONGeometry"
          x-jsonld-id: "openagrinet:coverageAreas"

    AdministrativeAreaReference:
      type: object
      description: A governed administrative or postal area identified within a stated code system. Use a GeoJSON geometry instead when coverage is defined by coordinates.
      required: [codeScheme, areaCode]
      properties:
        codeScheme:
          type: string
          minLength: 1
          description: Geographic code system, such as ISO-3166-1, ISO-3166-2, LGD, or IN-PIN.
          x-jsonld-id: "openagrinet:areaCodeScheme"
        areaCode:
          type: string
          minLength: 1
          description: Area identifier in the stated scheme.
          x-jsonld-id: "openagrinet:areaCode"
        areaLevel:
          type: string
          enum: [Country, State, District, Block, Village, PostalCode, Other]
          description: Administrative or postal level represented by the code when known.
          x-jsonld-id: "openagrinet:areaLevel"
        areaName:
          type: string
          minLength: 1
          description: Optional human-readable area name.
          x-jsonld-id: "openagrinet:areaName"
      additionalProperties: false

    AgricultureSubjectReference:
      type: object
      description: A specific agricultural subject identified by a governed taxonomy URI, a Beckn Descriptor, or both.
      properties:
        subjectId:
          type: string
          format: uri
          description: Stable identifier from a governed agriculture taxonomy.
          x-jsonld-id: "openagrinet:subjectId"
        descriptor:
          $ref: "#/components/schemas/IdentifiedDescriptor"
          description: Beckn descriptor carrying the governed code and display name.
          x-jsonld-id: "https://schema.beckn.io/descriptor"
      anyOf:
        - required: [subjectId]
        - required: [descriptor]
      additionalProperties: false

    SourceReference:
      type: object
      description: Reference to the authoritative upstream source of information.
      required: [sourceId]
      properties:
        sourceId:
          type: string
          minLength: 1
          description: Stable identifier of the upstream source.
          x-jsonld-id: "openagrinet:sourceId"
        sourceName:
          type: string
          minLength: 1
          description: Human-readable source name.
          x-jsonld-id: "openagrinet:sourceName"
        sourceUri:
          type: string
          format: uri
          description: Authoritative public or Provider-supplied source URI.
          x-jsonld-id: "openagrinet:sourceUri"
      additionalProperties: false

    ChallengeMethod:
      type: string
      enum: [SMS_OTP, AADHAAR_OTP, DEVICE_TOKEN]
      description: >
        Authentication mechanism a challenge belongs to. This enum is the one
        place the network names a mechanism; adding a new one is a single entry
        here. Listing a mechanism does not make any Provider accept it: a pack
        narrows this to the mechanisms its upstream actually offers, and only a
        narrowed value is accepted on that pack's payloads.
      x-enum-details:
        - value: SMS_OTP
          meaning: A one-time password texted to a mobile number.
          example: Six digits sent to the farmer's registered phone.
        - value: AADHAAR_OTP
          meaning: A one-time password issued against an Aadhaar number through the UIDAI eKYC flow.
          example: Six digits sent to the number the Aadhaar is seeded with.
        - value: DEVICE_TOKEN
          meaning: A token proving the request comes from a registered device rather than from a person.
          example: A push-notification token the issuing service can verify.

    Challenge:
      type: object
      writeOnly: true
      description: >
        Proof a caller presents to satisfy an authentication challenge. Defined
        once for the whole network so that a pack needing one does not invent
        its own shape. method names the mechanism, value carries the proof.

        A pack narrows this through allOf -- method to the mechanisms its
        upstream offers, value to that mechanism's format. allOf narrowing is
        evaluated, so pinning a format in a pack keeps the format enforced;
        if/then on method would not be, which is why the discrimination lives
        in the pack rather than in a conditional here.
      required: [method, value]
      properties:
        method:
          $ref: "#/components/schemas/ChallengeMethod"
          x-jsonld-id: "openagrinet:challengeMethod"
        value:
          type: string
          minLength: 1
          writeOnly: true
          x-oan-pii:
            class: credential
            handling: [no-log, no-trace, no-echo, no-forward]
            note: Proven once against the upstream and never carried further.
          description: >
            The proof itself. writeOnly is the contract: it travels inbound
            only and must never be returned in a response, written to a log, or
            attached to a trace. Format depends on the mechanism, so the pack
            that narrows method pins the pattern too.
          x-jsonld-id: "openagrinet:challengeValue"
        txnId:
          type: string
          minLength: 1
          description: >
            Correlator for mechanisms whose upstream issues one when the
            challenge is sent and expects it back when the proof is presented.
            Absent for mechanisms that bind the challenge to the destination
            alone, which is how SMS_OTP works on both grievance portals.
          x-jsonld-id: "openagrinet:challengeTxnId"
      additionalProperties: false

    ChallengeIssued:
      type: object
      readOnly: true
      description: >
        Acknowledgement that a challenge has been issued. Carries no secret:
        it says which mechanism was used, where it went in masked form, and
        when it stops being accepted. Returned only; nothing sends it.
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/ChallengeMethod"
          x-jsonld-id: "openagrinet:challengeMethod"
        sentTo:
          type: string
          minLength: 1
          x-oan-pii:
            class: contact
            handling: [no-log, no-trace]
            note: Always the masked form of the destination, never the full identifier.
          description: >
            Where the challenge was sent, masked, so the caller can confirm the
            destination without the destination being disclosed. The masking
            rule depends on what kind of destination the mechanism uses, so the
            pack that narrows method pins the pattern.
          x-jsonld-id: "openagrinet:challengeSentTo"
        expiresAt:
          type: string
          format: date-time
          description: When the challenge stops being accepted.
          x-jsonld-id: "openagrinet:challengeExpiresAt"
        txnId:
          type: string
          minLength: 1
          description: >
            Correlator to present back with the proof, for mechanisms that
            issue one. Not a secret and not a substitute for the proof.
          x-jsonld-id: "openagrinet:challengeTxnId"
      additionalProperties: false

    TimePeriod:
      type: object
      description: Inclusive validity or applicability period.
      minProperties: 1
      properties:
        startsAt:
          type: string
          format: date-time
          description: Start of the period.
          x-jsonld-id: "openagrinet:startsAt"
        endsAt:
          type: string
          format: date-time
          description: End of the period.
          x-jsonld-id: "openagrinet:endsAt"
      additionalProperties: false

    ClosedTimePeriod:
      allOf:
        - $ref: "#/components/schemas/TimePeriod"
        - type: object
          required: [startsAt, endsAt]
      description: A bounded applicability period with both start and end timestamps. Conformance also verifies that startsAt is not after endsAt.

    IdentifiedDescriptor:
      allOf:
        - $ref: "https://schema.beckn.io/Descriptor/v2.1/attributes.yaml#/components/schemas/Descriptor"
        - type: object
          anyOf:
            - required: [code]
            - required: [name]
      description: A Beckn Descriptor with at least a machine-readable code or human-readable name.

    CompleteGeoJSONGeometry:
      allOf:
        - $ref: "https://schema.beckn.io/GeoJSONGeometry/v2.0/attributes.yaml#/components/schemas/GeoJSONGeometry"
        - oneOf:
            - type: object
              properties:
                type:
                  const: GeometryCollection
              required: [type, geometries]
            - type: object
              properties:
                type:
                  enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
              required: [type, coordinates]
      description: A GeoJSON geometry that includes coordinates, or geometries for a GeometryCollection.

    NonEmptyAddress:
      allOf:
        - $ref: "https://schema.beckn.io/Address/v2.0/attributes.yaml#/components/schemas/Address"
        - type: object
          minProperties: 1
      description: A Beckn postal address containing at least one address field.

    CompleteLocation:
      allOf:
        - $ref: "https://schema.beckn.io/Location/v2.0/attributes.yaml#/components/schemas/Location"
        - type: object
          required: [geo]
          properties:
            geo:
              $ref: "#/components/schemas/CompleteGeoJSONGeometry"
            address:
              $ref: "#/components/schemas/NonEmptyAddress"
      description: A Beckn Location with a complete GeoJSON geometry and an optional non-empty address.
