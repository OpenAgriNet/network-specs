openapi: 3.1.1
info:
  title: OpenAgriNet - Agriculture Resource Attributes
  version: 0.2.0
  description: >
    Shared agriculture attributes for information published on OpenAgriNet.
    Attaches to beckn:Resource through resourceAttributes.

components:
  schemas:
    AgricultureResource:
      x-beckn-container: resourceAttributes
      x-jsonld:
        "@context": "https://openagrinet.github.io/network-specs/schema/AgricultureResource/v0.2/context.jsonld"
        "@type": openagrinet:AgricultureResource
      allOf:
        - $ref: "#/components/schemas/AgricultureResourceFields"
        - type: object
          required: ["@type"]
          properties:
            "@type":
              oneOf:
                - type: string
                  const: openagrinet:AgricultureResource
                - type: array
                  minItems: 2
                  uniqueItems: true
                  contains:
                    const: openagrinet:AgricultureResource
                  items:
                    oneOf:
                      - const: openagrinet:AgricultureResource
                      - type: string
                        minLength: 1
                        not:
                          pattern: "^openagrinet:"
              description: Canonical OAN type, optionally accompanied by Provider-defined JSON-LD types.

    AgricultureResourceFields:
      type: object
      required: [informationMode, subjectCategories]
      allOf:
        - if:
            properties: {informationMode: {const: OnDemand}}
            required: [informationMode]
          then: {required: [actions]}
      properties:
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          description: Required for an OnDemand listing. Direct records can be consumed without an action.
          items:
            type: object
            additionalProperties: false
            required: [action, operationRef]
            properties:
              action: {type: string, minLength: 1}
              operationRef:
                type: string
                format: uri
                pattern: '^https?://[^#]+/openapi\.yaml#/paths/[^/]+/(get|post|put|patch|delete|head|options|trace)$'
                description: Absolute URI of the OpenAPI Operation Object (path and HTTP method), not an invocation URL.

        informationMode:
          type: string
          enum: [OnDemand, Direct]
          description: Whether obtaining specific information requires a Provider invocation or the Resource already contains or directly references that information.
          x-jsonld-id: "openagrinet:informationMode"
        subjectCategories:
          type: array
          minItems: 1
          uniqueItems: true
          description: Required broad discovery categories for the Resource. Concrete schema packs may refine the applicable categories. The Resource type is expressed by @type, not repeated here.
          items:
            type: string
            enum: [Crop, Livestock, Weather, Market, Scheme, Practice, Facility]
            x-enum-details:
              - value: Crop
                meaning: Crop production, protection, harvest, or crop-specific information.
                example: Cotton sowing guidance.
              - value: Livestock
                meaning: Farm animals, poultry, fisheries, animal health, or husbandry.
                example: Dairy cattle vaccination guidance.
              - value: Weather
                meaning: Weather conditions, forecasts, alerts, or weather-dependent information.
                example: District rainfall forecast.
              - value: Market
                meaning: Commodity prices, demand, trade, or market opportunities.
                example: Cotton modal price at an APMC.
              - value: Scheme
                meaning: Government or institutional schemes, benefits, and eligibility information.
                example: PM-KISAN eligibility guidance.
              - value: Practice
                meaning: A method used in farming or livestock management.
                example: Drip irrigation or integrated pest management.
              - value: Facility
                meaning: An agricultural service location or physical facility.
                example: KVK, warehouse, Custom Hiring Centre, or Soil Testing Facility.
          x-jsonld-id: "openagrinet:subjectCategories"
        agricultureSubjects:
          type: array
          minItems: 1
          uniqueItems: true
          description: Optional governed subjects such as a named crop, livestock species, pest, or scheme. Absence means the Resource applies broadly within subjectCategories.
          items:
            $ref: "#/components/schemas/AgricultureSubjectReference"
          x-jsonld-id: "openagrinet:agricultureSubjects"
        applicability:
          $ref: "#/components/schemas/AgriculturalApplicability"
          description: Optional structured applicability. Entries are OR; different conditions inside one entry are AND. Preserve entry correlation when filtering. Missing facts or unsupported extensions mean unknown, not a match. Absence does not establish universal applicability.
          x-jsonld-id: "openagrinet:applicability"
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          description: BCP 47 language tags supported by or present in the Resource.
          items:
            type: string
            minLength: 2
          x-jsonld-id: "openagrinet:languages"
        coverageAreas:
          type: array
          minItems: 1
          uniqueItems: true
          description: Geographic areas within which the Resource applies. Each item is either an administrative area reference or a GeoJSON geometry supplied directly. A coverage item is not a Beckn Location and does not wrap the geometry in a geo property. Use a pack-specific location field when representing a resolved physical place.
          items:
            oneOf:
              - $ref: "#/components/schemas/AdministrativeAreaReference"
              - $ref: "#/components/schemas/CompleteGeoJSONGeometry"
          x-jsonld-id: "openagrinet:coverageAreas"

    AgriculturalApplicability:
      type: array
      minItems: 1
      description: Alternative sets of agricultural applicability conditions. A recommendation-level set further narrows the resource-level set; both must match. Validity remains a separate absolute interval.
      items:
        $ref: "#/components/schemas/ApplicabilityCondition"

    ApplicabilityCondition:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Conditions that must hold together. Values within each list are alternatives. Do not independently flatten subjects and seasons across condition objects.
      properties:
        subjectIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uri}
          description: Governed subjects to which this condition applies. Use the same identifiers as agricultureSubjects, not another crop-name taxonomy.
        seasons:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/AgronomicCode"}
          description: Regional agricultural seasons. Kharif, Rabi, Navarai and Samba are examples, not a closed universal enumeration. Season identity does not imply fixed dates or a particular year.
        growthStages:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/AgronomicCode"}
          description: Observed developmental stages. Identify the crop-specific coding system and version; preserve codes as strings. Never infer a stage from age alone.
        relativeTiming:
          $ref: "#/components/schemas/RelativeTiming"
        establishmentMethods:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [DirectSeeded, Transplanted]}
          description: How the crop was established. DirectSeeded means seed placed at the production site; Transplanted means established seedlings moved there. Omit for unrelated or unknown cases.
        waterRegimes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [Rainfed, Irrigated]}
          description: Rainfed relies on rainfall; Irrigated receives managed supplemental water. Do not infer this condition from season or geography.
        extensions:
          type: object
          minProperties: 1
          propertyNames: {type: string, format: uri, pattern: '^https?://'}
          additionalProperties: true
          description: Provider-owned applicability qualifiers keyed by absolute HTTP(S) vocabulary IRIs. Values are preserved as JSON. A consumer that lacks the agreed extension schema or evaluator must report unknown applicability, never silently ignore the qualifier. This field does not advertise automatic support or automatic indexing.

    AgronomicCode:
      type: object
      additionalProperties: false
      required: [codeSystem, code]
      properties:
        codeSystem:
          type: string
          format: uri
          description: URI identifying the vocabulary and its version, including crop-specific stage keys where relevant.
        code:
          type: string
          minLength: 1
          description: Exact code within the stated vocabulary. Preserve leading zeros.
        label:
          type: string
          minLength: 1
          description: Human-readable label; identity is the codeSystem and code pair.

    RelativeTiming:
      type: object
      additionalProperties: false
      required: [event]
      anyOf:
        - required: [fromDays]
        - required: [toDays]
      description: Inclusive non-negative local-calendar days from the named event, with the event date as day zero. At least one bound is supplied. When both exist, fromDays must not exceed toDays; this comparison needs semantic validation. A missing event date makes matching unknown. Pre-event negative offsets are not supported in this proposal.
      properties:
        event:
          type: string
          enum: [Sowing, Transplanting, Emergence, Pruning, Harvest]
          description: Sowing is seed placement; Transplanting is moving seedlings to the production site; Emergence is observed seedling emergence; Pruning is the relevant pruning operation; Harvest is the relevant harvest operation. Identify the correct crop cycle and event occurrence before computing age.
        fromDays:
          type: integer
          minimum: 0
          description: Inclusive lower bound. For example 20 means day 20 or later after the named event.
        toDays:
          type: integer
          minimum: 0
          description: Inclusive upper bound. For example 30 means up to and including day 30 after the named event.

    AdministrativeAreaReference:
      type: object
      description: A governed administrative or postal area identified within a stated code system. Use a GeoJSON geometry instead when coverage is defined by coordinates.
      required: [codeScheme, areaCode]
      properties:
        codeScheme:
          type: string
          minLength: 1
          description: Geographic code system, such as ISO-3166-1, ISO-3166-2, LGD, or IN-PIN.
          x-jsonld-id: "openagrinet:areaCodeScheme"
        areaCode:
          type: string
          minLength: 1
          description: Area identifier in the stated scheme.
          x-jsonld-id: "openagrinet:areaCode"
        areaLevel:
          type: string
          enum: [Country, State, District, Block, Village, PostalCode, Other]
          description: Administrative or postal level represented by the code when known.
          x-jsonld-id: "openagrinet:areaLevel"
        areaName:
          type: string
          minLength: 1
          description: Optional human-readable area name.
          x-jsonld-id: "openagrinet:areaName"
      additionalProperties: false

    AgricultureSubjectReference:
      type: object
      description: A specific agricultural subject identified by a governed taxonomy URI, a Beckn Descriptor, or both.
      properties:
        subjectId:
          type: string
          format: uri
          description: Stable identifier from a governed agriculture taxonomy.
          x-jsonld-id: "openagrinet:subjectId"
        descriptor:
          $ref: "#/components/schemas/IdentifiedDescriptor"
          description: Beckn descriptor carrying the governed code and display name.
          x-jsonld-id: "https://schema.beckn.io/descriptor"
      anyOf:
        - required: [subjectId]
        - required: [descriptor]
      additionalProperties: false

    SourceReference:
      type: object
      description: Reference to the authoritative upstream source of information.
      required: [sourceId]
      properties:
        sourceId:
          type: string
          minLength: 1
          description: Stable identifier of the upstream source.
          x-jsonld-id: "openagrinet:sourceId"
        sourceName:
          type: string
          minLength: 1
          description: Human-readable source name.
          x-jsonld-id: "openagrinet:sourceName"
        sourceUri:
          type: string
          format: uri
          description: Authoritative public or Provider-supplied source URI.
          x-jsonld-id: "openagrinet:sourceUri"
      additionalProperties: false

    TimePeriod:
      type: object
      description: Inclusive validity or applicability period.
      minProperties: 1
      properties:
        startsAt:
          type: string
          format: date-time
          description: Start of the period.
          x-jsonld-id: "openagrinet:startsAt"
        endsAt:
          type: string
          format: date-time
          description: End of the period.
          x-jsonld-id: "openagrinet:endsAt"
      additionalProperties: false

    ClosedTimePeriod:
      allOf:
        - $ref: "#/components/schemas/TimePeriod"
        - type: object
          required: [startsAt, endsAt]
      description: A bounded applicability period with both start and end timestamps. Conformance also verifies that startsAt is not after endsAt.

    IdentifiedDescriptor:
      allOf:
        - $ref: "https://schema.beckn.io/Descriptor/v2.1/attributes.yaml#/components/schemas/Descriptor"
        - type: object
          anyOf:
            - required: [code]
            - required: [name]
      description: A Beckn Descriptor with at least a machine-readable code or human-readable name.

    CompleteGeoJSONGeometry:
      allOf:
        - $ref: "https://schema.beckn.io/GeoJSONGeometry/v2.0/attributes.yaml#/components/schemas/GeoJSONGeometry"
        - oneOf:
            - type: object
              properties:
                type:
                  const: GeometryCollection
              required: [type, geometries]
            - type: object
              properties:
                type:
                  enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
              required: [type, coordinates]
      description: A GeoJSON geometry that includes coordinates, or geometries for a GeometryCollection.

    NonEmptyAddress:
      allOf:
        - $ref: "https://schema.beckn.io/Address/v2.0/attributes.yaml#/components/schemas/Address"
        - type: object
          minProperties: 1
      description: A Beckn postal address containing at least one address field.

    CompleteLocation:
      allOf:
        - $ref: "https://schema.beckn.io/Location/v2.0/attributes.yaml#/components/schemas/Location"
        - type: object
          required: [geo]
          properties:
            geo:
              $ref: "#/components/schemas/CompleteGeoJSONGeometry"
            address:
              $ref: "#/components/schemas/NonEmptyAddress"
      description: A Beckn Location with a complete GeoJSON geometry and an optional non-empty address.
