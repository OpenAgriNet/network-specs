openapi: 3.1.1
info:
  title: SchemeApplication catalog attributes
  version: 0.1.0
  description: Public discovery metadata only. Private operations are defined in api-specs.
    See https://openagrinet.github.io/network-specs/api-specs/SchemeApplication/v0.1/.
components:
  schemas:
    SchemeApplication:
      description: Public discovery metadata only. Private operations are defined
        in api-specs. See https://openagrinet.github.io/network-specs/api-specs/SchemeApplication/v0.1/.
      x-beckn-container: resourceAttributes
      x-jsonld:
        '@context': https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.1/context.jsonld
        '@type': openagrinet:SchemeApplication
      oneOf:
      - $ref: '#/components/schemas/PMKISANApplicationCatalog'
    PMKISANApplicationCatalog:
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - challenge
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              const: PM-KISAN
              type: string
              enum:
              - PM-KISAN
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context
            array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.1/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.1/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:SchemeApplication
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:SchemeApplication
            items:
              oneOf:
              - const: openagrinet:SchemeApplication
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        challenge:
          type: object
          additionalProperties: false
          required:
          - methods
          description: The verification this desk requires before it answers.
          properties:
            methods:
              type: array
              minItems: 1
              uniqueItems: true
              description: Verification methods this desk accepts.
              items:
                type: object
                additionalProperties: false
                required:
                - method
                - channel
                - length
                - valueType
                properties:
                  method:
                    type: string
                    enum:
                    - OTP
                    description: The kind of verification.
                  channel:
                    type: string
                    enum:
                    - SMS
                    description: How the OTP reaches the applicant.
                  length:
                    type: integer
                    enum:
                    - 4
                    description: How many digits the OTP has.
                  valueType:
                    type: string
                    enum:
                    - NUMERIC
                    description: What the OTP is made of.
              x-jsonld-id: openagrinet:challengeMethods
          x-jsonld-id: openagrinet:challenge
        actions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Every call this desk serves.
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - description
            - schema
            - attributesAt
            properties:
              action:
                type: string
                enum:
                - init
                - status
                description: The Beckn action this entry describes.
                x-jsonld-id: openagrinet:actionName
              description:
                type: string
                minLength: 1
                maxLength: 400
                description: What the call does, in the desk's own words.
                x-jsonld-id: openagrinet:actionDescription
              schema:
                type: string
                format: uri
                pattern: ^https://openagrinet\.github\.io/network-specs/schema/SchemeApplication/v0\.1/attributes\.yaml#/components/schemas/[A-Za-z]+$
                description: The schema in this pack the call's attributes must match.
                x-jsonld-id: openagrinet:actionSchema
              attributesAt:
                type: string
                pattern: ^\$\.message\.[A-Za-z0-9.\[\]]+$
                description: Where the call's attributes sit in the Beckn payload.
                x-jsonld-id: openagrinet:actionAttributesAt
            oneOf:
            - properties:
                action:
                  const: init
                description:
                  default: Ask PM-KISAN to send a four-digit OTP, identified by either
                    the registration number or the registered mobile. Call before
                    status, which requires challenge.response carrying this OTP.
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.1/attributes.yaml#/components/schemas/PMKISANApplicationInit
                attributesAt:
                  const: $.message.contract.commitments[0].commitmentAttributes
            - properties:
                action:
                  const: status
                description:
                  default: 'Read how far the application has got: when it was registered,
                    the latest instalment paid, whether eKYC is done, and anything
                    blocking payment. Needs the OTP from init, and either the registration
                    number or the registered mobile.'
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/SchemeApplication/v0.1/attributes.yaml#/components/schemas/PMKISANApplicationStatus
                attributesAt:
                  const: $.message.contract.commitments[0].commitmentAttributes
          x-jsonld-id: openagrinet:publishedAction
      additionalProperties: false
    SchemeApplicationCatalog:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/SchemeApplicationCatalog
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    SchemeApplicationInit:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/SchemeApplicationInit
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    SchemeApplicationStatus:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/SchemeApplicationStatus
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    IsPMKISAN:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/IsPMKISAN
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    PMKISANApplicationInit:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/PMKISANApplicationInit
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    PMKISANApplicationStatus:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/PMKISANApplicationStatus
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    Applicant:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/Applicant
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    PMKISANEnrolmentId:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/PMKISANEnrolmentId
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    PMKISANChallengeResponse:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/PMKISANChallengeResponse
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    PublishedAction:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/PublishedAction
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    Instant:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/Instant
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    Context:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/Context
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    Type:
      $ref: ../../../api-specs/SchemeApplication/v0.1/openapi.yaml#/components/schemas/Type
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
