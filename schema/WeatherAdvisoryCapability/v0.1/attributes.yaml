openapi: 3.1.1
info:
  title: OpenAgriNet - Weather Advisory Capability Attributes
  version: 0.1.0
  description: >
    Provider capability metadata for producing weather-informed agricultural
    advice. Combines with AdvisoryCapability through allOf and attaches to a
    Beckn Resource through resourceAttributes.

components:
  schemas:
    WeatherAdvisoryCapability:
      type: object
      x-beckn-container: resourceAttributes
      x-jsonld:
        "@context": "https://schemas.openagrinet.global/schema/WeatherAdvisoryCapability/v0.1/context.jsonld"
        "@type": openagrinet:WeatherAdvisoryCapability
      allOf:
        - $ref: "../../AdvisoryCapability/v0.1/attributes.yaml#/components/schemas/AdvisoryCapability"
        - type: object
          required: [weatherParameters, geographicGranularity]
          properties:
            weatherParameters:
              type: array
              minItems: 1
              uniqueItems: true
              description: Weather parameters the Provider can use to produce advice.
              items:
                type: string
                enum: [Rainfall, Temperature, Humidity, WindSpeed, WindDirection, SoilMoisture, Evapotranspiration, Alert]
              x-jsonld-id: "openagrinet:weatherParameters"
            forecastHorizon:
              type: string
              format: duration
              description: Maximum supported forecast horizon expressed as an ISO 8601 duration.
              x-jsonld-id: "openagrinet:forecastHorizon"
            updateFrequency:
              type: string
              format: duration
              description: Expected refresh interval expressed as an ISO 8601 duration.
              x-jsonld-id: "openagrinet:updateFrequency"
            geographicGranularity:
              type: string
              enum: [Point, Village, Block, District, State]
              description: Smallest geographic granularity for which the capability provides meaningful guidance.
              x-jsonld-id: "openagrinet:geographicGranularity"
