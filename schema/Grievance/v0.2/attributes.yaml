openapi: 3.1.1
info:
  title: Grievance catalog attributes
  version: 0.2.0
  description: Public catalog metadata for grievance services, with Provider-defined schemes, complaint
    options and operation links.
externalDocs:
  description: External service API specifications
  url: https://openagrinet.github.io/network-specs/api/external/
components:
  schemas:
    Grievance:
      description: Reusable public catalog metadata. Provider-specific request and response validation
        belongs to the linked API contract, not a closed list of catalog variants.
      x-beckn-container: resourceAttributes
      x-jsonld:
        '@context': https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type': openagrinet:Grievance
      x-oan-schema-by-action:
        init: GrievanceCall
        status: GrievanceCall
        support: GrievanceCall
      allOf:
      - $ref: '#/components/schemas/GrievanceFields'
      unevaluatedProperties: false
    GrievanceCall:
      description: A request or response payload for one of this capability's actions. v0.2 leaves
        operation-specific validation to the Provider API contract that the catalog's actions[].operationRef
        names, so this checks only that the payload claims this pack and this type.
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          description: This pack's JSON-LD context.
          type: string
          minLength: 1
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
      additionalProperties: true
    PMFBYCatalog:
      externalDocs:
        description: PMFBY grievance API specification
        url: https://openagrinet.github.io/network-specs/api/external/pmfby/grievance/v0.2/openapi.yaml
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - grievanceOptions
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              const: PMFBY
              type: string
              enum:
              - PMFBY
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        grievanceOptions:
          type: object
          additionalProperties: false
          required:
          - categories
          - subCategories
          description: The categories a grievance can be filed under.
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Top-level grievance categories.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category or sub-category PMFBY publishes.
                properties:
                  code:
                    type: string
                    pattern: ^[0-9]+$
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceCategoryOption
            subCategories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Sub-categories under those.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category or sub-category PMFBY publishes.
                properties:
                  code:
                    type: string
                    pattern: ^[0-9]+$
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceSubCategoryOption
          x-jsonld-id: openagrinet:grievanceOptions
        actions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Advertised provider operations.
          items:
            enum:
            - action: support
              operationRef: https://openagrinet.github.io/network-specs/api/external/pmfby/grievance/v0.2/openapi.yaml#/paths/~1krphapi~1FGMS~1AddKRPHNCIPGrievenceSupportTicket/post
            - action: status
              operationRef: https://openagrinet.github.io/network-specs/api/external/pmfby/grievance/v0.2/openapi.yaml#/paths/~1krphapi~1FGMS~1GetGrievenceTicketsStatus/post
          x-jsonld-id: openagrinet:publishedAction
      additionalProperties: false
    PMKISANCatalog:
      externalDocs:
        description: PM-KISAN grievance API specification
        url: https://openagrinet.github.io/network-specs/api/external/pm-kisan/grievance/v0.2/openapi.yaml
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - challenge
      - grievanceOptions
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              const: PM-KISAN
              type: string
              enum:
              - PM-KISAN
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        challenge:
          type: object
          additionalProperties: false
          required:
          - methods
          description: The verification this desk requires before it answers.
          properties:
            methods:
              type: array
              minItems: 1
              uniqueItems: true
              description: Verification methods this desk accepts.
              items:
                type: object
                additionalProperties: false
                required:
                - method
                - channel
                - length
                - valueType
                properties:
                  method:
                    type: string
                    enum:
                    - OTP
                    description: The kind of verification.
                  channel:
                    type: string
                    enum:
                    - SMS
                    description: How the OTP reaches the applicant.
                  length:
                    type: integer
                    enum:
                    - 4
                    description: How many digits the OTP has.
                  valueType:
                    type: string
                    enum:
                    - NUMERIC
                    description: What the OTP is made of.
              x-jsonld-id: openagrinet:challengeMethods
          x-jsonld-id: openagrinet:challenge
        grievanceOptions:
          type: object
          additionalProperties: false
          required:
          - categories
          description: The categories a grievance can be filed under.
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Top-level grievance categories.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category PM-KISAN publishes.
                properties:
                  code:
                    type: string
                    enum:
                    - G001
                    - G002
                    - G003
                    - G004
                    - G005
                    - G006
                    - G007
                    - G008
                    - G009
                    - G010
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceCategoryOption
          x-jsonld-id: openagrinet:grievanceOptions
        actions:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          description: Advertised provider operations.
          items:
            enum:
            - action: init
              operationRef: https://openagrinet.github.io/network-specs/api/external/pm-kisan/grievance/v0.2/openapi.yaml#/paths/~1ChatbotOTP/post
            - action: status
              operationRef: https://openagrinet.github.io/network-specs/api/external/pm-kisan/grievance/v0.2/openapi.yaml#/paths/~1GrievanceStatusCheck/post
            - action: support
              operationRef: https://openagrinet.github.io/network-specs/api/external/pm-kisan/grievance/v0.2/openapi.yaml#/paths/~1LodgeGrievance/post
          x-jsonld-id: openagrinet:publishedAction
      additionalProperties: false
    GrievanceFields:
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - grievanceOptions
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              type: string
              minLength: 1
              description: Provider-defined scheme code, for example PMFBY or PM-KISAN. Other non-empty
                codes are accepted.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
          additionalProperties: false
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme on demand.
          x-jsonld-id: openagrinet:informationMode
        grievanceOptions:
          type: object
          additionalProperties: false
          required:
          - categories
          description: Provider-published complaint categories and optional sub-categories. Codes are
            data, not a fixed schema enumeration.
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Available complaint categories.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                properties:
                  code:
                    type: string
                    minLength: 1
                    description: Provider-defined option code. Read the advertised options; there is no
                      centrally fixed code list.
                  name:
                    type: string
                    minLength: 1
                    description: Display label for this option.
                  help:
                    type: string
                    minLength: 1
                    description: When to select this option.
            subCategories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Additional complaint sub-categories, when published.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                properties:
                  code:
                    type: string
                    minLength: 1
                    description: Provider-defined option code. Read the advertised options; there is no
                      centrally fixed code list.
                  name:
                    type: string
                    minLength: 1
                    description: Display label for this option.
                  help:
                    type: string
                    minLength: 1
                    description: When to select this option.
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          description: Advertised operations and their request-schema links. API contracts define operation-specific
            restrictions.
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - operationRef
            properties:
              action:
                type: string
                minLength: 1
                description: Beckn action advertised by this Provider. The linked operation contract defines
                  its semantics.
              description:
                type: string
                minLength: 1
                description: What the operation does.
              schema:
                type: string
                format: uri
                description: URI of the request schema in the Provider API contract. Resolve that contract
                  to validate operation inputs; this URI is not an allow-list.
              operationRef:
                type: string
                format: uri
                pattern: '^https?://[^#]+/openapi\.yaml#/paths/[^/]+/(get|post|put|patch|delete|head|options|trace)$'
                description: Absolute URI of the OpenAPI Operation Object (path and HTTP method), not an invocation URL.
              attributesAt:
                type: string
                pattern: ^\$\.message\.[A-Za-z0-9.\[\]]+$
                description: Path to operation attributes in the Beckn message.
        challenge:
          type: object
          additionalProperties: false
          required:
          - methods
          description: Optional public verification requirements. Do not put issued challenges, destinations
            or secret responses in catalog metadata. The API contract defines when verification is required.
          properties:
            methods:
              type: array
              description: Public verification methods advertised by the Provider.
              minItems: 1
              uniqueItems: true
              items:
                type: object
                additionalProperties: false
                required:
                - method
                properties:
                  method:
                    type: string
                    minLength: 1
                    description: Provider-defined verification method, for example OTP.
                  channel:
                    type: string
                    minLength: 1
                    description: Delivery channel when applicable, for example SMS or EMAIL.
                  length:
                    type: integer
                    minimum: 1
                    description: Expected code length when the method uses a fixed-length code.
                  valueType:
                    type: string
                    minLength: 1
                    description: Expected code representation when applicable, for example NUMERIC.
      description: Public catalog fields shared by any Provider. Codes are Provider-defined non-empty
        strings.
