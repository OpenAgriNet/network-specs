openapi: 3.1.1
info:
  title: Grievance catalog attributes
  version: 0.2.0
  description: Public catalog metadata for grievance services, with Provider-defined schemes, complaint
    options and operation links.
externalDocs:
  description: External service API specifications
  url: https://openagrinet.github.io/network-specs/api/external/
components:
  schemas:
    Grievance:
      description: Reusable public catalog metadata. Provider-specific request and response validation
        belongs to the linked API contract, not a closed list of catalog variants.
      x-beckn-container: resourceAttributes
      x-jsonld:
        '@context': https://openagrinet.github.io/network-specs/schema/Grievance/v0.2/context.jsonld
        '@type': openagrinet:Grievance
      allOf:
      - $ref: '#/components/schemas/GrievanceFields'
      unevaluatedProperties: false
    PMFBYCatalog:
      $ref: ../../../api/external/pmfby/grievance/v0.2/openapi.yaml#/components/schemas/PMFBYCatalog
      description: Compatibility reference to the external service catalog definition.
    PMKISANCatalog:
      $ref: ../../../api/external/pm-kisan/grievance/v0.2/openapi.yaml#/components/schemas/PMKISANCatalog
      description: Compatibility reference to the external service catalog definition.
    GrievanceCatalog:
      $ref: ../../../api-specs/Grievance/v0.2/openapi.yaml#/components/schemas/GrievanceCatalog
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    GrievanceInit:
