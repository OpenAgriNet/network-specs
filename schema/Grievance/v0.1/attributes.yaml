openapi: 3.1.1
info:
  title: Grievance catalog attributes
  version: 0.1.0
  description: Public discovery metadata only. Private operations are defined in api-specs.
    See https://openagrinet.github.io/network-specs/api-specs/Grievance/v0.1/.
components:
  schemas:
    Grievance:
      description: Public discovery metadata only. Private operations are defined
        in api-specs. See https://openagrinet.github.io/network-specs/api-specs/Grievance/v0.1/.
      x-beckn-container: resourceAttributes
      x-jsonld:
        '@context': https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/context.jsonld
        '@type': openagrinet:Grievance
      oneOf:
      - $ref: '#/components/schemas/PMFBYCatalog'
      - $ref: '#/components/schemas/PMKISANCatalog'
    PMFBYCatalog:
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - grievanceOptions
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              const: PMFBY
              type: string
              enum:
              - PMFBY
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context
            array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        grievanceOptions:
          type: object
          additionalProperties: false
          required:
          - categories
          - subCategories
          description: The categories a grievance can be filed under.
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Top-level grievance categories.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category or sub-category PMFBY publishes.
                properties:
                  code:
                    type: string
                    pattern: ^[0-9]+$
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceCategoryOption
            subCategories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Sub-categories under those.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category or sub-category PMFBY publishes.
                properties:
                  code:
                    type: string
                    pattern: ^[0-9]+$
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceSubCategoryOption
          x-jsonld-id: openagrinet:grievanceOptions
        actions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Every call this desk serves.
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - description
            - schema
            - attributesAt
            properties:
              action:
                type: string
                enum:
                - init
                - status
                - support
                description: The Beckn action this entry describes.
                x-jsonld-id: openagrinet:actionName
              description:
                type: string
                minLength: 1
                maxLength: 400
                description: What the call does, in the desk's own words.
                x-jsonld-id: openagrinet:actionDescription
              schema:
                type: string
                format: uri
                pattern: ^https://openagrinet\.github\.io/network-specs/schema/Grievance/v0\.1/attributes\.yaml#/components/schemas/[A-Za-z]+$
                description: The schema in this pack the call's attributes must match.
                x-jsonld-id: openagrinet:actionSchema
              attributesAt:
                type: string
                pattern: ^\$\.message\.[A-Za-z0-9.\[\]]+$
                description: Where the call's attributes sit in the Beckn payload.
                x-jsonld-id: openagrinet:actionAttributesAt
            oneOf:
            - properties:
                action:
                  const: support
                description:
                  default: File a new grievance. Needs the enrolment number, the applicant's
                    mobile, the crop year, the season and a description of the problem.
                    Returns case.ticketNo, which status requires. Needs no OTP, so
                    it can be called without init.
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/attributes.yaml#/components/schemas/PMFBYSupport
                attributesAt:
                  const: $.message.support.channels[0]
            - properties:
                action:
                  const: status
                description:
                  default: 'Read where a filed grievance stands: its status code,
                    the portal''s reply and the crop it concerns. Needs case.ticketNo
                    from an earlier support call, plus the applicant''s mobile. Cases
                    cannot be listed by enrolment number, so support must come first.'
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/attributes.yaml#/components/schemas/PMFBYStatus
                attributesAt:
                  const: $.message.contract.commitments[0].commitmentAttributes
          x-jsonld-id: openagrinet:publishedAction
      additionalProperties: false
    PMKISANCatalog:
      type: object
      required:
      - scheme
      - '@context'
      - '@type'
      - informationMode
      - challenge
      - grievanceOptions
      - actions
      properties:
        scheme:
          type: object
          required:
          - code
          - name
          properties:
            code:
              const: PM-KISAN
              type: string
              enum:
              - PM-KISAN
              description: Short code naming the scheme.
            name:
              type: string
              minLength: 1
              description: The scheme's full name.
          additionalProperties: false
          description: The government scheme this payload is about.
          x-jsonld-id: openagrinet:scheme
        '@context':
          description: This pack's JSON-LD context, alone or inside a larger context
            array.
          oneOf:
          - type: string
            const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/context.jsonld
          - type: array
            minItems: 2
            uniqueItems: true
            items:
              type: string
              minLength: 1
            contains:
              const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/context.jsonld
        '@type':
          description: This pack's OAN type, alone or alongside the Provider's own
            types.
          oneOf:
          - type: string
            const: openagrinet:Grievance
          - type: array
            minItems: 2
            uniqueItems: true
            contains:
              const: openagrinet:Grievance
            items:
              oneOf:
              - const: openagrinet:Grievance
              - type: string
                minLength: 1
                not:
                  pattern: '^openagrinet:'
        informationMode:
          type: string
          enum:
          - OnDemand
          description: How this information is obtained. Always fetched from the scheme
            on demand.
          x-jsonld-id: openagrinet:informationMode
        challenge:
          type: object
          additionalProperties: false
          required:
          - methods
          description: The verification this desk requires before it answers.
          properties:
            methods:
              type: array
              minItems: 1
              uniqueItems: true
              description: Verification methods this desk accepts.
              items:
                type: object
                additionalProperties: false
                required:
                - method
                - channel
                - length
                - valueType
                properties:
                  method:
                    type: string
                    enum:
                    - OTP
                    description: The kind of verification.
                  channel:
                    type: string
                    enum:
                    - SMS
                    description: How the OTP reaches the applicant.
                  length:
                    type: integer
                    enum:
                    - 4
                    description: How many digits the OTP has.
                  valueType:
                    type: string
                    enum:
                    - NUMERIC
                    description: What the OTP is made of.
              x-jsonld-id: openagrinet:challengeMethods
          x-jsonld-id: openagrinet:challenge
        grievanceOptions:
          type: object
          additionalProperties: false
          required:
          - categories
          description: The categories a grievance can be filed under.
          properties:
            categories:
              type: array
              minItems: 1
              uniqueItems: true
              description: Top-level grievance categories.
              items:
                type: object
                additionalProperties: false
                required:
                - code
                description: A grievance category PM-KISAN publishes.
                properties:
                  code:
                    type: string
                    enum:
                    - G001
                    - G002
                    - G003
                    - G004
                    - G005
                    - G006
                    - G007
                    - G008
                    - G009
                    - G010
                    description: Code identifying the option.
                    x-jsonld-id: openagrinet:optionCode
                  name:
                    type: string
                    minLength: 1
                    description: The option's label.
                    x-jsonld-id: openagrinet:optionName
                  help:
                    type: string
                    minLength: 1
                    description: When to pick this option.
                    x-jsonld-id: openagrinet:optionHelp
              x-jsonld-id: openagrinet:grievanceCategoryOption
          x-jsonld-id: openagrinet:grievanceOptions
        actions:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          description: Every call this desk serves.
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - description
            - schema
            - attributesAt
            properties:
              action:
                type: string
                enum:
                - init
                - status
                - support
                description: The Beckn action this entry describes.
                x-jsonld-id: openagrinet:actionName
              description:
                type: string
                minLength: 1
                maxLength: 400
                description: What the call does, in the desk's own words.
                x-jsonld-id: openagrinet:actionDescription
              schema:
                type: string
                format: uri
                pattern: ^https://openagrinet\.github\.io/network-specs/schema/Grievance/v0\.1/attributes\.yaml#/components/schemas/[A-Za-z]+$
                description: The schema in this pack the call's attributes must match.
                x-jsonld-id: openagrinet:actionSchema
              attributesAt:
                type: string
                pattern: ^\$\.message\.[A-Za-z0-9.\[\]]+$
                description: Where the call's attributes sit in the Beckn payload.
                x-jsonld-id: openagrinet:actionAttributesAt
            oneOf:
            - properties:
                action:
                  const: init
                description:
                  default: 'Ask PM-KISAN to send a four-digit OTP to the mobile registered
                    against this enrolment number. Needs only the enrolment number.
                    Call before status or support: both require challenge.response
                    carrying this OTP.'
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/attributes.yaml#/components/schemas/PMKISANInit
                attributesAt:
                  const: $.message.contract.commitments[0].commitmentAttributes
            - properties:
                action:
                  const: status
                description:
                  default: 'Read a grievance already filed against this enrolment
                    number: its status code, the officer''s reply and when it was
                    given. Needs the OTP from init and case.filedOn, the filing date
                    support returned, which picks one case out of all those on the
                    registration.'
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/attributes.yaml#/components/schemas/PMKISANStatus
                attributesAt:
                  const: $.message.contract.commitments[0].commitmentAttributes
            - properties:
                action:
                  const: support
                description:
                  default: File a new grievance against this enrolment number, under
                    one of the categories published above. Needs the OTP from init.
                    Returns case.ticketNo and case.filedOn; keep filedOn, because
                    status selects a case by it.
                schema:
                  const: https://openagrinet.github.io/network-specs/schema/Grievance/v0.1/attributes.yaml#/components/schemas/PMKISANSupport
                attributesAt:
                  const: $.message.support.channels[0]
          x-jsonld-id: openagrinet:publishedAction
      additionalProperties: false
    GrievanceCatalog:
      $ref: ../../../api-specs/Grievance/v0.1/openapi.yaml#/components/schemas/GrievanceCatalog
      deprecated: true
      description: Compatibility alias. Use directional operation schemas in api-specs.
    GrievanceInit:
