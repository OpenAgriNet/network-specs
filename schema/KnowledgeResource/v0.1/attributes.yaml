openapi: 3.1.1
info:
  title: OpenAgriNet - Knowledge Resource Attributes
  version: 0.1.0
  description: >
    Attributes for agricultural knowledge that may be obtained on demand or
    supplied directly. Combines with AgricultureResource through allOf and
    attaches through resourceAttributes.

components:
  schemas:
    KnowledgeResource:
      type: object
      x-beckn-container: resourceAttributes
      x-jsonld:
        "@context": "https://schemas.openagrinet.global/schema/KnowledgeResource/v0.1/context.jsonld"
        "@type": openagrinet:KnowledgeResource
      allOf:
        - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/AgricultureResource"
        - type: object
          required: ["@type"]
          properties:
            "@type":
              type: string
              const: openagrinet:KnowledgeResource
              description: Canonical OAN type for this schema pack.
            topics:
              type: array
              minItems: 1
              uniqueItems: true
              description: Knowledge topics used for discovery and matching.
              items:
                type: string
                minLength: 1
              x-jsonld-id: "openagrinet:topics"
            supportedKnowledgeTypes:
              type: array
              minItems: 1
              uniqueItems: true
              description: Semantic kinds of knowledge the Provider can supply on demand.
              items:
                type: string
                enum: [Article, FAQ, Guide, Dataset, TrainingMaterial, Reference]
              x-jsonld-id: "openagrinet:supportedKnowledgeTypes"
            supportedMediaTypes:
              type: array
              minItems: 1
              uniqueItems: true
              description: IANA media types the Provider can return on demand.
              items:
                type: string
                minLength: 1
              x-jsonld-id: "openagrinet:supportedMediaTypes"
            knowledgeType:
              type: string
              enum: [Article, FAQ, Guide, Dataset, TrainingMaterial, Reference]
              description: Semantic kind of knowledge, independent of whether a representation is PDF, HTML, audio, video, JSON, or inline content.
              x-jsonld-id: "openagrinet:knowledgeType"
            version:
              type: string
              pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
              description: Semantic version of the governed knowledge Resource.
              x-jsonld-id: "openagrinet:version"
            lifecycleStatus:
              type: string
              enum: [Draft, Published, Superseded, Withdrawn]
              description: Publication lifecycle of this knowledge version, independent of Registry admission state.
              x-jsonld-id: "openagrinet:lifecycleStatus"
            content:
              type: array
              minItems: 1
              description: Governed representations of the knowledge Resource.
              items:
                type: object
                required: [mediaType]
                oneOf:
                  - required: [contentUri]
                    not:
                      required: [inlineContent]
                  - required: [inlineContent]
                    not:
                      required: [contentUri]
                properties:
                  contentUri:
                    type: string
                    format: uri
                    description: Provider-hosted location of the representation. It may require access through the Provider and does not imply a public download.
                    x-jsonld-id: "openagrinet:contentUri"
                  inlineContent:
                    type: [string, object, array]
                    description: Content carried directly in the Resource when no external representation is needed.
                    x-jsonld-id: "openagrinet:inlineContent"
                  mediaType:
                    type: string
                    minLength: 1
                    description: IANA media type of the representation.
                    x-jsonld-id: "openagrinet:mediaType"
                  language:
                    type: string
                    minLength: 2
                    description: BCP 47 language tag for this representation.
                    x-jsonld-id: "openagrinet:language"
                  digest:
                    type: string
                    minLength: 1
                    description: Optional integrity digest for the representation.
                    x-jsonld-id: "openagrinet:digest"
                additionalProperties: false
              x-jsonld-id: "openagrinet:content"
            validity:
              allOf:
                - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/TimePeriod"
              description: Period during which this knowledge version is applicable.
              x-jsonld-id: "openagrinet:validity"
            provenance:
              type: object
              required: [source, publishedAt]
              description: Source and review evidence for this knowledge version.
              properties:
                source:
                  allOf:
                    - $ref: "../../AgricultureResource/v0.1/attributes.yaml#/components/schemas/SourceReference"
                  description: Authoritative upstream source of the knowledge.
                  x-jsonld-id: "openagrinet:source"
                publishedAt:
                  type: string
                  format: date-time
                  description: Publication time of this version.
                  x-jsonld-id: "openagrinet:publishedAt"
                lastReviewedAt:
                  type: string
                  format: date-time
                  description: Most recent subject-matter review time.
                  x-jsonld-id: "openagrinet:lastReviewedAt"
                reviewedBy:
                  type: string
                  minLength: 1
                  description: Identifier of the person or organization responsible for the review.
                  x-jsonld-id: "openagrinet:reviewedBy"
              x-jsonld-id: "openagrinet:provenance"
            supersedes:
              type: string
              minLength: 1
              description: Identifier of the knowledge Resource version replaced by this one.
              x-jsonld-id: "openagrinet:supersedes"
        - if:
            properties:
              informationMode:
                const: OnDemand
            required: [informationMode]
          then:
            required: [topics, languages, supportedKnowledgeTypes]
            not:
              required: [content]
        - if:
            properties:
              informationMode:
                const: Direct
            required: [informationMode]
          then:
            required: [topics, languages, knowledgeType, version, lifecycleStatus, content, provenance]
